","Liga con contraste de temperatura: roux caliente con l\xEDquido fr\xEDo o templado, o roux fr\xEDo con l\xEDquido caliente. Bate con energ\xEDa, lleva a ebullici\xF3n y cuece al menos 10-15 minutos para que el almid\xF3n termine de hincharse."]},ratios:[{use:"Sopa crema o salsa ligera",ratio:"30-50 g de mantequilla y 30-50 g de harina por litro",note:"Apenas napa; para cremas y salsas que todav\xEDa van a reducir."},{use:"Salsa napante",ratio:"60 g + 60 g por litro",note:"Cubre la cuchara; bechamel de canelones o velout\xE9 de servicio."},{use:"Salsa espesa para ligar rellenos",ratio:"80 g + 80 g por litro",note:"Rellenos, bases de souffl\xE9, gratinados con guarnici\xF3n que suelta agua."},{use:"Masa de croquetas",ratio:"90-110 g + 90-110 g por litro",note:"M\xE1s con g\xE9neros h\xFAmedos (setas, bacalao, marisco), menos con jam\xF3n seco."},{use:"Roux oscuro",ratio:"Sube un 20-30 % la cantidad",note:"El tostado degrada parte del almid\xF3n y espesa menos."}],variants:[{id:null,name:"Roux blanco",note:"Para bechamel y salsas que deben quedar blancas."},{id:null,name:"Roux rubio",note:"Para velout\xE9 y salsas de ave o pescado."},{id:null,name:"Roux oscuro",note:"Para salsa espa\xF1ola y guisos oscuros; aporta sabor tostado."}],keys:["Pesa siempre: la proporci\xF3n 1:1 en peso es la que funciona, no a ojo.","Contraste de temperatura al ligar; si roux y l\xEDquido est\xE1n ambos muy calientes, salen grumos.","Despu\xE9s de ligar, cuece m\xEDnimo 10-15 minutos: si no, la salsa sabe a harina aunque el roux estuviera bien hecho.","La harina floja da salsas m\xE1s finas; la de fuerza tiende a quedar gomosa."],errors:[{p:"Grumos",fix:"Falt\xF3 contraste de temperatura o se ech\xF3 el l\xEDquido de golpe sin batir. Bate fuerte, pasa por chino o tritura y vuelve a hervir."},{p:"Puntos negros o sabor amargo",fix:"Roux quemado: no tiene arreglo. T\xEDralo y empieza a fuego m\xE1s bajo."},{p:"La salsa no espesa con roux oscuro",fix:"Es normal: el tostado resta fuerza. A\xF1ade m\xE1s roux o reduce la salsa."}],history:"Tostar harina con grasa para ligar se generaliz\xF3 en la cocina francesa entre los siglos XVII y XVIII y qued\xF3 fijado en el sistema cl\xE1sico de salsas madre. El nombre alude al tono rojizo del roux tostado. Desde finales del siglo XX muchas cocinas lo han cambiado por reducciones y almidones, pero en bechamel y croquetas sigue siendo insustituible.",uses:["Bechamel y croquetas","Velout\xE9 y derivadas","Salsa espa\xF1ola","Sopas crema","Guisos y estofados"],keep:"Cocinado, enfriado y tapado aguanta 1-2 semanas en c\xE1mara y se congela bien en porciones. Se usa directamente desde fr\xEDo sobre l\xEDquido caliente.",pro:"Para cantidad, hazlo en el horno: bandeja con grasa y harina a 170-180 \xB0C, removiendo cada 10 minutos, hasta el color buscado. Porci\xF3nalo fr\xEDo en bloques de 60-100 g etiquetados: ligaz\xF3n inmediata en el pase, a\xF1adido a trozos al l\xEDquido hirviendo.",related:["ligazones","bechamel","veloute","espanola","fondo-blanco","fondo-oscuro"]},{id:"ligazones",name:"Ligazones",aka:["espesantes","ligar salsas","liaison","c\xF3mo espesar"],cat:"conceptos",group:"Ligazones",summary:"Las formas de espesar y dar cuerpo a salsas, caldos y cremas, y cu\xE1ndo conviene cada una.",what:"Ligar es dar cuerpo a un l\xEDquido para que nape y sea estable. Se consigue con almidones (harina en [[roux]] o beurre mani\xE9, maicena, f\xE9cula, arrurruz, kuzu), con prote\xEDnas (yema, sangre, gelatina), con grasa emulsionada (ver [[emulsiones]]), por [[reducciones|reducci\xF3n]] o con s\xF3lidos (pur\xE9s, pan, [[picada]]). Cada m\xE9todo cambia sabor, brillo y comportamiento al recalentar y congelar.",base:{for:"1 litro de fondo o jugo (ligaz\xF3n r\xE1pida con maicena)",items:[["Fondo o jugo caliente","1 l"],["Maicena (almid\xF3n de ma\xEDz)","25-30 g"],["Agua o fondo fr\xEDo","50-60 ml"]],steps:["Disuelve la maicena en el l\xEDquido fr\xEDo justo antes de usarla; se deposita en el fondo enseguida.","Con el fondo hirviendo, a\xF1\xE1dela en hilo sin dejar de batir.","Hierve 1-2 minutos: hasta que no rompe el hervor no espesa del todo ni pierde el gusto a almid\xF3n.","Rectifica poco a poco; es f\xE1cil pasarse y quitar cuerpo es m\xE1s dif\xEDcil que ponerlo."]},ratios:[{use:"Maicena",ratio:"15-20 g/l jugo ligero; 25-35 g/l salsa napante",note:"Algo opaca; pierde fuerza con cocci\xF3n larga y al congelar."},{use:"F\xE9cula de patata",ratio:"15-25 g/l",note:"Muy transparente; cocida de m\xE1s se vuelve filamentosa."},{use:"Arrurruz o kuzu",ratio:"20-30 g/l",note:"Brillo y transparencia; disolver en fr\xEDo y a\xF1adir al final."},{use:"Yema y nata",ratio:"2-3 yemas + 100-200 ml de nata por litro",note:"Templar antes; no pasar de 80-85 \xB0C y no volver a hervir."},{use:"Gelatina",ratio:"6-10 g/l para dar cuerpo; 12-16 g/l para cuajar firme",note:"Hojas de unos 2 g; hidratar en agua fr\xEDa y disolver en caliente sin hervir."},{use:"Agar",ratio:"1-2 g/l gel blando; 3-5 g/l firme",note:"Hervir 1-2 minutos; cuaja hacia 35-40 \xB0C y aguanta templado."},{use:"Goma xantana",ratio:"1-3 g/l",note:"Espesa sin cocci\xF3n; dispersar con batidora de brazo."}],variants:[{id:"roux",name:"Roux",note:"Harina y grasa cocinadas; base de bechamel, velout\xE9 y espa\xF1ola."},{id:null,name:"Beurre mani\xE9",note:"Harina y mantequilla crudas amasadas a partes iguales; en bolitas al final, 40-60 g por litro, hervir 2-3 minutos."},{id:"reducciones",name:"Reducci\xF3n",note:"Concentra sabor y gelatina natural; sin a\xF1adidos."},{id:"picada",name:"Picada",note:"Frutos secos, pan frito y ajo majados; liga y da sabor a guisos catalanes."}],keys:["Harina y maicena aguantan mejor el recalentado; f\xE9cula, arrurruz y kuzu dan m\xE1s brillo pero se rompen con cocci\xF3n larga.","El \xE1cido debilita los almidones: a\xF1ade lim\xF3n o vinagre al final.","No metas en la salsa la cuchara con la que pruebas: la saliva tiene enzimas que lic\xFAan las salsas ligadas con almid\xF3n.","La pi\xF1a, el kiwi o la papaya frescos impiden cuajar la gelatina; cu\xE9celos antes o usa agar."],errors:[{p:"La salsa ligada se vuelve l\xEDquida en el ba\xF1o mar\xEDa",fix:"Almid\xF3n de ra\xEDz sobrecocido o saliva en la salsa. Vuelve a ligar con poca cantidad y no la remuevas con la cuchara de probar."},{p:"Yema granulada",fix:"Se pas\xF3 de 85 \xB0C. Tritura con un chorrito de l\xEDquido fr\xEDo y cuela; si no se recupera, rehaz la ligaz\xF3n."},{p:"Gelatina que no cuaja",fix:"Fruta con enzimas, se hirvi\xF3 demasiado o falta dosis. Revisa el peso de las hojas y no la hiervas."}],history:"La cocina cl\xE1sica francesa lig\xF3 durante siglos con harina. Desde los a\xF1os setenta del siglo XX se impusieron salsas m\xE1s ligeras, basadas en reducciones, mantequilla y emulsiones, y despu\xE9s entraron en la cocina profesional el kuzu, el agar o la xantana, que ligan con muy poca cantidad sin tapar el sabor.",uses:["Salsas y jugos","Sopas y cremas","Guisos y estofados","Glaseados","Gelatinas y fondos fr\xEDos"],keep:"Lo ligado con harina regenera bien a fuego suave con un poco de l\xEDquido; con maicena o f\xE9cula puede soltar agua al d\xEDa siguiente o al congelar. Con yema o mantequilla, nunca a hervor: ba\xF1o mar\xEDa a 60-70 \xB0C.",pro:"Ten en el pase roux en bloque, maicena pesada y mantequilla fr\xEDa en dados: con eso corriges cualquier salsa en un minuto. Deja el \xFAltimo punto (mantequilla, yema) para el momento de servir.",related:["roux","reducciones","emulsiones","picada","glace","alemana","beurre-blanc"]},{id:"bechamel",name:"Bechamel",aka:["besamel","salsa blanca"],cat:"salsas",group:"Salsas madre",summary:"Salsa madre de leche ligada con roux blanco; base de croquetas, canelones y gratinados.",what:"Leche ligada con [[roux]] blanco y sazonada con sal, pimienta blanca y nuez moscada. Es una de las salsas madre de la cocina cl\xE1sica y, en Espa\xF1a, la base de la croqueta. Su espesor se regula solo con la proporci\xF3n de roux por litro, as\xED que una misma t\xE9cnica sirve para salsas fluidas, para gratinar o para masas que se cortan en fr\xEDo. De ella salen la [[mornay]] y la [[soubise]].",base:{for:"1 litro (consistencia media)",items:[["Leche entera","1 l"],["Mantequilla","60 g"],["Harina de trigo floja","60 g"],["Cebolla clavada con clavo y laurel (opcional)","1/2 cebolla"],["Sal, pimienta blanca y nuez moscada","al gusto"]],steps:["Calienta la leche (si quieres, infusionada 10 minutos con la cebolla clavada y el laurel, y luego colada).","Haz un roux blanco con la mantequilla y la harina: 2-3 minutos a fuego medio-bajo, sin color.","A\xF1ade la leche caliente poco a poco al principio, batiendo con varilla, y el resto de golpe cuando la mezcla est\xE9 lisa.","Lleva a ebullici\xF3n sin dejar de remover por el fondo y las esquinas.","Cuece 15-20 minutos a fuego suave, removiendo, hasta que no sepa a harina.","Sazona con sal, pimienta blanca y nuez moscada reci\xE9n rallada. Pasa por chino si hace falta y cubre con film en contacto."]},ratios:[{use:"Bechamel ligera",ratio:"40-50 g de mantequilla y 40-50 g de harina por litro",note:"Salsas para verduras, bases de sopa crema, para alargar otras salsas."},{use:"Bechamel media",ratio:"60 g + 60 g por litro",note:"Canelones, lasa\xF1a, base de mornay y gratinados."},{use:"Bechamel espesa",ratio:"80 g + 80 g por litro",note:"Rellenos, base de souffl\xE9, para envolver piezas (tipo villaroy)."},{use:"Croquetas",ratio:"90-110 g + 90-110 g por litro",note:"M\xE1s roux si el g\xE9nero es h\xFAmedo; cocer 20-30 minutos para una masa fina que se sostenga en fr\xEDo."}],variants:[{id:"mornay",name:"Mornay",note:"Con queso y, para gratinar, yemas."},{id:"soubise",name:"Soubise",note:"Con pur\xE9 de cebolla pochada sin color."},{id:null,name:"Bechamel con nata",note:"Se termina con un 10-20 % de nata; m\xE1s untuosa y fina."},{id:null,name:"Bechamel con fondo",note:"Mitad leche, mitad caldo de ave o de cocci\xF3n de marisco; para croquetas y canelones con m\xE1s sabor."}],keys:["La cocci\xF3n despu\xE9s de ligar es la que quita el gusto a harina: no menos de 15 minutos.","Film en contacto o una pel\xEDcula de mantequilla por encima para que no haga costra.","En croquetas, el sabor del g\xE9nero va en la grasa del roux: rehoga ah\xED el jam\xF3n, la cebolla o las setas antes de la harina.","Al enfriar espesa mucho; si es para salsear, d\xE9jala m\xE1s fluida de lo que parece."],errors:[{p:"Grumos",fix:"Bate fuerte o pasa por batidora de brazo y chino; vuelve a hervir 2-3 minutos."},{p:"Sabe a harina",fix:"Poca cocci\xF3n. Sigue cociendo a fuego suave removiendo."},{p:"Demasiado espesa",fix:"Alig\xE9rala con leche caliente, batiendo, y vuelve a llevar a ebullici\xF3n."},{p:"Croquetas que se abren al fre\xEDr",fix:"Masa blanda o poco fr\xEDa. M\xE1s roux o m\xE1s reducci\xF3n, abatir bien y empanado doble."}],history:"Es una salsa francesa del siglo XVII; su nombre se asocia tradicionalmente a un personaje de la corte de Luis XIV, aunque la autor\xEDa real no est\xE1 clara. En Espa\xF1a se convirti\xF3 en la base de croquetas, canelones y la villaroy.",uses:["Croquetas","Canelones y lasa\xF1a","Gratinados de verduras y pescado","Pechugas villaroy","Base de souffl\xE9"],keep:"Abatir r\xE1pido (por debajo de 10 \xB0C en menos de 2 horas) con film en contacto; 3-4 d\xEDas en c\xE1mara. Regenerar a fuego suave con un chorrito de leche, batiendo. Se congela, aunque puede quedar algo granulosa: trit\xFArala al regenerar. La masa de croquetas formada y empanada congela muy bien.",pro:"En lotes grandes, cazo ancho de fondo grueso y leche caliente; para croquetas, extiende la masa en bandeja GN con film en contacto y abate. En el pase, ba\xF1o mar\xEDa a 65-70 \xB0C tapada, corrigiendo con leche caliente.",related:["roux","mornay","soubise","ligazones","veloute"]},{id:"mornay",name:"Mornay",aka:["salsa mornay","bechamel con queso","salsa de queso"],cat:"salsas",group:"Derivadas de la bechamel",summary:"Bechamel con queso rallado y, a menudo, yemas; la salsa cl\xE1sica para gratinar.",what:"Derivada de la [[bechamel]] a la que se a\xF1ade queso curado rallado y mantequilla, y para gratinar tambi\xE9n yemas, que ayudan a dorar y dan una costra m\xE1s lisa. Para pescado se hace tradicionalmente con parte de [[fumet]] reducido. Es la salsa de los gratinados de verdura, huevos, pasta y pescados blancos.",base:{for:"1 litro aproximado",items:[["Bechamel media (60 + 60 g por litro)","1 l"],["Queso curado rallado (tipo gruyer o emmental, o mezcla con parmesano)","100-150 g"],["Yemas (opcional, para gratinar)","2"],["Mantequilla","30-50 g"],["Nuez moscada, pimienta blanca y cayena","al gusto"]],steps:["Prepara la bechamel y d\xE9jala a fuego m\xEDnimo, reci\xE9n hecha y bien cocida.","Fuera del fuego, a\xF1ade el queso rallado y remueve hasta que se funda; si hace falta, devuelve al fuego muy bajo sin que hierva.","Si lleva yemas, t\xE9mplalas con un cazo de salsa y luego incorp\xF3ralas al conjunto; ya no debe hervir.","Termina con la mantequilla en dados, ajusta sal al final (el queso ya sala) y un punto de cayena.","Napa el g\xE9nero y gratina con el grill fuerte o el horno a 220-250 \xB0C hasta dorar."]},ratios:[{use:"Gratinar (verduras, canelones, huevos)",ratio:"120-150 g de queso y 2 yemas por litro",note:"Dora parejo y forma costra."},{use:"Salsa para pasta o coliflor sin gratinar",ratio:"80-100 g de queso, sin yemas, bechamel ligera",note:"M\xE1s fluida, no se corta al mantener."},{use:"Pescado gratinado",ratio:"Mitad bechamel, mitad fumet reducido; 80 g de queso",note:"M\xE1s ligera y con sabor a mar."},{use:"Glaseado r\xE1pido",ratio:"3 partes de mornay + 1 de nata montada",note:"Dora en segundos bajo la salamandra."}],variants:[{id:"bechamel",name:"Bechamel",note:"La base, sin queso."},{id:null,name:"Mornay de pescado",note:"Con fumet reducido; para lenguado, merluza o mejillones gratinados."},{id:null,name:"Mornay con nata montada",note:"Para glasear al momento en salamandra."},{id:null,name:"Salsa de queso azul",note:"Cambia parte del queso por queso azul; para carnes y pasta, sin yemas."}],keys:["Que no hierva una vez echado el queso: suelta grasa y se vuelve el\xE1stica.","Queso curado y bien seco, rallado fino; los quesos tiernos se hacen hebra.","Sala al final: el queso aporta mucha sal.","Para gratinar, la capa de salsa debe ser fina y el calor fuerte y de arriba; si tarda, el queso suelta grasa.","Las yemas mejoran el dorado pero la salsa ya no se puede hervir ni recalentar fuerte."],errors:[{p:"Salsa grasienta o cortada",fix:"Se hirvi\xF3 o el queso era graso. A\xF1ade un poco de bechamel caliente o leche y bate fuera del fuego."},{p:"Hebras de queso",fix:"Queso poco curado o demasiado calor. Usa queso seco y f\xFAndelo fuera del fuego."},{p:"No dora",fix:"Falta calor de arriba o faltan yemas. Gratina m\xE1s cerca del grill o a\xF1ade yema o nata montada."},{p:"Demasiado salada",fix:"Alarga con bechamel sin sal."}],history:"El nombre no tiene un origen documentado con certeza. Se fij\xF3 en la cocina francesa del siglo XIX como derivada cl\xE1sica de la bechamel y desde entonces es la salsa de gratinar por excelencia en la cocina de hotel y de restaurante.",uses:["Coliflor y verduras gratinadas","Canelones","Huevos gratinados","Pescado blanco gratinado","S\xE1ndwich caliente de jam\xF3n y queso"],keep:"Abatir con film en contacto; 2-3 d\xEDas en c\xE1mara (con yemas, mejor consumir en 48 horas). Regenerar a fuego muy suave o al ba\xF1o mar\xEDa con un poco de leche, sin hervir. No conviene congelarla con yemas.",pro:"Ten bechamel base en lote y termina la mornay en la cantidad del servicio. Mantenla al ba\xF1o mar\xEDa a 60-65 \xB0C tapada; si va con yemas, prepara solo lo del turno. Para gratinar en cantidad, napa en fr\xEDo y pasa a horno muy caliente.",related:["bechamel","roux","fumet","soubise"]},{id:"soubise",name:"Soubise",aka:["salsa soubise","pur\xE9 soubise","salsa de cebolla"],cat:"salsas",group:"Derivadas de la bechamel",summary:"Bechamel con pur\xE9 de cebolla pochada sin color; salsa suave y dulce para carnes blancas, cordero y huevos.",what:"Salsa de cebolla blanca pochada lentamente en mantequilla, sin que coja color, mezclada con [[bechamel]] espesa, cocida y pasada fina. Queda blanca, dulce y sedosa. Existe tambi\xE9n una versi\xF3n m\xE1s antigua ligada con arroz en lugar de bechamel. Hecha muy espesa se usa como pur\xE9 o como relleno para gratinar.",base:{for:"1 litro aproximado",items:[["Cebolla blanca en juliana fina","1 kg"],["Mantequilla","80 g"],["Bechamel espesa (80 + 80 g por litro)","500 ml"],["Nata (35 % de grasa)","100-150 ml"],["Sal, pimienta blanca y nuez moscada","al gusto"]],steps:["Blanquea la cebolla 2-3 minutos en agua hirviendo con sal y esc\xFArrela bien: quita acritud y ayuda a que quede blanca.","Pocha la cebolla con la mantequilla y una pizca de sal, tapada y a fuego muy suave, 30-40 minutos, hasta que est\xE9 tierna y sin color.","A\xF1ade la bechamel y cuece 10-15 minutos a fuego suave removiendo.","Tritura y pasa por chino fino.","Ajusta la textura con la nata caliente, sazona y termina con unos dados de mantequilla fr\xEDa."]},ratios:[{use:"Salsa para carnes",ratio:"1 kg de cebolla por 500 ml de bechamel, con 150 ml de nata",note:"Napante y fluida."},{use:"Pur\xE9 o guarnici\xF3n",ratio:"1 kg de cebolla por 250 ml de bechamel espesa, sin nata",note:"Se sirve con cuchara; muy dulce."},{use:"Relleno para gratinar",ratio:"Pur\xE9 espeso con 1 yema por cada 250 g",note:"Para rellenar o cubrir piezas y dorar al horno."},{use:"Versi\xF3n con arroz",ratio:"1 kg de cebolla con 100 g de arroz y 500 ml de caldo blanco",note:"Cocer juntos al horno tapado y triturar; sin harina."}],variants:[{id:"bechamel",name:"Bechamel",note:"La base."},{id:null,name:"Soubise de arroz",note:"Ligada con arroz cocido en caldo; m\xE1s r\xFAstica y sin gluten si el caldo lo es."},{id:null,name:"Soubise con tomate",note:"Con un poco de tomate concentrado; tono rosado."},{id:null,name:"Soubise de cebolleta o puerro",note:"M\xE1s verde y ligera."}],keys:["La cebolla no debe dorarse nunca: tapa, fuego m\xEDnimo y una pizca de sal para que sude.","Blanquear la cebolla quita picor y amargor, sobre todo si no es de temporada.","Pasa por chino fino; las fibras de cebolla estropean la textura.","Su dulzor pide contraste: sirve con carnes asadas con buen jugo o con algo \xE1cido."],errors:[{p:"Salsa amarillenta o tostada",fix:"La cebolla cogi\xF3 color. Rehaz el pochado m\xE1s lento y tapado."},{p:"Textura fibrosa",fix:"Tritura m\xE1s tiempo y pasa por chino fino."},{p:"Sabor picante o amargo",fix:"Cebolla poco pochada o sin blanquear. Prolonga la cocci\xF3n a fuego suave."}],history:"Su nombre remite a una casa noble francesa del siglo XVIII y aparece en los recetarios cl\xE1sicos tanto en versi\xF3n de bechamel como de arroz. Fue una salsa habitual de la cocina de hotel para cordero y ternera, y hoy se usa sobre todo como pur\xE9 o como acompa\xF1amiento suave.",uses:["Cordero asado","Ternera y carnes blancas","Huevos gratinados","Pescado blanco","Pur\xE9 de guarnici\xF3n"],keep:"3-4 d\xEDas en c\xE1mara, abatida y con film en contacto. Regenerar a fuego suave con un poco de nata o leche. Congela razonablemente bien; tritura al regenerar.",pro:"El pochado lento de la cebolla se puede hacer en lote en horno a 140-150 \xB0C, tapado, en bandeja GN. Guarda la base de cebolla pochada y termina con bechamel y nata seg\xFAn el servicio. Ba\xF1o mar\xEDa a 65 \xB0C tapada.",related:["bechamel","roux","mornay"]},{id:"veloute",name:"Velout\xE9",aka:["velut\xE9","velout\xE9 de ave","velout\xE9 de pescado","salsa rubia"],cat:"salsas",group:"Salsas madre",summary:"Salsa madre de fondo blanco (ave, ternera o pescado) ligado con roux rubio.",what:"Un fondo blanco claro ([[fondo-blanco|de ave o ternera]] o [[fumet]] de pescado) ligado con [[roux]] rubio y cocido lentamente hasta quedar sedoso. Es la base de la [[suprema]], la [[alemana]] y las salsas de vino blanco para pescado. La calidad depende casi por completo del fondo. En cocina actual, velout\xE9 tambi\xE9n llama a cremas de verdura finas, pero la salsa cl\xE1sica es esta.",base:{for:"1 litro",items:[["Fondo blanco de ave o ternera, o fumet","1,2 l"],["Mantequilla","50-60 g"],["Harina de trigo floja","50-60 g"],["Recortes de champi\xF1\xF3n (opcional)","50 g"],["Sal y pimienta blanca","al gusto"]],steps:["Haz un roux rubio claro: 4-5 minutos a fuego medio-bajo hasta color paja.","D\xE9jalo templar y a\xF1ade el fondo caliente batiendo.","Lleva a ebullici\xF3n, a\xF1ade los recortes de champi\xF1\xF3n y baja a fuego suave.","Cuece 25-30 minutos con el cazo ladeado, retirando la grasa y la espuma que suben por un lado.","Cuela por chino fino o estame\xF1a. Ajusta sal solo al final, porque reduce."]},ratios:[{use:"Base de sopa o crema",ratio:"30-40 g + 30-40 g por litro",note:"Se termina con nata o yema."},{use:"Salsa napante de servicio",ratio:"50-60 g + 50-60 g por litro",note:"Para napar ave, ternera o pescado."},{use:"Para ligar rellenos o croquetas de ave",ratio:"90-100 g + 90-100 g por litro",note:"Masa que se sostiene en fr\xEDo."},{use:"Salsa de vino blanco para pescado",ratio:"Velout\xE9 de pescado + fumet reducido con vino + nata y mantequilla",note:"Reducir hasta napar y montar al final."}],variants:[{id:"suprema",name:"Suprema",note:"Velout\xE9 de ave con nata y mantequilla."},{id:"alemana",name:"Alemana",note:"Velout\xE9 de ternera ligado con yemas y nata."},{id:null,name:"Salsa de vino blanco",note:"Velout\xE9 de pescado con reducci\xF3n de vino y fumet."},{id:null,name:"Salsa Bercy",note:"Velout\xE9 de pescado con chalota y vino blanco reducidos."},{id:null,name:"Salsa aurora",note:"Velout\xE9 con un poco de tomate concentrado."}],keys:["El fondo manda: si el fondo es flojo, la salsa tambi\xE9n. Mejor un fondo bien reducido y gelatinoso.","Desgrasar y espumar durante la cocci\xF3n es lo que da la textura aterciopelada.","Roux templado y fondo caliente, o al rev\xE9s: contraste para evitar grumos.","Para pescado, cocci\xF3n m\xE1s corta (15-20 minutos): el fumet se enturbia y amarga si cuece mucho."],errors:[{p:"Salsa turbia o grasa",fix:"No se espum\xF3. Vuelve a hervir suave con el cazo ladeado y retira lo que sube."},{p:"Sabe a harina",fix:"Poca cocci\xF3n. Prolonga a fuego suave."},{p:"Sabor plano",fix:"Fondo d\xE9bil. A\xF1ade fondo reducido o un poco de glace de ave."},{p:"Color gris",fix:"Roux demasiado tostado o fondo oscuro. Para salsas blancas, roux claro y fondo blanco."}],history:"Su nombre significa aterciopelada. Fue una de las grandes salsas de la cocina francesa del siglo XIX, y la clasificaci\xF3n cl\xE1sica de salsas madre la mantuvo como base de todas las salsas blancas de carne y pescado. Hoy se usa menos que antes, sustituida a menudo por fondos reducidos con nata.",uses:["Ave y ternera en blanco","Pescado blanco","Fricas\xE9s y blanquetas","Volovanes y rellenos","Base de cremas"],keep:"Abatida y con film en contacto, 3-4 d\xEDas en c\xE1mara; la de pescado, 2 d\xEDas. Congela bien en porciones. Regenera a fuego suave con un poco de fondo.",pro:"Prepara la velout\xE9 base en lote y termina cada derivada al pase. Mant\xE9n al ba\xF1o mar\xEDa a 65-70 \xB0C tapada. Para servicio de banquete, ten preparado fondo reducido caliente para corregir la textura en el \xFAltimo momento.",related:["fondo-blanco","fumet","roux","suprema","alemana","bechamel"]},{id:"suprema",name:"Suprema",aka:["salsa suprema","supr\xEAme","salsa de ave con nata"],cat:"salsas",group:"Derivadas del velout\xE9",summary:"Velout\xE9 de ave reducido con nata y terminado con mantequilla; salsa blanca fina para aves.",what:"Derivada del [[veloute|velout\xE9]] de ave: se reduce con m\xE1s [[fondo-blanco|fondo de ave]] y nata hasta que nape y se termina con mantequilla fr\xEDa y unas gotas de lim\xF3n. Es la salsa cl\xE1sica de la pechuga de ave escalfada o asada en blanco. Debe quedar de color marfil, brillante, sin sabor a harina y con mucho gusto a ave.",base:{for:"1 litro aproximado",items:[["Velout\xE9 de ave","1 l"],["Fondo blanco de ave reducido","250 ml"],["Recortes de champi\xF1\xF3n","60 g"],["Nata (35 % de grasa)","250-300 ml"],["Mantequilla fr\xEDa en dados","50-80 g"],["Zumo de lim\xF3n, sal y pimienta blanca","al gusto"]],steps:["Lleva a ebullici\xF3n el velout\xE9 con el fondo de ave y los recortes de champi\xF1\xF3n.","Reduce a fuego medio, removiendo y espumando, hasta un tercio menos aproximadamente.","A\xF1ade la nata poco a poco y sigue reduciendo hasta que nape la cuchara.","Cuela por chino fino.","Fuera del fuego, monta con la mantequilla fr\xEDa y ajusta con lim\xF3n, sal y pimienta blanca."]},ratios:[{use:"Salsa para pechuga o pularda",ratio:"1 l de velout\xE9 + 250 ml de nata + 60 g de mantequilla",note:"Napante."},{use:"Fricas\xE9 o volov\xE1n",ratio:"Menos reducci\xF3n, 300 ml de nata",note:"M\xE1s fluida para envolver guarnici\xF3n."},{use:"Versi\xF3n r\xE1pida sin velout\xE9",ratio:"1 l de fondo de ave reducido a 300 ml + 300 ml de nata",note:"Reducir juntos hasta napar; sin harina."},{use:"Con setas o trufa",ratio:"A\xF1adir 50-100 ml de jugo de setas o de trufa al reducir",note:"Para aves de fiesta."}],variants:[{id:"veloute",name:"Velout\xE9",note:"La base."},{id:null,name:"Salsa marfil",note:"Suprema con un poco de glace de ave; color marfil."},{id:null,name:"Salsa Albufera",note:"Suprema con glace de carne y mantequilla de pimiento."},{id:null,name:"Suprema de setas",note:"Con setas salteadas y su jugo; para ave y arroces."}],keys:["El sabor a ave sale del fondo reducido, no de la nata: no la alargues con nata para tapar un fondo flojo.","Monta la mantequilla fuera del fuego y no vuelvas a hervir.","El lim\xF3n, en gotas y al final: realza sin notarse.","Con [[glace]] de ave ganas cuerpo sin a\xF1adir harina."],errors:[{p:"Demasiado espesa o pastosa",fix:"Se redujo de m\xE1s. Aligera con fondo de ave caliente."},{p:"Sabe solo a nata",fix:"Poco fondo. A\xF1ade fondo reducido o glace de ave y vuelve a reducir."},{p:"Se separa la grasa",fix:"Hirvi\xF3 con la mantequilla. Bate con un chorrito de fondo fr\xEDo o nata fr\xEDa."}],history:"Pertenece al repertorio cl\xE1sico franc\xE9s de salsas blancas derivadas del velout\xE9, fijado en los recetarios del siglo XIX y principios del XX. Su nombre indica que se consideraba la m\xE1s fina de las salsas de ave.",uses:["Pechuga y pularda","Volovanes y hojaldres","Fricas\xE9 de ave","Arroz y pasta con ave","Mollejas"],keep:"2-3 d\xEDas en c\xE1mara, abatida. Regenerar a fuego suave con un poco de fondo y volver a montar con mantequilla. No se recomienda congelar ya terminada; mejor congelar la base sin mantequilla.",pro:"Ten la base reducida con nata en lote y monta con mantequilla solo lo de cada servicio. Mant\xE9n en ba\xF1o mar\xEDa a 60-65 \xB0C tapada. Para banquetes, hazla un poco m\xE1s fluida: en el ba\xF1o mar\xEDa espesa.",related:["veloute","fondo-blanco","alemana","glace","reducciones"]},{id:"alemana",name:"Alemana",aka:["salsa alemana","allemande","salsa parisina"],cat:"salsas",group:"Derivadas del velout\xE9",summary:"Velout\xE9 de ternera ligado con yemas y nata y acidulado con lim\xF3n; base de la poulette y la villaroy cl\xE1sica.",what:"Es un [[veloute|velout\xE9]] de ternera (o de ave) enriquecido con una ligaz\xF3n de yemas y nata, jugo de champi\xF1\xF3n y lim\xF3n. Las yemas le dan color marfil, cuerpo y untuosidad. Es la cl\xE1sica [[ligazones|ligaz\xF3n]] con yema llevada a salsa: hay que controlar la temperatura para no granularla.",base:{for:"1 litro aproximado",items:[["Velout\xE9 de ternera o ave","1 l"],["Jugo de cocci\xF3n de champi\xF1\xF3n","100 ml"],["Yemas","3-4"],["Nata (35 % de grasa)","150 ml"],["Mantequilla fr\xEDa","30-50 g"],["Zumo de lim\xF3n, nuez moscada, sal y pimienta blanca","al gusto"]],steps:["Reduce el velout\xE9 con el jugo de champi\xF1\xF3n hasta que nape ligeramente.","Mezcla las yemas con la nata en un bol.","Tempera las yemas con un cazo de salsa caliente, batiendo.","Vierte la mezcla en el cazo y calienta a fuego suave removiendo, sin que hierva, hasta que espese (unos 80-85 \xB0C).","Cuela, termina con la mantequilla, el lim\xF3n y una pizca de nuez moscada, y ajusta de sal."]},ratios:[{use:"Salsa para ternera o ave",ratio:"3 yemas y 150 ml de nata por litro",note:"Napante, suave."},{use:"Para cubrir y empanar piezas",ratio:"4-5 yemas por litro y velout\xE9 m\xE1s espeso",note:"Se cuaja en fr\xEDo sobre la pieza."},{use:"Poulette (moluscos)",ratio:"Con el jugo de cocci\xF3n de los mejillones reducido y perejil",note:"M\xE1s fluida y \xE1cida."}],variants:[{id:"veloute",name:"Velout\xE9",note:"La base."},{id:null,name:"Poulette",note:"Alemana con perejil, lim\xF3n y jugo de champi\xF1\xF3n o de mejill\xF3n; para moluscos y sesos."},{id:null,name:"Villaroy cl\xE1sica",note:"Alemana espesa reducida para napar piezas antes de empanar; en Espa\xF1a suele hacerse con bechamel."},{id:"suprema",name:"Suprema",note:"La hermana con nata y sin yemas."}],keys:["Templa siempre las yemas antes de juntarlas con la salsa caliente.","Una vez ligada con yema, no hierve: por encima de 85 \xB0C se granula.","El lim\xF3n, al final y en gotas: refresca y equilibra la riqueza de la yema.","Si la vas a mantener, mejor un poco fluida: espesa en el ba\xF1o mar\xEDa."],errors:[{p:"Salsa granulada o cortada",fix:"Se pas\xF3 de temperatura. Tritura con un chorrito de nata fr\xEDa y cuela; si no se recupera, rehaz la ligaz\xF3n con yemas nuevas sobre velout\xE9."},{p:"Sabe a huevo",fix:"Demasiadas yemas o falta acidez. Alarga con velout\xE9 y a\xF1ade lim\xF3n."},{p:"Poco cuerpo",fix:"Velout\xE9 poco reducido. Reduce la base antes de ligar, nunca despu\xE9s."}],history:"En la gran cocina francesa del siglo XIX se consider\xF3 una de las salsas fundamentales; m\xE1s tarde la clasificaci\xF3n cl\xE1sica la pas\xF3 a derivada del velout\xE9. Tambi\xE9n se ha llamado salsa parisina. Su nombre no tiene un origen claro.",uses:["Ternera y ave en blanco","Mejillones y moluscos (poulette)","Piezas napadas y empanadas","Sesos y mollejas","Volovanes"],keep:"Por llevar yema, consumir en 24-48 horas en c\xE1mara. Regenerar al ba\xF1o mar\xEDa sin pasar de 70 \xB0C, batiendo. No se recomienda congelar.",pro:"Prepara el velout\xE9 reducido en lote y liga con yemas solo la cantidad del servicio. Mant\xE9n al ba\xF1o mar\xEDa a 60-65 \xB0C tapada y desecha lo sobrante al final del turno.",related:["veloute","suprema","ligazones","fondo-blanco","holandesa"]},{id:"espanola",name:"Salsa espa\xF1ola",aka:["espa\xF1ola","espagnole","salsa oscura","salsa morena"],cat:"salsas",group:"Salsas madre",summary:"Salsa madre oscura de fondo de ternera tostado, mirepoix y roux oscuro; base cl\xE1sica de la demi-glace.",what:"Salsa oscura que se obtiene cociendo largo [[fondo-oscuro|fondo oscuro]] de ternera con [[mirepoix]] tostada, tomate, [[bouquet-garni]] y [[roux]] oscuro, desgrasando hasta que queda brillante. En la cocina cl\xE1sica casi no se sirve tal cual: es el paso previo a la [[demi-glace]] y a las salsas oscuras derivadas. En cocina actual se suele sustituir por fondo oscuro reducido sin harina.",base:{for:"1 litro",items:[["Fondo oscuro de ternera","2 l"],["Mirepoix (cebolla, zanahoria y apio en dados)","250 g"],["Panceta o recortes de jam\xF3n (opcional)","50 g"],["Mantequilla clarificada o grasa","60 g"],["Harina de trigo","60-70 g"],["Tomate concentrado","40 g"],["Tomate maduro troceado","200 g"],["Bouquet garni","1"]],steps:["Dora bien la mirepoix con la panceta en la grasa, a fuego medio, 10-15 minutos.","A\xF1ade la harina y tu\xE9stala con las verduras hasta color avellana, removiendo sin parar (roux oscuro).","A\xF1ade el tomate concentrado y tu\xE9stalo 2 minutos.","Moja con el fondo caliente poco a poco, batiendo, e incorpora el tomate y el bouquet garni.","Cuece a fuego muy suave 2-3 horas, con el cazo ladeado, retirando grasa e impurezas, hasta reducir a la mitad.","Cuela por chino fino presionando poco y desgrasa de nuevo."]},ratios:[{use:"Base para demi-glace",ratio:"Partes iguales de espa\xF1ola y fondo oscuro, reducidas a la mitad",note:"La v\xEDa cl\xE1sica."},{use:"Salsa de guiso o estofado",ratio:"Sin reducir del todo: 1,5 l de salida",note:"Para mojar rag\xFAs y carnes guisadas."},{use:"Sin harina (versi\xF3n actual)",ratio:"3 l de fondo oscuro reducidos a 1 l con la misma guarnici\xF3n",note:"Ligar al final con un poco de almid\xF3n o mantequilla."}],variants:[{id:"demi-glace",name:"Demi-glace",note:"Espa\xF1ola reducida con fondo oscuro."},{id:"jugo-de-carne",name:"Jugo de carne ligado",note:"La alternativa moderna sin harina."},{id:null,name:"Espa\xF1ola de vigilia",note:"Con fondo de pescado tostado; poco habitual hoy."}],keys:["El color debe venir del tostado de huesos, verduras y harina, nunca de quemar: el amargor no se va.","Cocci\xF3n larga y suave, cazo ladeado y desgrasar a menudo: as\xED queda brillante y no turbia.","La sal, al final: tras horas de reducci\xF3n cualquier sal temprana se multiplica.","Un buen fondo oscuro gelatinoso hace la mitad del trabajo."],errors:[{p:"Sabor amargo",fix:"Mirepoix, roux o tomate quemados. No tiene arreglo: vuelve a empezar."},{p:"Turbia y grasa",fix:"Hirvi\xF3 fuerte o no se desgras\xF3. Cuela, enfr\xEDa, retira la grasa s\xF3lida y vuelve a hervir suave espumando."},{p:"Pastosa",fix:"Exceso de harina. Aligera con fondo y reduce despacio."}],history:"Fue una de las grandes salsas oscuras de la cocina francesa del siglo XIX y qued\xF3 como salsa madre en la clasificaci\xF3n cl\xE1sica. El nombre no tiene un origen probado; hay varias teor\xEDas y ninguna confirmada. Desde los a\xF1os setenta muchas cocinas la han cambiado por fondos reducidos sin harina.",uses:["Base de demi-glace","Estofados y rag\xFAs","Salsas de caza","Carnes guisadas","Salsas derivadas oscuras"],keep:"Abatida, 5-7 d\xEDas en c\xE1mara. Congela muy bien en porciones o cubiteras. Regenerar a fuego suave y rectificar textura con fondo.",pro:"Se hace en grandes cantidades, de una vez, en marmita: compensa por el tiempo de cocci\xF3n. Porciona en bolsas o recipientes de 1 l etiquetados, congelados. En el pase, se trabaja ya como demi-glace o salsa derivada.",related:["fondo-oscuro","demi-glace","roux","mirepoix","bouquet-garni","salsa-de-tomate"]},{id:"demi-glace",name:"Demi-glace",aka:["demigl\xE1s","media glasa","demi glace","salsa de carne reducida"],cat:"salsas",group:"Salsas madre",summary:"Salsa oscura concentrada de fondo de ternera reducido, a medio camino entre una salsa y una glace.",what:"Cl\xE1sicamente es [[espanola|salsa espa\xF1ola]] y [[fondo-oscuro|fondo oscuro]] a partes iguales reducidos a la mitad. Hoy en la mayor\xEDa de cocinas es un fondo oscuro muy reducido sin harina, ligado por su propia gelatina, a medio camino entre un [[jugo-de-carne|jugo]] y una [[glace]]. Es la base de casi todas las salsas oscuras de restaurante.",base:{for:"1 litro (versi\xF3n cl\xE1sica)",items:[["Salsa espa\xF1ola","1 l"],["Fondo oscuro de ternera","1 l"],["Vino de Madeira, oporto o jerez seco (opcional)","50-100 ml"]],steps:["Junta la salsa espa\xF1ola y el fondo oscuro en un cazo ancho.","Reduce a fuego suave, espumando y desgrasando, hasta la mitad (1-1,5 horas).","Debe napar la cuchara y tener brillo.","Cuela por estame\xF1a o chino muy fino.","Si lleva vino generoso, a\xF1\xE1delo al final y dale solo 1-2 minutos de hervor."]},ratios:[{use:"Versi\xF3n moderna sin harina",ratio:"4-5 l de fondo oscuro reducidos a 1 l",note:"Ligada por la gelatina; si hace falta, un punto de almid\xF3n."},{use:"Salsa de servicio",ratio:"Demi-glace + reducci\xF3n de vino o chalota + 30-50 g de mantequilla por 250 ml",note:"Montar al pase."},{use:"Para glasear piezas",ratio:"Reducir otra vez a la mitad",note:"Se acerca a la glace; pincelar al final."},{use:"Para mojar un guiso",ratio:"1 parte de demi-glace + 2-3 de fondo",note:"Da cuerpo sin empastar."}],variants:[{id:"espanola",name:"Salsa espa\xF1ola",note:"Su base cl\xE1sica."},{id:"glace",name:"Glace de carne",note:"El siguiente paso de reducci\xF3n."},{id:null,name:"Salsa bordelesa",note:"Con reducci\xF3n de vino tinto y chalota, y tu\xE9tano."},{id:null,name:"Salsa al vino generoso",note:"Con Madeira, oporto o Pedro Xim\xE9nez."},{id:null,name:"Salsa a la pimienta",note:"Con pimienta verde o negra, flambeado y nata."},{id:null,name:"Salsa cazadora",note:"Con champi\xF1\xF3n, chalota, vino blanco y tomate."}],keys:["Reduce despacio y desgrasando: si hierve fuerte, se enturbia y emulsiona la grasa.","Sala solo al final: la reducci\xF3n concentra todo.","Prueba en fr\xEDo sobre un plato: debe gelificar ligeramente si el fondo era bueno.","Para las derivadas, haz primero la reducci\xF3n arom\xE1tica (vino, chalota) y luego a\xF1ade la demi-glace."],errors:[{p:"Pegajosa o demasiado dulce",fix:"Reducida de m\xE1s o con demasiado vino generoso. Aligera con fondo."},{p:"Turbia",fix:"Hirvi\xF3 fuerte. Desgrasa en fr\xEDo y vuelve a reducir suave."},{p:"Sin cuerpo",fix:"Fondo con poca gelatina. A\xF1ade glace o algo de pata de ternera en el siguiente fondo."},{p:"Amarga",fix:"Huesos o mirepoix quemados en el fondo. No tiene arreglo."}],history:"La cocina francesa cl\xE1sica la defini\xF3 como una salsa espa\xF1ola reducida con fondo, y as\xED la recogieron los grandes recetarios de principios del siglo XX. Con la cocina m\xE1s ligera de finales del siglo XX se impuso la versi\xF3n sin harina, que es la que se trabaja hoy en la mayor\xEDa de restaurantes.",uses:["Carnes rojas a la plancha o asadas","Salsas derivadas","Guisos y rabo","Caza","Glasear piezas"],keep:"Abatida, 1 semana en c\xE1mara. Congela muy bien en cubiteras o bolsas peque\xF1as durante meses. Regenerar a fuego suave.",pro:"Es mise en place b\xE1sica: tenla congelada en porciones de 100-250 ml. Para servicio, hazla en un cazo peque\xF1o al ba\xF1o mar\xEDa a 70-80 \xB0C y monta cada salsa al momento con mantequilla. Etiqueta con fecha y lote.",related:["espanola","fondo-oscuro","glace","jugo-de-carne","reducciones"]},{id:"salsa-de-tomate",name:"Salsa de tomate",aka:["tomate frito","tomate frito casero","salsa de tomate casera","sauce tomate"],cat:"salsas",group:"Salsas madre",summary:"Tomate maduro cocinado lentamente en aceite con cebolla y ajo; base de guisos, pastas y frituras.",what:"En la cocina espa\xF1ola es el tomate frito: tomate maduro cocinado despacio en aceite de oliva con cebolla y ajo hasta que pierde el agua y el aceite asoma. La versi\xF3n cl\xE1sica francesa, salsa madre, lleva adem\xE1s panceta, [[mirepoix]], fondo blanco y a veces [[roux]]. Es la base de muchos guisos y del [[sofrito]] y la [[salsa-vizcaina|vizca\xEDna]].",base:{for:"1 litro aproximado",items:[["Tomate maduro (pera o similar) triturado o rallado","2 kg"],["Aceite de oliva virgen extra","150 ml"],["Cebolla en brunoise","200 g"],["Ajo picado","2 dientes"],["Laurel","1 hoja"],["Sal","10-12 g"],["Az\xFAcar (seg\xFAn acidez)","0-15 g"]],steps:["Pocha la cebolla en el aceite a fuego suave 15 minutos, sin que coja color.","A\xF1ade el ajo y rehoga 1 minuto sin que se dore.","Incorpora el tomate y el laurel, sala ligeramente y sube a hervor.","Cuece a fuego suave 45-90 minutos, removiendo de vez en cuando, hasta que reduzca a la mitad y el aceite brille en la superficie.","Prueba y corrige la acidez con az\xFAcar si hace falta.","Pasa por el pasapur\xE9s: queda rojo y con textura. Triturado a m\xE1quina emulsiona el aceite y se vuelve anaranjado."]},ratios:[{use:"Pasta",ratio:"Reducir a la mitad, con 100 ml de aceite por 2 kg",note:"Fluida, que nape la pasta."},{use:"Pizza o rellenos",ratio:"Reducir a un tercio",note:"Espesa, que no moje la masa."},{use:"Guisos y alb\xF3ndigas",ratio:"Reducir solo un tercio y alargar con fondo",note:"M\xE1s l\xEDquida, va a seguir cociendo."},{use:"Cl\xE1sica francesa",ratio:"Con 100 g de panceta, 200 g de mirepoix y 500 ml de fondo blanco por 2 kg",note:"Cocci\xF3n 1,5-2 horas, se pasa fina."},{use:"Con tomate en conserva",ratio:"2 kg de tomate pelado en lata, cocci\xF3n 30-40 minutos",note:"Fuera de temporada, mejor que tomate fresco sin sabor."}],variants:[{id:"sofrito",name:"Sofrito",note:"M\xE1s concentrado y con m\xE1s cebolla; base de arroces y guisos."},{id:"salsa-vizcaina",name:"Salsa vizca\xEDna",note:"Con pimiento choricero y cebolla roja; color m\xE1s oscuro."},{id:"salsa-brava",name:"Salsa brava",note:"Picante; seg\xFAn la zona lleva tomate o solo piment\xF3n."},{id:null,name:"Salsa de tomate con albahaca",note:"M\xE1s r\xE1pida y fresca, con aceite y albahaca al final."},{id:null,name:"Salsa picante de guindilla",note:"Con guindilla y ajo; para pasta."}],keys:["El tomate maduro es todo: fuera de temporada, mejor tomate pelado en conserva de calidad.","Fuego suave y tiempo: se fr\xEDe, no se hierve; est\xE1 listo cuando el aceite asoma.","Corrige la acidez al final, probando; el az\xFAcar a ojo la convierte en dulce.","Pasapur\xE9s para un tomate frito rojo; triturado a m\xE1quina queda m\xE1s claro y emulsionado.","Una pizca de bicarbonato neutraliza acidez extrema, pero con mucha cautela: cambia el sabor."],errors:[{p:"\xC1cida",fix:"Tomate verde o poca cocci\xF3n. Prolonga la cocci\xF3n y corrige con az\xFAcar poco a poco."},{p:"Pegada o con sabor a quemado",fix:"Fuego alto al final de la reducci\xF3n. P\xE1sala a otro cazo sin rascar; si sabe a quemado, no se salva."},{p:"Aguada",fix:"Poca reducci\xF3n. Sigue cociendo destapada."},{p:"Color anaranjado",fix:"Se tritur\xF3 con el aceite emulsionado. Usa pasapur\xE9s o tritura antes de a\xF1adir todo el aceite."}],history:"El tomate lleg\xF3 de Am\xE9rica en el siglo XVI y tard\xF3 en entrar en la cocina; en Espa\xF1a y en Italia se generaliz\xF3 como salsa a partir del siglo XVIII. La cocina francesa cl\xE1sica lo incluy\xF3 como salsa madre con fondo y panceta. El tomate frito casero sigue siendo una base fija de la cocina espa\xF1ola.",uses:["Pasta","Alb\xF3ndigas y guisos","Huevos y pisto","Pescado en salsa","Base de salsas y arroces"],keep:"Abatida, 5 d\xEDas en c\xE1mara. Congela muy bien. En conserva, en tarros esterilizados y con tratamiento t\xE9rmico adecuado. Regenerar a fuego suave.",pro:"Se hace en grandes lotes en marmita o en horno a 160-170 \xB0C en bandeja GN destapada, removiendo cada 20 minutos: reduce sin pegarse. Porciona y congela. Etiqueta con fecha.",related:["sofrito","salsa-vizcaina","salsa-brava","espanola","mirepoix"]},{id:"holandesa",name:"Holandesa",aka:["salsa holandesa","hollandaise"],cat:"salsas",group:"Emulsiones calientes",summary:"Emulsi\xF3n caliente de yemas y mantequilla, acidulada con lim\xF3n; para huevos, esp\xE1rragos y pescado.",what:"Es una de las grandes [[emulsiones]] calientes: yemas cocinadas hasta formar un sabay\xF3n y montadas con mantequilla clarificada o fundida, con lim\xF3n o una reducci\xF3n \xE1cida. Se mantiene estable solo en una franja de temperatura estrecha, en torno a 60-65 \xB0C. De ella derivan la muselina y la maltesa, y es hermana de la [[bearnesa]].",base:{for:"400 g aproximado (8-10 raciones)",items:[["Yemas","4"],["Agua o reducci\xF3n (vinagre de vino, agua y pimienta)","40 ml"],["Mantequilla clarificada templada (50-60 \xB0C)","250 g"],["Zumo de lim\xF3n","15-20 ml"],["Sal y cayena","al gusto"]],steps:["Si usas reducci\xF3n, reduce el vinagre con agua y pimienta machacada a 2-3 cucharadas, cu\xE9lala y enfr\xEDala.","En un bol al ba\xF1o mar\xEDa (el agua sin hervir), bate las yemas con el agua o la reducci\xF3n.","Cocina batiendo hasta que espesen, hagan cord\xF3n y lleguen a 60-65 \xB0C. Retira del ba\xF1o si se calientan demasiado.","Fuera del fuego, a\xF1ade la mantequilla templada en hilo fino, batiendo sin parar, hasta emulsionar.","Ajusta con lim\xF3n, sal y cayena. Si queda muy espesa, aligera con unas gotas de agua templada."]},ratios:[{use:"Cl\xE1sica",ratio:"60-70 g de mantequilla por yema",note:"Napante y estable."},{use:"M\xE1s ligera",ratio:"40-50 g de mantequilla por yema",note:"M\xE1s sabor a yema; menos rica."},{use:"Muselina",ratio:"3 partes de holandesa + 1 de nata montada",note:"Ligera, para pescados y esp\xE1rragos; se sirve enseguida."},{use:"Maltesa",ratio:"Holandesa con zumo reducido y piel de naranja sanguina",note:"Para esp\xE1rragos."},{use:"En sif\xF3n",ratio:"Holandesa m\xE1s fluida, 1 carga de N2O por 500 ml",note:"Mantener al ba\xF1o a 60-65 \xB0C."}],variants:[{id:"bearnesa",name:"Bearnesa",note:"Con reducci\xF3n de chalota, estrag\xF3n y vinagre."},{id:null,name:"Muselina",note:"Con nata montada."},{id:null,name:"Maltesa",note:"Con naranja sanguina."},{id:null,name:"Holandesa de mostaza",note:"Con mostaza de Dijon; para pescados a la plancha."}],keys:["La temperatura lo es todo: yemas a 60-65 \xB0C; por encima de 70 \xB0C cuajan y se granula.","Mantequilla clarificada da una salsa m\xE1s espesa y estable; fundida entera, m\xE1s sabor y m\xE1s fluida.","A\xF1ade la mantequilla al principio gota a gota; cuando la emulsi\xF3n arranca, ya en hilo.","Usa yemas pasteurizadas en servicio a colectividades o banquetes.","Nunca hierve y nunca se guarda de un servicio para otro."],errors:[{p:"Cortada por exceso de calor (granulada, aceitosa)",fix:"En otro bol, una yema con una cucharada de agua templada; a\xF1ade la salsa cortada poco a poco batiendo."},{p:"Cortada por fr\xEDo o mantequilla a\xF1adida muy r\xE1pido",fix:"Unas gotas de agua caliente y batir fuerte; si no, rehacer sobre una yema nueva."},{p:"Demasiado espesa",fix:"Aligera con agua templada o lim\xF3n, batiendo."},{p:"Sabe a huevo",fix:"Falta \xE1cido o mantequilla. Ajusta con lim\xF3n y sal."}],history:"Es una salsa de la cocina francesa cl\xE1sica; el nombre alude a Holanda, pero su origen exacto no est\xE1 documentado. Con el tiempo la ense\xF1anza moderna la ha incluido entre las salsas madre. Se populariz\xF3 en todo el mundo con los huevos Benedict.",uses:["Huevos Benedict","Esp\xE1rragos","Pescado escalfado","Verduras al vapor","Gratinados r\xE1pidos de salamandra"],keep:"Se mantiene al ba\xF1o mar\xEDa a 60-65 \xB0C un m\xE1ximo de 2 horas y lo sobrante se desecha. No se abate ni se guarda. En sif\xF3n y en ba\xF1o termost\xE1tico a 62-64 \xB0C aguanta todo el servicio con buena textura.",pro:"Para servicio largo, hazla en sif\xF3n y mantenla al ba\xF1o a temperatura controlada. Tener la mantequilla clarificada ya en mise en place y las yemas pasteurizadas acelera el pase. Haz peque\xF1os lotes por turno.",related:["emulsiones","bearnesa","beurre-blanc","mayonesa","alemana"]},{id:"bearnesa",name:"Bearnesa",aka:["salsa bearnesa","b\xE9arnaise"],cat:"salsas",group:"Emulsiones calientes",summary:"Emulsi\xF3n caliente de yemas y mantequilla con reducci\xF3n de chalota, estrag\xF3n y vinagre; la salsa de la carne a la parrilla.",what:"Es la [[holandesa]] con otra base \xE1cida: una [[reducciones|reducci\xF3n]] de vinagre de vino, vino blanco, chalota, estrag\xF3n y pimienta. Se termina con estrag\xF3n y perifollo picados. Es m\xE1s arom\xE1tica, m\xE1s \xE1cida y algo m\xE1s espesa que la holandesa, y es la salsa cl\xE1sica de la carne roja a la parrilla.",base:{for:"400 g aproximado (8-10 raciones)",items:[["Chalota picada","2 (50 g)"],["Vinagre de vino blanco o de estrag\xF3n","100 ml"],["Vino blanco seco","50 ml"],["Estrag\xF3n fresco (tallos y hojas)","1 manojo peque\xF1o"],["Pimienta negra machacada (mignonette)","1 cucharadita"],["Yemas","4"],["Mantequilla clarificada templada (50-60 \xB0C)","250 g"],["Estrag\xF3n y perifollo picados, sal y cayena","al gusto"]],steps:["Reduce el vinagre, el vino, la chalota, los tallos de estrag\xF3n y la pimienta hasta que queden 2-3 cucharadas de l\xEDquido.","Cuela apretando bien o, si la prefieres r\xFAstica, deja la chalota; deja templar.","Bate las yemas con la reducci\xF3n al ba\xF1o mar\xEDa hasta que espesen y lleguen a 60-65 \xB0C.","Fuera del fuego, a\xF1ade la mantequilla templada en hilo, batiendo sin parar.","Termina con el estrag\xF3n y el perifollo picados, sal y cayena."]},ratios:[{use:"Cl\xE1sica",ratio:"60-70 g de mantequilla por yema",note:"Para carne a la parrilla."},{use:"Choron",ratio:"Bearnesa + 1 cucharada de tomate concentrado reducido por cada 250 g",note:"Rosada; para carne y pescado a la parrilla."},{use:"Foyot o Valois",ratio:"Bearnesa + 1 cucharada de glace de carne por cada 250 g",note:"M\xE1s intensa; para carnes."},{use:"Paloise",ratio:"Menta en lugar de estrag\xF3n",note:"Para cordero."}],variants:[{id:"holandesa",name:"Holandesa",note:"La base sin arom\xE1ticos."},{id:null,name:"Choron",note:"Con tomate."},{id:null,name:"Foyot o Valois",note:"Con glace de carne."},{id:null,name:"Paloise",note:"Con menta."}],keys:["La reducci\xF3n tiene que quedar bien concentrada: es lo que da el sabor y la estabilidad.","Temperatura de las yemas entre 60 y 65 \xB0C; nunca hirviendo el agua del ba\xF1o mar\xEDa.","Las hierbas frescas, al final y reci\xE9n picadas; si se a\xF1aden pronto, se oscurecen.","Es m\xE1s espesa que la holandesa; aligera con unas gotas de agua templada si hace falta.","Nunca se recalienta en el fuego directo."],errors:[{p:"Cortada por exceso de calor",fix:"Una yema nueva con una cucharada de agua templada; a\xF1ade la salsa cortada poco a poco, batiendo."},{p:"Cortada por fr\xEDo",fix:"Unas gotas de agua caliente y batir con energ\xEDa."},{p:"Muy \xE1cida",fix:"Reducci\xF3n poco concentrada o demasiado vinagre. A\xF1ade un poco m\xE1s de mantequilla."},{p:"Hierbas negras",fix:"Se a\xF1adieron demasiado pronto. Pica y a\xF1ade al momento de servir."}],history:"Su nombre remite a la regi\xF3n del Bearne, en el suroeste de Francia, pero la versi\xF3n m\xE1s repetida sit\xFAa su creaci\xF3n en las afueras de Par\xEDs en el siglo XIX; conviene tomarlo como tradici\xF3n, no como dato probado. Desde entonces es la salsa cl\xE1sica del entrecot y del solomillo a la parrilla.",uses:["Entrecot y solomillo a la parrilla","Patatas fritas","Pescados a la parrilla","Huevos escalfados","Cordero (paloise)"],keep:"Al ba\xF1o mar\xEDa a 60-65 \xB0C un m\xE1ximo de 2 horas; lo sobrante se desecha. La reducci\xF3n arom\xE1tica s\xED se guarda: 1 semana en c\xE1mara o congelada en cubiteras.",pro:"Ten la reducci\xF3n ya hecha y colada en mise en place (en cubiteras congeladas dura semanas). Monta en sif\xF3n o en bol al ba\xF1o mar\xEDa por turno. Hierbas picadas al momento.",related:["holandesa","emulsiones","reducciones","beurre-blanc","demi-glace"]},{id:"beurre-blanc",name:"Beurre blanc",aka:["mantequilla blanca","salsa de mantequilla","beurre nantais"],cat:"salsas",group:"Emulsiones calientes",summary:"Reducci\xF3n de chalota, vino blanco y vinagre montada con mantequilla fr\xEDa; salsa cl\xE1sica para pescado.",what:"Emulsi\xF3n de mantequilla fr\xEDa sobre una [[reducciones|reducci\xF3n]] \xE1cida de chalota, vino blanco seco y vinagre. No lleva yema: la estabilidad viene de la poca agua de la reducci\xF3n y de montar la mantequilla poco a poco a la temperatura justa. Es ligera, \xE1cida y muy sedosa. Es la salsa cl\xE1sica para pescados blancos y verduras. Ver tambi\xE9n [[emulsiones]].",base:{for:"300 g aproximado (6-8 raciones)",items:[["Chalota picada muy fina","60 g"],["Vino blanco seco","100 ml"],["Vinagre de vino blanco","50 ml"],["Nata (opcional, para estabilizar)","30 ml"],["Mantequilla fr\xEDa en dados","250 g"],["Sal y pimienta blanca","al gusto"]],steps:["Reduce la chalota con el vino y el vinagre hasta que queden unas 2 cucharadas de l\xEDquido, casi a seco.","Si usas nata, a\xF1\xE1dela y reduce 1 minuto.","A fuego muy suave, incorpora la mantequilla fr\xEDa en dados, poco a poco, batiendo sin parar. Cada dado debe deshacerse antes de a\xF1adir el siguiente.","La salsa nunca debe hervir; mantenla alrededor de 55-60 \xB0C.","Sala, cuela si la quieres fina y sirve enseguida."]},ratios:[{use:"Cl\xE1sica",ratio:"250 g de mantequilla por 150 ml de l\xEDquido reducido a 2 cucharadas",note:"Fluida y \xE1cida."},{use:"M\xE1s estable para servicio",ratio:"Con 30-50 ml de nata en la reducci\xF3n",note:"Aguanta m\xE1s tiempo en el ba\xF1o mar\xEDa."},{use:"Beurre rouge",ratio:"Vino tinto en lugar de blanco",note:"Para pescados con carne o carnes blancas."},{use:"C\xEDtrica",ratio:"Cambiar el vinagre por zumo de lim\xF3n, lima o yuzu",note:"Para mariscos y pescados al vapor."}],variants:[{id:null,name:"Beurre rouge",note:"Con vino tinto."},{id:null,name:"Beurre blanc con nata",note:"M\xE1s estable, menos \xE1cida."},{id:null,name:"Beurre blanc de cava",note:"Con cava o vino espumoso."},{id:"mantequillas-compuestas",name:"Mantequillas compuestas",note:"Mantequilla aromatizada en fr\xEDo, sin emulsionar."}],keys:["La mantequilla debe estar fr\xEDa: si est\xE1 blanda, se funde sin emulsionar.","Temperatura de servicio 55-60 \xB0C. Por encima de 65 \xB0C se separa; por debajo de 35 \xB0C cuaja.","La reducci\xF3n tiene que estar casi a seco; con mucho l\xEDquido no emulsiona bien.","Una cucharada de nata en la reducci\xF3n da margen de error.","S\xEDrvela reci\xE9n hecha o mantenla al ba\xF1o mar\xEDa tibio, nunca en fuego directo."],errors:[{p:"Se separa (aceitosa)",fix:"Se calent\xF3 demasiado. Fuera del fuego, a\xF1ade un dado de mantequilla fr\xEDa o una cucharada de nata fr\xEDa y bate."},{p:"Cuaja o se vuelve espesa",fix:"Se enfri\xF3. Calienta suavemente batiendo."},{p:"Demasiado \xE1cida",fix:"Reducci\xF3n poco concentrada. A\xF1ade m\xE1s mantequilla."}],history:"Es propia de la cocina del bajo Loira, alrededor de Nantes, donde se serv\xEDa con pescado de r\xEDo. Se populariz\xF3 en la cocina francesa del siglo XX y hoy es una salsa b\xE1sica para pescados en restaurantes de todo el mundo.",uses:["Pescados blancos al vapor o a la plancha","Rodaballo, lubina y merluza","Mariscos","Esp\xE1rragos y verduras","Ravioli de pescado"],keep:"Al ba\xF1o mar\xEDa a 55-60 \xB0C durante el servicio. No se guarda de un d\xEDa para otro: si se enfr\xEDa, cuaja y al recalentar se separa. La reducci\xF3n s\xED se puede preparar y guardar 2-3 d\xEDas.",pro:"Prepara la reducci\xF3n de antemano y monta la mantequilla por turno. Para servicio largo, a\xF1ade nata y mantenla en termo o ba\xF1o mar\xEDa a temperatura controlada. Ten mantequilla fr\xEDa a mano para corregir.",related:["emulsiones","holandesa","reducciones","fumet","mantequillas-compuestas"]},{id:"mantequilla-noisette",name:"Mantequilla noisette",aka:["mantequilla avellana","beurre noisette","mantequilla tostada","mantequilla dorada"],cat:"salsas",group:"Mantequillas",summary:"Mantequilla cocinada hasta que sus s\xF3lidos se tuestan y huelen a avellana; para pescados, verduras, pasta y reposter\xEDa.",what:"Se cocina la mantequilla hasta que el agua se evapora y los s\xF3lidos l\xE1cteos se doran y huelen a avellana. Es la base de la salsa meuni\xE8re (con lim\xF3n y perejil) y de la mantequilla negra (m\xE1s tostada, con alcaparras y vinagre). En pasteler\xEDa da sabor a magdalenas y financieros. Comparte familia con las [[mantequillas-compuestas]].",base:{for:"200 g aproximado",items:[["Mantequilla","250 g"],["Zumo de lim\xF3n (opcional, para cortar la cocci\xF3n)","15 ml"]],steps:["Corta la mantequilla en dados y ponla en un cazo claro (para ver el color) a fuego medio.","Funde y deja que chisporrotee: es el agua evapor\xE1ndose. Remueve de vez en cuando.","Cuando el chisporroteo cesa, se forma espuma y los s\xF3lidos del fondo empiezan a dorar.","Retira del fuego cuando el color sea avellana y huela a frutos secos tostados (1-3 minutos desde que se forma la espuma).","Pasa enseguida a un bol fr\xEDo o a\xF1ade el lim\xF3n para cortar la cocci\xF3n. Cuela si la quieres limpia."]},ratios:[{use:"Meuni\xE8re",ratio:"100 g de noisette + 15 ml de lim\xF3n + perejil picado",note:"Para pescado enharinado y salteado."},{use:"Mantequilla negra",ratio:"M\xE1s tostada + alcaparras + un chorrito de vinagre",note:"Para raya y sesos; sin quemar."},{use:"Pasta con salvia",ratio:"80 g de noisette con hojas de salvia por 4 raciones",note:"Las hojas se fr\xEDen en la mantequilla."},{use:"Reposter\xEDa",ratio:"La receta de mantequilla sale un 15-20 % menor en peso",note:"Compensar: 250 g de mantequilla dan unos 200 g."}],variants:[{id:null,name:"Meuni\xE8re",note:"Con lim\xF3n y perejil."},{id:null,name:"Mantequilla negra",note:"M\xE1s tostada, con alcaparras y vinagre."},{id:"mantequillas-compuestas",name:"Mantequillas compuestas",note:"Mantequilla aromatizada en fr\xEDo."},{id:"beurre-blanc",name:"Beurre blanc",note:"Emulsi\xF3n caliente con reducci\xF3n \xE1cida."}],keys:["Cazo claro para ver el color; en uno oscuro se quema sin que te des cuenta.","Del avellana al quemado hay segundos: retira un punto antes, el calor residual sigue cocinando.","Los s\xF3lidos tostados son el sabor; si la cuelas, gu\xE1rdalos para otras preparaciones.","La mantequilla pierde un 15-20 % de su peso (el agua).","Si la a\xF1ades sobre lim\xF3n o un l\xEDquido fr\xEDo, chisporrotea: hazlo con cuidado."],errors:[{p:"Quemada (negra y amarga)",fix:"No se salva. T\xEDrala y vuelve a empezar a fuego m\xE1s bajo."},{p:"Sin color ni sabor",fix:"Retirada demasiado pronto. Vuelve a calentar hasta que los s\xF3lidos se doren."},{p:"S\xF3lidos dorados de forma desigual",fix:"Remueve durante la cocci\xF3n y usa un cazo de fondo grueso."}],history:"Es una t\xE9cnica cl\xE1sica de la cocina francesa; el nombre noisette significa avellana. La meuni\xE8re y la mantequilla negra son preparaciones cl\xE1sicas del repertorio de pescados y casquer\xEDa. Hoy se usa tambi\xE9n mucho en pasteler\xEDa y en salsas emulsionadas.",uses:["Pescado a la meuni\xE8re","Raya y sesos","Pasta con salvia","Verduras salteadas","Magdalenas y financieros"],keep:"Enfriada, 2-3 semanas en c\xE1mara; congelada, meses. Para usarla en salsa, se funde de nuevo a fuego suave sin que se queme.",pro:"Hazla en cantidad, enfr\xEDala y gu\xE1rdala en porciones en c\xE1mara. En el pase, se calienta al momento en sart\xE9n con el lim\xF3n y el perejil. En pasteler\xEDa, p\xE9sala ya hecha.",related:["mantequillas-compuestas","beurre-blanc","emulsiones","holandesa"]},{id:"mantequillas-compuestas",name:"Mantequillas compuestas",aka:["mantequilla ma\xEEtre d'h\xF4tel","mantequilla de hierbas","mantequilla aromatizada","beurres compos\xE9s"],cat:"salsas",group:"Mantequillas",summary:"Mantequilla pomada mezclada con hierbas, especias u otros arom\xE1ticos, enfriada en cilindros y cortada en rodajas.",what:"Mantequilla pomada mezclada con arom\xE1ticos crudos o cocinados, enrollada en film, enfriada y cortada en rodajas que se funden sobre la pieza caliente. La m\xE1s conocida es la ma\xEEtre d'h\xF4tel (perejil y lim\xF3n), pero las hay de anchoa, ajo, hierbas, chalota y vino, especias, algas o marisco. Son una salsa de reserva para la parrilla. Ver tambi\xE9n [[mantequilla-noisette]].",base:{for:"300 g aproximado (ma\xEEtre d'h\xF4tel)",items:[["Mantequilla pomada","250 g"],["Perejil picado fino","20-30 g"],["Zumo de lim\xF3n","15 ml"],["Sal fina","3-4 g"],["Pimienta negra molida","al gusto"]],steps:["Saca la mantequilla con tiempo hasta que est\xE9 pomada (blanda, sin fundirse).","Mezcla con esp\xE1tula o varilla hasta que est\xE9 cremosa.","A\xF1ade el perejil, el lim\xF3n, la sal y la pimienta; mezcla bien.","Extiende la mantequilla sobre film en forma de cilindro de 3-4 cm de di\xE1metro y enrolla apretando.","Enfr\xEDa en c\xE1mara al menos 2 horas o congela. Corta en rodajas de 1 cm al momento de servir."]},ratios:[{use:"Ma\xEEtre d'h\xF4tel",ratio:"250 g de mantequilla + 25 g de perejil + 15 ml de lim\xF3n",note:"Para carnes y pescados a la parrilla."},{use:"De anchoa",ratio:"250 g de mantequilla + 40-60 g de anchoa en salaz\xF3n",note:"Para carnes rojas y pescado."},{use:"De ajo y perejil",ratio:"250 g de mantequilla + 15-20 g de ajo + 30 g de perejil",note:"Para caracoles, almejas y pan."},{use:"Bercy o vino tinto",ratio:"250 g de mantequilla + 30 g de chalota + 100 ml de vino reducido a seco",note:"Para carnes rojas."},{use:"De marisco",ratio:"250 g de mantequilla + 150 g de caparazones, cocinada, colada y enfriada",note:"Para salsas de marisco y arroces."}],variants:[{id:null,name:"Ma\xEEtre d'h\xF4tel",note:"Perejil y lim\xF3n."},{id:null,name:"De anchoa",note:"Anchoa en salaz\xF3n majada."},{id:null,name:"De ajo y perejil",note:"Para caracoles y mariscos."},{id:null,name:"De vino tinto y chalota",note:"Para carnes."},{id:null,name:"De piment\xF3n o especias",note:"Para carnes y pescados a la brasa."},{id:"beurre-blanc",name:"Beurre blanc",note:"La versi\xF3n emulsionada en caliente."}],keys:["Mantequilla pomada, no fundida: si se funde, no recupera la textura.","Hierbas bien secas antes de picar; el agua hace que la mantequilla se corte.","Los ajos y hierbas crudos limitan la conservaci\xF3n; para guardar m\xE1s tiempo, congela.","Corta las rodajas con un cuchillo caliente si est\xE1 congelada.","Ponla sobre la pieza justo al servir, para que se funda en la mesa."],errors:[{p:"Se separa el agua",fix:"Hierbas mojadas o lim\xF3n en exceso. Mezcla m\xE1s tiempo o a\xF1ade el l\xEDquido poco a poco."},{p:"Sabor rancio o fuerte",fix:"Se guard\xF3 demasiado. Hazla en lotes peque\xF1os o cong\xE9lala."},{p:"Color oscuro en las hierbas",fix:"Hierbas cortadas con cuchillo romo o picadas con mucha antelaci\xF3n. Pica al momento con cuchillo afilado."}],history:"Son un recurso cl\xE1sico de la cocina francesa, recogido en los recetarios del siglo XIX y principios del XX con numerosas variantes. Se pensaron para dar sabor r\xE1pido a la parrilla sin tener que hacer una salsa en el momento.",uses:["Carnes y pescados a la parrilla","Caracoles y almejas","Pan tostado","Verduras al vapor","Para terminar salsas"],keep:"Con hierbas y ajo crudos, 5-7 d\xEDas en c\xE1mara. Congelada, 2-3 meses. Siempre bien envuelta en film para que no coja olores.",pro:"Hazla en lotes, en cilindros etiquetados y congelados. Corta las rodajas con antelaci\xF3n y gu\xE1rdalas en c\xE1mara sobre papel sulfurizado para el servicio. Ten dos o tres tipos para combinar con la carta.",related:["mantequilla-noisette","beurre-blanc","chimichurri","pesto","salsa-verde"]},{id:"salsa-americana",name:"Salsa americana",aka:["americana","salsa armoricana","sauce am\xE9ricaine","salsa de marisco"],cat:"salsas",group:"Salsas de marisco",summary:"Salsa de cabezas y caparazones de crust\xE1ceo salteados, flambeados con co\xF1ac y cocidos con tomate y vino blanco.",what:"Se hace salteando cabezas y caparazones de crust\xE1ceo (bogavante, cigala, langostino, gamba), flambe\xE1ndolos con co\xF1ac o brandy y coci\xE9ndolos con [[mirepoix]] fina, tomate, vino blanco y [[fondo-de-marisco|fondo de marisco]] o [[fumet]]. Se cuela, se reduce y se liga con nata, mantequilla o coral. En Espa\xF1a es la salsa de la merluza y el rape a la americana.",base:{for:"1 litro aproximado",items:[["Cabezas y caparazones de crust\xE1ceo","1 kg"],["Aceite de oliva","60 ml"],["Mantequilla","50 g"],["Mirepoix fina (chalota o cebolla, zanahoria, apio)","150 g"],["Ajo","2 dientes"],["Co\xF1ac o brandy","100 ml"],["Vino blanco seco","200 ml"],["Tomate maduro troceado","300 g"],["Tomate concentrado","1 cucharada"],["Fumet o fondo de marisco","1,5 l"],["Estrag\xF3n, cayena o piment\xF3n","al gusto"],["Nata (opcional)","150-200 ml"]],steps:["Saltea las cabezas y caparazones en el aceite a fuego fuerte hasta que cojan color, aplast\xE1ndolas para que suelten el jugo.","A\xF1ade la mirepoix y el ajo, y rehoga 5 minutos.","Flambea con el co\xF1ac, con la campana apagada y lejos de material inflamable.","A\xF1ade el tomate concentrado y tu\xE9stalo 1 minuto; incorpora el vino blanco y reduce a la mitad.","A\xF1ade el tomate, el fumet y las hierbas, y cuece a fuego suave 30-40 minutos.","Tritura, cuela por chino apretando bien y luego por estame\xF1a.","Reduce hasta el punto deseado y termina con la nata y la mantequilla."]},ratios:[{use:"Salsa para pescado",ratio:"Reducir hasta 1 l con 150 ml de nata",note:"Napante; para merluza, rape o crepes."},{use:"Bisque o crema",ratio:"Con 50-80 g de arroz cocido en la salsa y triturado",note:"M\xE1s fluida; se sirve como plato."},{use:"Para arroces o pasta",ratio:"Reducir a la mitad sin nata",note:"Muy concentrada; da mucho sabor."},{use:"Ligada con mantequilla",ratio:"50-80 g de mantequilla por litro",note:"M\xE1s brillante, sin nata."}],variants:[{id:null,name:"Bisque",note:"Crema de marisco ligada con arroz."},{id:null,name:"Salsa Nantua",note:"Bechamel con mantequilla de cangrejo; para pescado."},{id:"fondo-de-marisco",name:"Fondo de marisco",note:"La base l\xEDquida de la salsa."},{id:"mantequillas-compuestas",name:"Mantequilla de marisco",note:"Para terminar la salsa."}],keys:["El sabor sale del tostado de las cabezas: color fuerte y aplastarlas para sacar el jugo.","No quemes el ajo ni el tomate concentrado: amargan toda la salsa.","Cuela dos veces; los restos de caparaz\xF3n estropean la textura.","Flambea con seguridad: campana apagada, cazo fuera del fuego al verter.","El coral y la mantequilla al final dan brillo y color."],errors:[{p:"Amarga",fix:"Caparazones quemados o cocci\xF3n demasiado larga. No tiene arreglo completo; alarga con fumet y nata."},{p:"Poco sabor",fix:"Pocas cabezas o tostado insuficiente. A\xF1ade m\xE1s y reduce."},{p:"Textura arenosa",fix:"Restos de caparaz\xF3n. Cuela por estame\xF1a."}],history:"Su origen se discute: hay quien defiende que el nombre es americana y quien defiende armoricana (de Breta\xF1a). La versi\xF3n m\xE1s aceptada sit\xFAa su creaci\xF3n en Par\xEDs en el siglo XIX. En Espa\xF1a se populariz\xF3 con platos como la merluza o el rape a la americana.",uses:["Merluza y rape a la americana","Crepes de marisco","Arroces y fideos","Pasta con marisco","Bisque"],keep:"Abatida, 3 d\xEDas en c\xE1mara. Congela muy bien sin nata. Regenerar a fuego suave y terminar con nata y mantequilla.",pro:"Aprovecha todas las cabezas y caparazones del servicio: cong\xE9lalas hasta tener cantidad y haz la salsa en lote. Porciona en bolsas o recipientes de 500 ml y congela. En el pase, termina con nata y mantequilla al momento.",related:["fondo-de-marisco","fumet","mirepoix","salsa-de-tomate","reducciones"]}];var Cs=[{id:"emulsiones",name:"Emulsiones",aka:["emulsi\xF3n","emulsionar","ligar una salsa","montar una salsa"],cat:"conceptos",group:"Fundamentos",summary:"Mezcla de dos l\xEDquidos que no se mezclan, grasa y agua, que se mantiene unida gracias al batido y a un emulsionante.",what:"Gotas muy finas de un l\xEDquido repartidas dentro de otro con el que no se mezcla; en cocina, casi siempre grasa dentro de agua. Las inestables, como la [[vinagreta]], se separan en minutos; las estables aguantan horas o d\xEDas porque un emulsionante recubre cada gota. Las hay fr\xEDas ([[mayonesa]], [[alioli]]) y calientes ([[holandesa]], [[bearnesa]], [[beurre-blanc]], [[pil-pil]]).",base:{for:"Principios v\xE1lidos para cualquier emulsi\xF3n de aceite",items:[["Fase acuosa (yema, vinagre, zumo, agua, fondo)","15-25 % del total"],["Fase grasa (aceite, mantequilla clarificada, grasa del pescado)","75-85 % del total"],["Yema de huevo (lecitina y prote\xEDnas)","1 yema por 200-250 ml de aceite"],["Mostaza","5-10 g por yema; refuerza y estabiliza"],["Gelatina del bacalao o de la merluza","la que suelta la piel al confitar a 60-70 \xB0C"],["Lecitina de soja en polvo","0,3-1 % del peso del l\xEDquido, seg\xFAn sea aire o salsa"]],steps:["Igualar temperaturas: en fr\xEDo, todo a 18-22 \xB0C; en caliente, la grasa a 50-65 \xB0C seg\xFAn la salsa y la yema sin pasar de 65 \xB0C.","Fase acuosa y emulsionante primero; la grasa despu\xE9s, sin dejar de batir: gota a gota al principio, en hilo cuando la salsa espesa y se vuelve opaca.","Si espesa demasiado, unas gotas de agua, \xE1cido o fondo permiten seguir a\xF1adiendo grasa sin que se corte.","Sazonar al final. Si suelta grasa por los bordes, est\xE1 al l\xEDmite."]},ratios:[{use:"Mayonesa",ratio:"1 yema por 200-250 ml de aceite",note:"no pasar de 300 ml"},{use:"Vinagreta (inestable)",ratio:"3 partes de aceite por 1 de \xE1cido",note:"la mostaza la mantiene ligada m\xE1s tiempo"},{use:"Holandesa o bearnesa (caliente)",ratio:"1 yema por 70-100 g de mantequilla clarificada",note:"yemas al ba\xF1o mar\xEDa sin pasar de 65 \xB0C"},{use:"Beurre blanc",ratio:"unos 250 g de mantequilla fr\xEDa sobre una reducci\xF3n de chalota, vino y vinagre",note:"sin yema; mantener a 50-60 \xB0C"},{use:"Aire o espuma",ratio:"lecitina al 0,3-0,6 %",note:"t\xFArmix en superficie"}],variants:[{id:"mayonesa",name:"Mayonesa",note:"Fr\xEDa y estable."},{id:"holandesa",name:"Holandesa",note:"Caliente, de yema y mantequilla."},{id:"pil-pil",name:"Pil-pil",note:"Ligada con la gelatina del pescado."}],keys:["La temperatura manda: en fr\xEDo el aceite engorda y cuesta integrarlo; en caliente, la yema cuaja hacia 65-70 \xB0C.","Gota m\xE1s fina, salsa m\xE1s estable: el t\xFArmix da emulsiones m\xE1s firmes que las varillas.","La grasa entra a la velocidad a la que la salsa la absorbe.","Una salsa demasiado espesa est\xE1 a punto de cortarse: aclarar antes de seguir.","El virgen extra intenso amarga batido a m\xE1quina; mezclarlo con girasol o a\xF1adirlo al final a mano."],errors:[{p:"Se corta en fr\xEDo",fix:"En un bol limpio, una yema nueva o una cucharada de agua tibia o mostaza; a\xF1adir la salsa cortada en hilo, batiendo."},{p:"Se corta en caliente por exceso de temperatura",fix:"Fuera del fuego, batir con una cucharada de agua fr\xEDa; si la yema ha cuajado, empezar con otra yema y a\xF1adir la salsa cortada poco a poco."},{p:"No espesa",fix:"Falta emulsionante o sobra l\xEDquido: m\xE1s grasa despacio o una yema m\xE1s."}],history:"Las salsas de ajo y aceite al mortero son muy antiguas en el Mediterr\xE1neo; las de yema y aceite o mantequilla se fijaron en la cocina francesa cl\xE1sica. La explicaci\xF3n cient\xEDfica lleg\xF3 mucho despu\xE9s, y la cocina moderna ha sumado emulsionantes como la lecitina.",uses:["Salsas fr\xEDas","Salsas de mantequilla","Ali\xF1os","Aires","Ligar jugos al pase"],keep:"Fr\xEDas con huevo: huevo pasteurizado en restauraci\xF3n, a 4 \xB0C o menos y 24 horas. Calientes de mantequilla: tibias a 55-60 \xB0C, como m\xE1ximo un par de horas, y se desechan. Vinagretas simples: varios d\xEDas en fr\xEDo.",pro:"Montar en volumen con robot o t\xFArmix y tener a mano una yema pasteurizada o agua tibia para recuperar. En el pase, las calientes en termo a 55-60 \xB0C; las fr\xEDas en biber\xF3n sobre hielo.",related:["mayonesa","holandesa","vinagreta","pil-pil","beurre-blanc","ligazones","alioli"]},{id:"mayonesa",name:"Mayonesa",aka:["mahonesa","salsa mayonesa"],cat:"salsas",group:"Emulsiones fr\xEDas",summary:"Emulsi\xF3n fr\xEDa de yema y aceite con \xE1cido y sal; base de muchas salsas fr\xEDas.",what:"Emulsi\xF3n estable de aceite en la fase acuosa que aportan la yema y el \xE1cido (vinagre o lim\xF3n), con sal. Es la [[emulsiones|emulsi\xF3n]] fr\xEDa de referencia y la madre de la [[tartara|t\xE1rtara]], del [[alioli]] con huevo, de la salsa rosa y de muchas salsas de autor. En restauraci\xF3n se elabora siempre con huevo pasteurizado.",base:{for:"unos 500 ml",items:[["Yema de huevo pasteurizada","2 (unos 40 g)"],["Mostaza de Dijon (opcional)","10 g"],["Vinagre de vino blanco o zumo de lim\xF3n","15-20 ml"],["Sal fina","4-5 g"],["Aceite de girasol","300 ml"],["Aceite de oliva suave","150 ml"],["Agua fr\xEDa","10-15 ml, para ajustar"]],steps:["Atemperar yemas, \xE1cido y aceites a 18-22 \xB0C; la yema pasteurizada, fuera de c\xE1mara solo unos 20 minutos.","Batir las yemas con la mostaza, la sal y la mitad del \xE1cido en un bol sobre pa\xF1o h\xFAmedo.","A\xF1adir el aceite gota a gota los primeros 50-60 ml, hasta que espese y se vuelva opaca; despu\xE9s, en hilo fino.","Cuando est\xE9 muy espesa, aclarar con el resto del \xE1cido y unas gotas de agua y terminar el aceite. Rectificar: brillante y con pico blando.","Con t\xFArmix: todo en vaso estrecho, brazo en el fondo; arrancar sin moverlo hasta que monte abajo y subir despacio."]},ratios:[{use:"Mayonesa de mesa, fritura o marisco",ratio:"1 yema por 220-250 ml de aceite",note:"pico blando"},{use:"Ensaladilla o rellenos",ratio:"1 yema por 250-280 ml, con mostaza",note:"m\xE1s firme: la patata la afloja"},{use:"Para salsear o puntos en biber\xF3n",ratio:"aclarar con 10-20 ml de agua o [[fumet]] por cada 250 ml",note:"que caiga en cinta"},{use:"Con aceite de oliva virgen extra",ratio:"como mucho un tercio de virgen extra si se monta a m\xE1quina",note:"el resto a mano y al final, para que no amargue"},{use:"Sin huevo (lactonesa)",ratio:"1 parte de leche entera fr\xEDa por 2 de aceite, con t\xFArmix",note:"para al\xE9rgicos al huevo; menos firme"}],variants:[{id:"tartara",name:"Salsa t\xE1rtara",note:"Con encurtidos, alcaparras, chalota y huevo cocido."},{id:"alioli",name:"Alioli con huevo",note:"Con ajo majado."},{id:null,name:"Salsa rosa",note:"Con tomate concentrado, un punto de brandy y zumo de naranja."},{id:null,name:"Mayonesas aromatizadas",note:"Azafr\xE1n, piment\xF3n ahumado, hierbas, c\xEDtricos o jugo de cabezas de marisco."}],keys:["En restauraci\xF3n, siempre huevo pasteurizado, nunca huevo fresco crudo.","El \xE1cido da sabor y estabilidad, pero no sustituye al huevo pasteurizado ni al fr\xEDo.","Dos tercios de girasol y un tercio de oliva suave: neutra y estable.","Sal disuelta en el \xE1cido antes de montar.","Pa\xF1o h\xFAmedo bajo el bol y \xE1cido en dos tiempos evitan casi todos los cortes."],errors:[{p:"Se corta",fix:"Bol limpio con una yema nueva o una cucharada de agua tibia; a\xF1adir la mayonesa cortada en hilo, batiendo."},{p:"Amarga",fix:"Virgen extra batido a m\xE1quina: montar con girasol y a\xF1adir el oliva al final, a mano."},{p:"Plana",fix:"Falta \xE1cido y sal."}],history:"Su origen se discute: se relaciona con Mah\xF3n y con la cocina francesa del siglo XVIII, de ah\xED la doble forma mayonesa y mahonesa. Lo seguro es que antes ya exist\xEDan en el Mediterr\xE1neo emulsiones de ajo y aceite al mortero, como el [[alioli]].",uses:["Ensaladilla","Pescado y marisco cocidos","Fritos y rebozados","Bocadillos","Base de salsas fr\xEDas"],keep:"A 4 \xB0C o menos, tapada y etiquetada con la hora, y consumida en 24 horas. No congelar: se corta. No dejarla en el pase fuera de fr\xEDo.",pro:"Montar en lotes de 1-2 litros seg\xFAn la previsi\xF3n del d\xEDa. En el pase, biberones peque\xF1os sobre hielo y el repuesto en c\xE1mara. Las aromatizadas, como derivadas de una sola base.",related:["emulsiones","alioli","tartara","salsa-brava","vinagreta","holandesa"]},{id:"alioli",name:"Alioli",aka:["allioli","all i oli","ajoaceite","a\xEFoli"],cat:"salsas",group:"Emulsiones fr\xEDas",summary:"Emulsi\xF3n de ajo y aceite: la tradicional, al mortero solo con ajo, aceite y sal; la habitual en cocina, con huevo.",what:"Salsa mediterr\xE1nea de ajo majado y aceite de oliva. La versi\xF3n tradicional de Catalu\xF1a, Valencia, Baleares y Arag\xF3n se hace al mortero solo con ajo, sal y aceite: el propio ajo sostiene la [[emulsiones|emulsi\xF3n]]. La versi\xF3n con huevo es en realidad una [[mayonesa]] de ajo, m\xE1s r\xE1pida y estable, y es la habitual en cocina.",base:{for:"unos 250 ml (mortero) o 500 ml (con huevo)",items:[["Mortero: ajo pelado y sin germen","6 dientes (25-30 g)"],["Mortero: sal gruesa","2-3 g"],["Mortero: aceite de oliva suave","200 ml"],["Con huevo: yema pasteurizada","2"],["Con huevo: ajo","3-5 dientes"],["Con huevo: zumo de lim\xF3n","10 ml"],["Con huevo: aceite (mitad oliva suave, mitad girasol)","400 ml"],["Con huevo: sal fina","4 g"]],steps:["Mortero: majar el ajo con la sal hasta una pasta lisa, sin trozos.","A\xF1adir el aceite gota a gota, girando siempre en el mismo sentido y sin prisa; se tarda 15-20 minutos.","Cuando engorde y blanquee, el aceite puede caer en hilo muy fino. Si se ve brillante y aceitosa, parar y majar hasta que lo absorba.","Con huevo: majar el ajo con la sal, pasarlo al vaso con las yemas y el lim\xF3n y montar como una mayonesa."]},ratios:[{use:"Mortero estricto",ratio:"25-30 g de ajo por 200 ml de aceite",note:"con m\xE1s ajo monta mejor"},{use:"Con huevo, para arroces",ratio:"1 yema por 200 ml de aceite y 1-2 dientes por yema",note:"el ajo crudo pica m\xE1s con las horas"},{use:"Suave",ratio:"1 cabeza de ajo confitado o escaldado por 250 ml",note:"dulce y m\xE1s estable"},{use:"Para gratinar",ratio:"con huevo, firme",note:"salamandra fuerte, sobre bacalao o verduras"}],variants:[{id:"mayonesa",name:"Mayonesa",note:"Base de la versi\xF3n con huevo."},{id:null,name:"Allioli de membrillo",note:"Catal\xE1n, para carnes y caza; proporciones de cada casa."},{id:null,name:"Rouille",note:"Provenzal, con pimiento o guindilla, azafr\xE1n y pan; para sopas de pescado."}],keys:["Ajo fresco, firme y sin germen: el germen amarga.","En el mortero, constancia antes que velocidad.","El de mortero se hace para el servicio: con las horas pica y amarga.","Con huevo, siempre pasteurizado y conservado como la mayonesa.","Hay quien ayuda con gotas de agua, lim\xF3n o miga de pan: funciona, pero ya no es la versi\xF3n estricta."],errors:[{p:"Se corta en el mortero",fix:"En un mortero limpio, majar otro diente con sal e incorporar la salsa cortada poco a poco."},{p:"Amarga o pica en exceso",fix:"Germen, aceite muy intenso o salsa con horas; usar ajo escaldado si la sala lo pide suave."}],history:"Es una salsa muy antigua del Mediterr\xE1neo occidental, anterior a la mayonesa con yema, propia de la cocina popular catalana, valenciana, balear y aragonesa, y de la provenzal como a\xEFoli. La versi\xF3n con huevo se generaliz\xF3 en las cocinas profesionales por rapidez y estabilidad.",uses:["Arroces y fideu\xE1","Carnes y verduras a la brasa","Bacalao gratinado","Patatas","Conejo y caracoles"],keep:"El de mortero, en el d\xEDa. Con huevo pasteurizado, a 4 \xB0C o menos y 24 horas. No congelar. Ajo pelado o confitado en aceite, siempre en fr\xEDo y en pocos d\xEDas: fuera de fr\xEDo hay riesgo de botulismo.",pro:"Para volumen, robot con el ajo ya majado y yemas pasteurizadas; el de mortero, por raciones. En el pase, biber\xF3n sobre hielo o quenelle sobre el arroz al salir.",related:["mayonesa","emulsiones","aceites-aromatizados","salsa-brava","picada","romesco"]},{id:"tartara",name:"Salsa t\xE1rtara",aka:["t\xE1rtara","salsa tartar"],cat:"salsas",group:"Emulsiones fr\xEDas",summary:"Mayonesa con encurtidos, alcaparras, chalota, huevo cocido y hierbas; pareja cl\xE1sica del pescado frito.",what:"Derivada de la [[mayonesa]] a la que se a\xF1aden elementos picados: pepinillo, alcaparra, chalota o cebolleta, perejil, a menudo huevo cocido y a veces estrag\xF3n o cebollino. Aporta acidez y textura a fritos, rebozados y pescado a la plancha o a la brasa. Existen versiones cl\xE1sicas montadas con yema cocida, pero hoy casi siempre se parte de una mayonesa firme.",base:{for:"unos 500 g",items:[["Mayonesa firme","400 g"],["Pepinillos en vinagre","40 g"],["Alcaparras","25 g"],["Chalota","30 g"],["Huevo cocido","1"],["Perejil","5 g"],["Estrag\xF3n y cebollino","3 g"],["Mostaza de Dijon","10 g"],["Zumo de lim\xF3n o vinagre de los encurtidos, sal y pimienta","al gusto"]],steps:["Picar la chalota muy fina, lavarla en agua fr\xEDa y escurrirla: pierde el picor fuerte y no domina con las horas.","Picar pepinillos y alcaparras en brunoise y prensarlos en un pa\xF1o para quitarles l\xEDquido; si no, aguan la salsa.","Cocer el huevo 10-11 minutos desde que rompe el hervor, enfriar en agua con hielo y picarlo fino.","Picar las hierbas en el \xFAltimo momento.","Mezclar todo con la mayonesa y la mostaza con esp\xE1tula, sin batir. Ajustar con lim\xF3n o vinagre de los encurtidos, sal y pimienta.","Reposar 30 minutos en fr\xEDo para que se integren los sabores."]},ratios:[{use:"Pescado frito y rebozados",ratio:"100 g de picados por 400 g de mayonesa",note:"picado con tropez\xF3n, que se note"},{use:"Para salsear o biber\xF3n",ratio:"60-70 g de picados muy finos por 400 g, aclarada con 20 ml de agua",note:"que pase p
