or la boquilla"},{use:"Bocadillo o hamburguesa de pescado",ratio:"m\xE1s pepinillo y mostaza (el doble)",note:"m\xE1s \xE1cida para cortar la grasa del pan y del rebozado"},{use:"Versi\xF3n ligera",ratio:"mitad mayonesa, mitad yogur griego",note:"m\xE1s fresca; dura lo mismo que la mayonesa"}],variants:[{id:"mayonesa",name:"Mayonesa",note:"La base."},{id:null,name:"Gribiche",note:"Emparentada: se monta sobre yema de huevo cocido con mostaza, encurtidos y hierbas; m\xE1s r\xFAstica."},{id:null,name:"Remoulade",note:"Mayonesa con mostaza, encurtidos, alcaparras y a veces anchoa; muy pr\xF3xima."},{id:null,name:"T\xE1rtara de yogur",note:"M\xE1s ligera, para pescado a la plancha."}],keys:["Encurtidos y alcaparras bien escurridos y prensados: son los que aguan la salsa.","Chalota lavada; sin lavar, al d\xEDa siguiente la salsa sabe solo a cebolla.","Mezclar con esp\xE1tula, nunca con t\xFArmix: es una salsa con textura.","Hierbas picadas al momento; picadas de v\xEDspera se oscurecen.","Partir de una mayonesa m\xE1s firme de lo normal, porque los picados la aflojan."],errors:[{p:"Se agua en c\xE1mara",fix:"Picados sin escurrir. Prensarlos en pa\xF1o y, si ya est\xE1 aguada, a\xF1adir m\xE1s mayonesa firme."},{p:"Demasiado \xE1cida",fix:"Exceso de vinagre de encurtidos; compensar con m\xE1s mayonesa."},{p:"Sabor fuerte de cebolla al d\xEDa siguiente",fix:"Chalota sin lavar o salsa hecha con demasiada antelaci\xF3n; lavarla y no preparar m\xE1s de lo del d\xEDa."}],history:"Es una salsa cl\xE1sica de la cocina francesa, derivada de la mayonesa y presente en los recetarios cl\xE1sicos de los siglos XIX y XX. El nombre se suele asociar a los t\xE1rtaros, pero no hay una explicaci\xF3n segura de por qu\xE9. Desde all\xED se extendi\xF3 por todo el mundo como pareja del pescado frito.",uses:["Pescado frito y rebozado","Calamares","Croquetas de pescado","Pescado a la brasa o a la plancha","Bocadillos"],keep:"Con mayonesa de huevo pasteurizado, a 4 \xB0C o menos y consumida en 24 horas; el huevo cocido y la chalota tampoco permiten alargarla. No congelar. Etiquetar con la hora de elaboraci\xF3n.",pro:"Tener los picados escurridos en cubetas en la mise en place y mezclarlos con la mayonesa en lotes peque\xF1os a lo largo del servicio. En el pase, biber\xF3n de boca ancha dentro de hielo, o quenelle en el plato. Si el pescado frito va en cesta, la t\xE1rtara aparte en un cuenco para que no reblandezca el rebozado.",related:["mayonesa","emulsiones","alioli","vinagreta"]},{id:"vinagreta",name:"Vinagreta",aka:["vinagreta cl\xE1sica","ali\xF1o","vinaigrette"],cat:"salsas",group:"Bases y ali\xF1os",summary:"Emulsi\xF3n inestable de aceite y \xE1cido con sal; ali\xF1o b\xE1sico de ensaladas, pescados, verduras y legumbres.",what:"Mezcla de aceite y \xE1cido (vinagre o c\xEDtrico) con sal y, a menudo, mostaza, chalota y hierbas. Es una [[emulsiones|emulsi\xF3n]] inestable: se separa en minutos salvo que lleve algo que la sostenga, como mostaza, un poco de yema o miel. Sirve de ali\xF1o, de [[marinada]] corta y de salsa fr\xEDa o templada para pescados y verduras a la brasa.",base:{for:"unos 400 ml",items:[["Aceite de oliva virgen extra","300 ml"],["Vinagre de Jerez o de vino","100 ml"],["Sal fina","5-6 g"],["Mostaza de Dijon (opcional)","15 g"],["Chalota (opcional)","30 g"],["Pimienta negra reci\xE9n molida","al gusto"]],steps:["Disolver la sal en el vinagre antes de a\xF1adir el aceite: en la grasa no se disuelve.","A\xF1adir la mostaza y la chalota picada fina y dejar 5-10 minutos para que la chalota se suavice en el \xE1cido.","Incorporar el aceite en hilo batiendo con varillas, o agitar en botella. Con t\xFArmix queda m\xE1s ligada, opaca y dura m\xE1s sin separarse.","Probar sobre una hoja o sobre el producto, no a cucharadas: el sabor cambia.","Volver a emulsionar justo antes de ali\xF1ar."]},ratios:[{use:"Ensalada verde",ratio:"3 partes de aceite por 1 de vinagre",note:"la cl\xE1sica; ali\xF1ar al momento"},{use:"Con c\xEDtrico o vinagre suave (arroz, sidra)",ratio:"2:1",note:"menos acidez, admite m\xE1s \xE1cido"},{use:"Pescado o marisco a la brasa",ratio:"4:1, con un chorrito de [[fumet]] o del jugo del pescado",note:"m\xE1s suave: manda el producto"},{use:"Legumbres, patata o verduras templadas",ratio:"3:1 con m\xE1s mostaza",note:"ali\xF1ar en caliente: lo absorben mejor"},{use:"Vinagreta de jugo, templada",ratio:"1 parte de [[jugo-de-carne]] o [[reducciones|reducci\xF3n]], 1 de \xE1cido y 3 de aceite",note:"para carnes, setas o verduras asadas"},{use:"Marinada corta",ratio:"2:1 con ajo y hierbas",note:"20-30 minutos para pescado en filetes"}],variants:[{id:null,name:"Vinagreta de mostaza",note:"M\xE1s mostaza, m\xE1s ligada y estable."},{id:null,name:"Vinagreta de picadillo",note:"Pimiento, cebolla y tomate en brunoise; para mejillones, pulpo o pescado a la brasa."},{id:"chimichurri",name:"Chimichurri",note:"Vinagreta cargada de hierbas, ajo y guindilla para la carne."},{id:"escabeche",name:"Escabeche",note:"Aceite y vinagre con arom\xE1ticos, en caliente y como t\xE9cnica de cocci\xF3n."}],keys:["Sal en el \xE1cido primero; despu\xE9s el aceite.","El vinagre marca la vinagreta m\xE1s que el aceite: uno bueno y suave vale m\xE1s que uno fuerte.","Las hojas se ali\xF1an en el \xFAltimo momento y bien secas; ali\xF1adas antes se queman y sueltan agua.","En pescados y verduras a la brasa, ali\xF1ar justo al salir del fuego, cuando absorben mejor.","En c\xE1mara el aceite de oliva se espesa y enturbia: sacar la vinagreta 20 minutos antes del servicio."],errors:[{p:"Se separa en el pase",fix:"Es normal. Agitar antes de cada uso o ligar con mostaza, un poco de miel o t\xFArmix."},{p:"Ensalada blanda y aguada",fix:"Hojas mojadas o ali\xF1adas antes de tiempo; centrifugar bien y ali\xF1ar al pase."},{p:"Muy \xE1cida",fix:"Corregir con m\xE1s aceite o rebajar el vinagre con un poco de agua o fondo."}],history:"Ali\xF1ar con aceite, vinagre y sal es costumbre antiqu\xEDsima en el Mediterr\xE1neo. La palabra vinagreta viene del franc\xE9s y se asoci\xF3 a la versi\xF3n emulsionada con mostaza y chalota de la cocina cl\xE1sica francesa. En Espa\xF1a el ali\xF1o tradicional es echar aceite, vinagre y sal directamente sobre la ensalada, sin emulsionar.",uses:["Ensaladas","Pescado y marisco a la brasa","Verduras asadas","Legumbres","Pulpo y mejillones"],keep:"Vinagreta simple: hasta una semana en fr\xEDo, tapada. Con chalota, ajo o hierbas frescas, 2-3 d\xEDas, y las hierbas se oscurecen: mejor a\xF1adirlas al usar. Con picadillo de verduras, 1-2 d\xEDas. Sacarla del fr\xEDo antes del servicio.",pro:"Producir la base sin hierbas en botellas con dosificador, etiquetadas con fecha. Hierbas y picados al pase. Para un restaurante de brasa, tener dos: una cl\xE1sica para ensaladas y otra m\xE1s suave para pescados, para no tapar el producto.",related:["emulsiones","mayonesa","chimichurri","marinada","escabeche","aceites-aromatizados"]},{id:"romesco",name:"Romesco",aka:["salsa romesco","romesco de Tarragona"],cat:"salsas",group:"Salsas espa\xF1olas",summary:"Salsa de Tarragona de \xF1ora, tomate y ajo asados, frutos secos tostados, pan, vinagre y aceite; para pescados y verduras a la brasa.",what:"Salsa majada del Camp de Tarragona hecha con carne de \xF1ora (pimiento seco), tomate y ajo asados, almendra y avellana tostadas, pan frito o tostado, vinagre y aceite de oliva. En la zona el nombre tambi\xE9n designa guisos de pescado que la usan como base. Es pariente de la [[picada]]: comparte la l\xF3gica de dar sabor y cuerpo con frutos secos y pan.",base:{for:"unos 600 ml",items:[["\xD1oras","6 (unos 30 g)"],["Tomates maduros","3 (400 g)"],["Ajo","1 cabeza"],["Almendra tostada","50 g"],["Avellana tostada y pelada","50 g"],["Pan del d\xEDa anterior frito en aceite","30 g"],["Vinagre de vino","20-30 ml"],["Aceite de oliva","200 ml"],["Sal y guindilla (opcional)","al gusto"]],steps:["Quitar rabo y pepitas a las \xF1oras, hidratarlas en agua caliente 30 minutos y raspar la carne.","Asar tomates y la cabeza de ajo entera a 180-200 \xB0C, 25-35 minutos. Pelar.","Tostar almendras y avellanas a 160-170 \xB0C, 10-12 minutos; pelar las avellanas en un pa\xF1o. Fre\xEDr el pan.","Majar o triturar ajos, frutos secos y pan; a\xF1adir \xF1ora y tomate sin pepitas.","Emulsionar con el aceite en hilo y el vinagre, dejando grano. Salar y reposar al menos una hora."]},ratios:[{use:"Pescado y verduras a la brasa",ratio:"receta base, con grano",note:"servir atemperada"},{use:"Dip o para untar",ratio:"+30 % de frutos secos y pan, -30 % de aceite",note:"m\xE1s densa"},{use:"Para cal\xE7ots o cebolletas asadas",ratio:"m\xE1s tomate y ajo asados, m\xE1s vinagre y aceite",note:"m\xE1s fluida y sedosa; ver salsa de cal\xE7ots"},{use:"Base de guiso de pescado",ratio:"la salsa se afloja con [[fumet]] y el pescado se cuece en ella",note:"las recetas de la zona var\xEDan mucho"}],variants:[{id:null,name:"Salsa de cal\xE7ots / salvitxada",note:"Muy pr\xF3xima, propia de Valls y su comarca para la cal\xE7otada; suele ser m\xE1s fluida y con m\xE1s tomate y ajo asados. Nombre y proporciones cambian de un pueblo a otro, y no todos distinguen salvitxada de salsa de cal\xE7ots."},{id:null,name:"Romesco de peix",note:"Guiso de pescado tarraconense con la salsa como base."},{id:"picada",name:"Picada",note:"El majado catal\xE1n que comparte su l\xF3gica."}],keys:["La \xF1ora aporta color y dulzor, no picor; el picante, si se quiere, viene de la guindilla.","Frutos secos bien tostados: son el sabor principal. P\xE1lidos, la salsa queda plana.","Asar tomate y ajo quita el sabor crudo y da profundidad.","Dejar textura con grano; triturada en exceso se vuelve una pasta sin car\xE1cter."],errors:[{p:"Amarga",fix:"\xD1ora o frutos secos quemados, o pepitas de \xF1ora. Vigilar el tostado y limpiar bien las \xF1oras."},{p:"Grasienta, el aceite se separa",fix:"Demasiado aceite o poco pan; majar m\xE1s pan y frutos secos e incorporar la salsa sobre ellos, o a\xF1adir un poco del agua de las \xF1oras."},{p:"Plana",fix:"Falta vinagre y sal; corregir poco a poco y dejar reposar antes de volver a probar."}],history:"Nace en el Camp de Tarragona, en el entorno marinero de la ciudad, como salsa y como base de guisos de pescado. Su origen exacto y la receta aut\xE9ntica se discuten: cada familia y cada concurso local tiene la suya.",uses:["Pescado blanco a la brasa","Cal\xE7ots y cebolletas asadas","Alcachofas y verduras a la brasa","Gambas y marisco a la plancha","Carnes blancas"],keep:"En fr\xEDo 4-5 d\xEDas, tapada y con una pel\xEDcula de aceite por encima. Se puede congelar en porciones; pierde algo de textura y hay que remover y ajustar de vinagre al regenerar. Servir siempre atemperada, nunca reci\xE9n salida de c\xE1mara.",pro:"Lotes de 2-3 litros con robot, a grano medio. Sacar del fr\xEDo 30 minutos antes. En el pase, cuenco aparte o quenelle junto al producto, no encima de la piel crujiente.",related:["picada","sofrito","salsa-de-tomate","mojo-picon","salsa-vizcaina","chimichurri"]},{id:"salsa-verde",name:"Salsa verde",aka:["merluza en salsa verde","salsa verde vasca"],cat:"salsas",group:"Salsas espa\xF1olas",summary:"Salsa vasca de aceite, ajo y perejil ligada con la gelatina del pescado y fumet; cl\xE1sica de la merluza y las almejas.",what:"Salsa del Pa\xEDs Vasco que se hace en la misma cazuela que el pescado: ajo en aceite, perejil y [[fumet]] o el jugo de las almejas, ligada por la gelatina que suelta la merluza (sobre todo cogote y kokotxas) con un movimiento de vaiv\xE9n, como el [[pil-pil]]. Muchas casas a\xF1aden una pizca de harina para asegurar la [[ligazones|ligaz\xF3n]]; la versi\xF3n m\xE1s fina se liga solo con la gelatina del pescado.",base:{for:"4 raciones de merluza (unos 300 ml de salsa)",items:[["Aceite de oliva suave","100 ml"],["Ajo picado o en l\xE1minas","4 dientes"],["Harina (opcional)","5-10 g"],["Vino blanco seco (opcional)","50 ml"],["Fumet suave de merluza, caliente","200-250 ml"],["Merluza en rodajas o lomos con piel","4 x 180 g"],["Almejas","12-16"],["Perejil picado","15 g"],["Sal y guindilla (opcional)","al gusto"]],steps:["En cazuela baja, calentar el aceite con el ajo a fuego suave hasta que apenas empiece a dorar.","Si se usa harina, rehogarla un minuto. Mojar con el vino y dejar evaporar.","A\xF1adir el fumet caliente poco a poco moviendo la cazuela.","Cocer la merluza salada a fuego suave 3-4 minutos en vaiv\xE9n; darle la vuelta, a\xF1adir las almejas y seguir hasta que se abran.","Fuera del fuego, el perejil y un \xFAltimo meneo. La salsa debe napar, ligera y brillante."]},ratios:[{use:"Merluza en rodajas o lomos",ratio:"receta base",note:"6-8 minutos en total seg\xFAn grosor"},{use:"Kokotxas en salsa verde",ratio:"sin harina y con la mitad de fumet",note:"la gelatina de las kokotxas liga sola en 4-5 minutos"},{use:"Almejas en salsa verde",ratio:"el jugo de abrirlas, colado, sustituye parte del fumet",note:"m\xE1s vino y algo m\xE1s de harina para que la salsa tenga cuerpo"},{use:"Base adelantada para servicio",ratio:"15-20 g de harina por litro de fumet",note:"permite ligar sin depender de la gelatina de cada raci\xF3n"}],variants:[{id:"pil-pil",name:"Pil-pil",note:"La misma l\xF3gica de ligar con gelatina del pescado, sin perejil ni fumet."},{id:null,name:"Merluza a la koskera",note:"Salsa verde con almejas, esp\xE1rragos blancos, guisantes y huevo cocido."},{id:null,name:"Kokotxas en salsa verde",note:"Ligadas solo con su gelatina."}],keys:["Movimiento de vaiv\xE9n constante en vez de remover con cuchara: liga la salsa y no rompe el pescado.","Fuego suave: si hierve fuerte, la salsa se corta y la merluza se seca.","El perejil siempre al final, para que quede verde y fresco.","Fumet suave, de espinas de pescado blanco; uno de marisco o muy reducido tapa la merluza.","La piel y la espina de la merluza aportan gelatina: no quitarlas antes de cocinar."],errors:[{p:"No liga",fix:"Poca gelatina o demasiado l\xEDquido. Reducir un poco, mover m\xE1s o a\xF1adir una pizca de harina desle\xEDda en fumet fr\xEDo."},{p:"Se corta o queda grasienta",fix:"Exceso de calor o de aceite; retirar del fuego y a\xF1adir un chorrito de fumet fr\xEDo meneando."},{p:"Perejil oscuro y amargo",fix:"Ha cocido demasiado; a\xF1adirlo fuera del fuego al final."}],history:"Es una de las salsas de cazuela de la cocina vasca tradicional, emparentada con el pil-pil por su forma de ligar con la gelatina del pescado. Las versiones con harina son habituales en casas y restaurantes; las ligadas solo con gelatina se consideran m\xE1s finas.",uses:["Merluza","Kokotxas","Almejas","Rape","Bacalao fresco"],keep:"Mejor al momento. Una base sin pescado (aceite, ajo, harina y fumet) aguanta 2-3 d\xEDas en fr\xEDo y se termina en el servicio con el pescado y el perejil. Hecha con el pescado, se consume en el d\xEDa y no se recalienta a fuego fuerte.",pro:"Base ligada preparada en fr\xEDo; al pedido, cazuela individual con la base, el pescado y las almejas, 6-8 minutos. Almejas purgadas en agua con sal antes del servicio.",related:["pil-pil","fumet","ligazones","emulsiones","salsa-vizcaina","roux"]},{id:"pil-pil",name:"Pil-pil",aka:["al pil-pil","bacalao al pil-pil","pilpil"],cat:"salsas",group:"Salsas espa\xF1olas",summary:"Emulsi\xF3n vasca de aceite de oliva y gelatina del bacalao, ligada en tibio con movimiento; sin huevo ni harina.",what:"Salsa que se forma al confitar bacalao desalado en aceite de oliva con ajo y guindilla: la piel suelta gelatina, que se acumula como un jugo blanquecino en el fondo, y al mover la cazuela o batir con un colador ese jugo emulsiona el aceite. Es una [[emulsiones|emulsi\xF3n]] sostenida por las prote\xEDnas y el col\xE1geno del pescado, de la misma familia que la [[salsa-verde]].",base:{for:"4 raciones",items:[["Bacalao desalado, lomos con piel","4 x 200 g"],["Aceite de oliva suave (o mezcla con virgen extra)","400 ml"],["Ajo en l\xE1minas","4-6 dientes"],["Guindilla seca","1"]],steps:["Secar bien el bacalao. Dorar suavemente el ajo y la guindilla en el aceite y retirarlos. Dejar bajar el aceite a 60-70 \xB0C.","Confitar el bacalao con la piel hacia abajo, sin que el aceite borbotee, 5-6 minutos; darle la vuelta y otros 3-4 minutos seg\xFAn grosor. Retirarlo a una bandeja y recoger el jugo que suelte.","Dejar templar el aceite hasta unos 40 \xB0C: en el fondo debe quedar un jugo blanquecino de gelatina.","Montar: mover la cazuela en vaiv\xE9n o trabajar el fondo en c\xEDrculos con un colador de malla, incorporando el aceite al jugo hasta lograr una salsa espesa, amarillenta y brillante.","Devolver el bacalao y su jugo, napar, calentar un minuto sin que hierva y servir con el ajo y la guindilla."]},ratios:[{use:"Bacalao al pil-pil",ratio:"unos 100 ml de aceite por raci\xF3n de 200 g",note:"lomo grueso, con piel"},{use:"Kokotxas al pil-pil",ratio:"unos 60 ml de aceite por raci\xF3n",note:"sueltan mucha gelatina; 4-5 minutos"},{use:"Pil-pil en volumen",ratio:"reservar en fr\xEDo la gelatina de pieles y recortes confitados",note:"se monta en una tanda con t\xFArmix o varillas sobre el aceite tibio"},{use:"Pil-pil para otros pescados",ratio:"reforzar con gelatina de bacalao o de kokotxas",note:"merluza o rape solos sueltan poca"}],variants:[{id:null,name:"Bacalao al Club Ranero",note:"Bacalao al pil-pil con una fritada de pimiento, cebolla y tomate; cl\xE1sico bilba\xEDno."},{id:null,name:"Kokotxas al pil-pil",note:"La versi\xF3n m\xE1s r\xE1pida y de ligaz\xF3n m\xE1s segura."},{id:"salsa-verde",name:"Salsa verde",note:"Misma t\xE9cnica, con perejil y fumet."}],keys:["El aceite tibio, unos 40 \xB0C, para montar: caliente no liga.","Bacalao con piel y con su punto de sal; mal desalado no se puede corregir despu\xE9s.","Aceite suave o mezcla: un virgen extra muy intenso amarga y domina.","El colador acelera la emulsi\xF3n y es lo pr\xE1ctico en servicio; el vaiv\xE9n es lo tradicional.","Confitar por debajo de 70 \xB0C: el bacalao queda en lascas jugosas."],errors:[{p:"No liga",fix:"Aceite caliente o poca gelatina. Dejar templar, a\xF1adir el jugo de la bandeja o gelatina reservada y seguir moviendo."},{p:"Se corta al recalentar",fix:"Exceso de calor; retirar, a\xF1adir una cucharada de agua tibia o gelatina y volver a montar."},{p:"Bacalao seco y deshecho",fix:"Aceite demasiado caliente o tiempo de m\xE1s; controlar con term\xF3metro."}],history:"Es uno de los pilares de la cocina vasca; el nombre se suele explicar por el sonido del aceite al burbujear suavemente. El bacalao en salaz\xF3n lleg\xF3 a toda la pen\xEDnsula por el comercio y la pesca del Atl\xE1ntico norte, en la que participaron marineros vascos, y el pil-pil es una de sus preparaciones m\xE1s caracter\xEDsticas.",uses:["Bacalao","Kokotxas de bacalao o merluza","Merluza","Rape","Patatas confitadas"],keep:"Mejor reci\xE9n hecho. El bacalao confitado y la gelatina se guardan en fr\xEDo 2 d\xEDas. La salsa montada se corta al enfriarse: se vuelve a montar en tibio. El aceite de confitar, colado, se guarda en fr\xEDo unos d\xEDas y sirve para el siguiente pil-pil.",pro:"Confitar los lomos en bandeja al horno a 60-65 \xB0C y montar la salsa en una sola tanda. Mantenerla en ba\xF1o tibio, 45-50 \xB0C, como m\xE1ximo un par de horas; regenerar cada raci\xF3n un minuto a fuego suave.",related:["emulsiones","salsa-verde","salsa-vizcaina","aceites-aromatizados","alioli"]},{id:"mojo-picon",name:"Mojo pic\xF3n",aka:["mojo rojo","mojo colorado"],cat:"salsas",group:"Salsas espa\xF1olas",summary:"Salsa canaria de ajo, pimienta roja seca, comino, piment\xF3n, vinagre y aceite; para papas arrugadas, carnes y pescados.",what:"Mojo rojo de Canarias, majado al mortero: ajo, pimienta roja seca (picona o guindilla), comino, piment\xF3n, sal gruesa, vinagre y aceite de oliva. Queda espeso y ligeramente emulsionado. Cada isla y cada casa tiene su versi\xF3n: m\xE1s o menos picante, con pan para espesar o con pimiento rojo para dar cuerpo y suavizar. Su pareja es el [[mojo-verde]].",base:{for:"unos 300 ml",items:[["Ajo","6 dientes (25 g)"],["Pimienta roja seca picante o guindilla","2-4, al gusto"],["Pimiento rojo seco suave (opcional, para cuerpo)","2"],["Comino en grano","4 g"],["Piment\xF3n dulce","10 g"],["Sal gruesa","5 g"],["Vinagre de vino","50 ml"],["Aceite de oliva","200 ml"],["Pan del d\xEDa anterior (opcional)","20 g"]],steps:["Quitar rabo y pepitas a las pimientas secas e hidratarlas en agua templada 20-30 minutos.","Tostar el comino en sart\xE9n seca un minuto, sin que humee, y majarlo con la sal y los ajos hasta hacer pasta.","A\xF1adir las pimientas escurridas, el pan si se usa y el piment\xF3n, y seguir majando.","Incorporar el vinagre y despu\xE9s el aceite en hilo, removiendo para que espese. Con t\xFArmix, a pulsos cortos para que no blanquee.","Reposar al menos 2 horas; mejor de un d\xEDa para otro."]},ratios:[{use:"Papas arrugadas",ratio:"receta base, espeso",note:"que se agarre a la papa"},{use:"Pescado o carne a la brasa",ratio:"+50 % de aceite y un poco de agua",note:"m\xE1s fluido, para napar"},{use:"Suave, para toda la sala",ratio:"1 pimienta picante y 100 g de pimiento rojo asado",note:"y servir aparte la versi\xF3n picante"},{use:"Como [[adobo]] para cerdo",ratio:"doble de vinagre, con or\xE9gano y tomillo, poco aceite",note:"en Canarias la carne de fiesta se adoba con un ali\xF1o de esta familia; 12-24 horas en fr\xEDo"}],variants:[{id:"mojo-verde",name:"Mojo verde",note:"Con pimiento verde y cilantro o perejil."},{id:null,name:"Mojo palmero",note:"En La Palma suele hacerse m\xE1s picante y potente; variedad de pimienta y proporciones cambian seg\xFAn la casa."},{id:null,name:"Almogrote",note:"Pasta gomera de queso curado, pimienta, ajo y aceite; de la misma familia, no es un mojo."}],keys:["Comino en grano y tostado al momento; el molido viejo no sabe a nada.","El piment\xF3n nunca al fuego: se quema en segundos y amarga.","El picor se regula con las semillas y con la cantidad de pimienta, no con m\xE1s aceite.","El mortero da mejor textura; el t\xFArmix emulsiona de m\xE1s y lo vuelve p\xE1lido.","Vinagre de vino suave: el mojo debe saber a ajo y pimienta, no a vinagre."],errors:[{p:"Amargo",fix:"Comino o piment\xF3n quemados, o pepitas de pimienta. Tostar con cuidado y limpiar bien."},{p:"Se separa el aceite",fix:"Es normal en parte; remover antes de servir o a\xF1adir un poco de pan majado para ligarlo."},{p:"Pica demasiado",fix:"Rebajar con pimiento rojo asado y pan majado; no con m\xE1s aceite, que lo vuelve grasiento."}],history:"Los mojos forman parte de la cocina popular canaria y hay variantes en cada isla. Se suelen relacionar con las salsas de ajo y aceite peninsulares y con el uso de pimientos y especias llegados por el comercio atl\xE1ntico, pero no hay una historia documentada \xFAnica ni una receta oficial.",uses:["Papas arrugadas","Carnes a la brasa","Pescado a la brasa o a la sal","Queso asado","Adobo de cerdo"],keep:"En fr\xEDo, tapado, 5-7 d\xEDas; mejora el segundo d\xEDa. Con ajo crudo en aceite, siempre en fr\xEDo. Remover y atemperar antes de servir.",pro:"Lotes de 1-2 litros. Tener la versi\xF3n suave para sala y la picante aparte. En el pase, cuencos peque\xF1os o biber\xF3n de boca ancha; sacar solo lo del servicio y no devolver a c\xE1mara lo que haya estado en mesa.",related:["mojo-verde","adobo","alioli","romesco","chimichurri","marinada"]},{id:"mojo-verde",name:"Mojo verde",aka:["mojo de cilantro","mojo de perejil"],cat:"salsas",group:"Salsas espa\xF1olas",summary:"Mojo canario de ajo, pimiento verde, cilantro o perejil, comino, vinagre y aceite; para pescados y papas.",what:"Variante verde del [[mojo-picon]]: lleva pimiento verde en lugar de la pimienta roja seca y una hierba fresca, normalmente cilantro, perejil o ambas. Es m\xE1s fresco y herb\xE1ceo, y en Canarias acompa\xF1a sobre todo al pescado y a las papas arrugadas. Como todo lo verde, su problema es el color: se oxida con el \xE1cido y con el calor.",base:{for:"unos 300 ml",items:[["Ajo","4 dientes"],["Pimiento verde italiano","1 (100 g)"],["Pimienta verde picante (opcional)","1"],["Cilantro, hojas y tallos tiernos","30 g"],["Perejil (opcional)","10 g"],["Comino en grano","3 g"],["Sal gruesa","5 g"],["Vinagre de vino blanco","40 ml"],["Aceite de oliva","180 ml"]],steps:["Tostar el comino un minuto en sart\xE9n seca y majarlo con la sal y el ajo hasta pasta.","A\xF1adir el pimiento sin semillas, picado y bien escurrido, y majar.","Incorporar las hierbas secas y lavadas y majar poco, lo justo para romperlas.","A\xF1adir el aceite en hilo y por \xFAltimo el vinagre. Con t\xFArmix, vaso fr\xEDo, pulsos cortos y el aceite fr\xEDo para no calentar las hierbas.","Reposar 30 minutos y probar de sal y vinagre."]},ratios:[{use:"Pescado a la brasa o a la sal",ratio:"+50 % de cilantro, m\xE1s fluido",note:"se pone al salir del fuego"},{use:"Papas arrugadas",ratio:"receta base, espeso",note:"que se agarre a la papa"},{use:"Para quien no tolera el cilantro",ratio:"todo perejil, mismo peso",note:"menos aroma, m\xE1s color"},{use:"Producci\xF3n adelantada",ratio:"hacer la base sin vinagre",note:"el vinagre se a\xF1ade al pase; as\xED aguanta el color"}],variants:[{id:"mojo-picon",name:"Mojo pic\xF3n",note:"El rojo, con pimienta seca y piment\xF3n."},{id:null,name:"Mojo de cilantro",note:"Solo cilantro: el m\xE1s arom\xE1tico, el cl\xE1sico para pescado."},{id:null,name:"Mojo de perejil",note:"Solo perejil: m\xE1s suave."},{id:"chimichurri",name:"Chimichurri",note:"Primo rioplatense de hierbas, ajo y vinagre para la carne."}],keys:["Hierbas bien secas tras lavarlas; el agua apaga el sabor y acelera la oxidaci\xF3n.","El calor oscurece: t\xFArmix a pulsos con vaso y aceite fr\xEDos, o mejor al mortero.","El vinagre oxida el verde con las horas; a\xF1adirlo al final o al servir.","El tallo tierno del cilantro tiene mucho sabor: aprovecharlo.","Pimiento escurrido; si suelta agua, el mojo se separa."],errors:[{p:"Se pone marr\xF3n",fix:"\xC1cido o calor. Hacerlo al d\xEDa, a\xF1adir el vinagre al servir y conservar con pel\xEDcula de aceite en contacto."},{p:"Amargo",fix:"Hierbas trituradas demasiado tiempo o tallos duros; romperlas poco y usar solo tallos tiernos."},{p:"Aguado o separado",fix:"Pimiento o hierbas con agua; escurrir bien y ligar con un poco m\xE1s de ajo majado."}],history:"Es el compa\xF1ero verde del mojo rojo en la cocina popular canaria, con variantes en cada isla. Como el resto de mojos, no tiene una receta fija ni una historia documentada \xFAnica; lo que s\xED es constante es el uso de cilantro o perejil, ajo, comino y vinagre.",uses:["Pescado a la brasa o a la sal","Papas arrugadas","Queso asado","Verduras a la brasa","Marisco a la plancha"],keep:"2-3 d\xEDas en fr\xEDo, tapado con aceite en contacto; pierde color cada d\xEDa. Base sin vinagre algo m\xE1s. Con ajo crudo en aceite, siempre en fr\xEDo.",pro:"Hacer al inicio de cada servicio la cantidad del d\xEDa; tener la base majada sin vinagre y terminar en el pase. En cuenco peque\xF1o o biber\xF3n de boca ancha; reponer, no rellenar sobre lo que lleva horas fuera.",related:["mojo-picon","chimichurri","pesto","salsa-verde","vinagreta","adobo"]},{id:"salsa-vizcaina",name:"Salsa vizca\xEDna",aka:["a la vizca\xEDna","bacalao a la vizca\xEDna"],cat:"salsas",group:"Salsas espa\xF1olas",summary:"Salsa vasca de cebolla roja pochada lentamente y carne de pimiento choricero; para bacalao, callos y otros guisos.",what:"Salsa de Bizkaia hecha con mucha cebolla, tradicionalmente roja, pochada a fuego muy lento, y la carne del pimiento choricero, pasada por el pasapur\xE9s. La receta tradicional no lleva tomate o lleva muy poco; muchas versiones modernas lo a\xF1aden y la acercan a una [[salsa-de-tomate]] con choricero, algo que en Bizkaia se discute. Su color y su dulzor vienen de la cebolla y del choricero, no del tomate.",base:{for:"1 litro",items:[["Cebolla roja","1,5 kg"],["Pimientos choriceros secos","10-12"],["Ajo","4 dientes"],["Aceite de oliva","150 ml"],["Pan del d\xEDa anterior (opcional, para ligar)","30 g"],["Fumet o caldo de la cocci\xF3n, o agua de los choriceros","300-500 ml"],["Sal y guindilla (opcional)","al gusto"]],steps:["Quitar rabo y pepitas a los choriceros e hidratarlos en agua caliente una hora (o cocerlos 10 minutos). Raspar la carne con una cuchara.","Pochar la cebolla en juliana con el ajo y el aceite a fuego muy suave, tapada al principio, 1,5-2 horas, hasta que est\xE9 muy blanda y dorada sin quemar.","A\xF1adir la carne de choricero y el pan, mojar con el fondo o con el agua de los choriceros colada y cocer 15-20 minutos.","Pasar por el pasapur\xE9s o triturar y colar. Ajustar la textura con fondo y la sal."]},ratios:[{use:"Bacalao a la vizca\xEDna",ratio:"mojar con [[fumet]] o agua de cocer las pieles",note:"espesa, que nape; el bacalao se termina 8-10 minutos en ella"},{use:"Callos o guisos de carne",ratio:"mojar con [[fondo-oscuro]] o el caldo de la cocci\xF3n",note:"m\xE1s l\xEDquida, para cocer dentro"},{use:"Base para otros platos (huevos, pimientos rellenos, merluza)",ratio:"receta base",note:"se aclara con el fondo del plato"},{use:"Versi\xF3n con tomate",ratio:"1 tomate maduro por cada 500 g de cebolla",note:"m\xE1s \xE1cida y roja; no es la tradicional"}],variants:[{id:null,name:"Bacalao a la vizca\xEDna",note:"El plato que la hizo famosa."},{id:null,name:"Vizca\xEDna con tomate",note:"Versi\xF3n extendida fuera de Bizkaia."},{id:"sofrito",name:"Sofrito",note:"Familia de bases de hortalizas pochadas en aceite."},{id:"salsa-de-tomate",name:"Salsa de tomate",note:"Pariente cercana, pero no es lo mismo."}],keys:["Cebolla roja y pochado largo: es la mitad de la salsa.","La carne del choricero, raspada, sin piel: la piel amarga y da hebras.","Pasapur\xE9s antes que t\xFArmix: textura sedosa sin airear ni blanquear.","Choriceros de calidad, oscuros y flexibles; los muy secos y rotos dan poco sabor.","Se mejora de un d\xEDa para otro."],errors:[{p:"Amarga",fix:"Piel de choricero o cebolla quemada en el fondo. Raspar bien y pochar tapado y a fuego m\xEDnimo."},{p:"Demasiado dulce",fix:"Equilibrar con sal, un punto de guindilla o un poco de fondo; no con az\xFAcar ni vinagre."},{p:"Color p\xE1lido",fix:"Poco choricero o cebolla poco pochada; a\xF1adir m\xE1s carne de choricero."}],history:"Es la salsa tradicional de Bizkaia unida al bacalao en salaz\xF3n. Sobre su origen circulan historias locales, pero lo que comparten las recetas antiguas es la cebolla y el pimiento choricero como protagonistas. El tomate se fue incorporando con el tiempo en muchas cocinas.",uses:["Bacalao","Callos","Merluza y pescados blancos","Huevos","Pimientos rellenos"],keep:"En fr\xEDo 5 d\xEDas; congela muy bien en bolsas o cubetas porcionadas. Regenerar a fuego suave con un poco de fondo.",pro:"Pochar en marmita o en horno a 140-150 \xB0C tapado para no estar pendiente; producir 5-10 litros de una vez y congelar en porciones. En el pase, en ba\xF1o mar\xEDa a 65 \xB0C o m\xE1s, removiendo, o regenerar por raciones.",related:["sofrito","pil-pil","salsa-verde","salsa-de-tomate","fumet","romesco"]},{id:"sofrito",name:"Sofrito",aka:["sofregit","sofrito de tomate"],cat:"bases",group:"Bases y ali\xF1os",summary:"Base de cebolla, ajo y tomate (a veces pimiento) cocinados lentamente en aceite; punto de partida de arroces, guisos y salsas.",what:"Fondo de sabor de la cocina mediterr\xE1nea: hortalizas arom\xE1ticas, casi siempre cebolla, ajo y tomate, cocinadas en aceite de oliva hasta concentrar y caramelizar. En los arroces de la costa se lleva m\xE1s oscuro y concentrado; en guisos, m\xE1s claro. Cumple un papel parecido a la [[mirepoix]] francesa, pero en aceite y llevado mucho m\xE1s lejos. Al principio de un guiso va el sofrito y al final, a menudo, la [[picada]].",base:{for:"unos 500 g de sofrito",items:[["Cebolla","600 g"],["Tomate maduro rallado","800 g"],["Ajo","4 dientes"],["Pimiento rojo o verde (opcional)","150 g"],["Aceite de oliva","150 ml"],["Sal","5 g"],["Az\xFAcar, solo si el tomate es \xE1cido","una pizca"],["Laurel o piment\xF3n (opcional)","al gusto"]],steps:["Pochar la cebolla picada fina con el aceite y la sal a fuego medio-bajo, 25-30 minutos, hasta que est\xE9 blanda y dorada.","A\xF1adir el ajo y el pimiento y seguir 5-10 minutos.","Incorporar el tomate rallado y cocinar a fuego suave 40-60 minutos, removiendo, hasta que pierda el agua y el aceite se separe por los bordes.","Para arroces de costa, seguir hasta color caoba oscuro; el sofregit catal\xE1n de cebolla puede llevar 1-2 horas.","Si lleva piment\xF3n, a\xF1adirlo al final, fuera del fuego, y mojar enseguida."]},ratios:[{use:"Arroces y fideu\xE1",ratio:"muy reducido, color caoba",note:"piment\xF3n al final unos segundos y mojar con el [[fumet]] o el caldo"},{use:"Guisos de carne o legumbre",ratio:"cebolla y tomate a partes iguales, color dorado",note:"m\xE1s suave"},{use:"Salsas de tomate",ratio:"1 parte de cebolla por 3 de tomate",note:"ver [[salsa-de-tomate]]"},{use:"Sofregit catal\xE1n",ratio:"solo cebolla y tomate, 2:1, cocci\xF3n 1-2 horas",note:"casi una mermelada oscura"},{use:"Suquet y guisos de pescado",ratio:"sofrito corto, claro, con ajo y algo de tomate",note:"el pescado manda"}],variants:[{id:null,name:"Sofregit",note:"Versi\xF3n catalana, larga y oscura."},{id:"salsa-vizcaina",name:"Salsa vizca\xEDna",note:"Cebolla roja pochada con choricero."},{id:"mirepoix",name:"Mirepoix",note:"Equivalente franc\xE9s de hortalizas arom\xE1ticas."},{id:null,name:"Soffritto italiano",note:"Cebolla, zanahoria y apio en aceite o mantequilla; base de rag\xFAs."}],keys:["Paciencia: el sabor viene de la caramelizaci\xF3n lenta, no del fuego fuerte.","Sal en la cebolla desde el principio: suelta agua y se pocha sin quemarse.","Tomate maduro rallado, sin piel; fuera de temporada, tomate triturado de buena calidad.","El aceite que se separa por los bordes indica que el tomate ha perdido el agua.","El piment\xF3n se quema en segundos: fuera del fuego y mojar enseguida."],errors:[{p:"Quemado o amargo",fix:"Fuego alto o fondo pegado. No tiene arreglo: empezar de nuevo y bajar el fuego o pasar al horno."},{p:"\xC1cido",fix:"Tomate poco maduro o poco cocinado; cocinar m\xE1s y, si hace falta, una pizca de az\xFAcar."},{p:"Aguado",fix:"Falta reducci\xF3n; seguir hasta que se separe el aceite."}],history:"Cocinar hortalizas arom\xE1ticas en grasa como base es una t\xE9cnica com\xFAn a muchas cocinas. El tomate entr\xF3 en la cocina espa\xF1ola despu\xE9s de su llegada de Am\xE9rica y con el tiempo se convirti\xF3 en el centro del sofrito mediterr\xE1neo. Las versiones cambian de una regi\xF3n a otra y de una casa a otra.",uses:["Arroces y fideu\xE1","Guisos de carne, pescado y legumbre","Salsas","Suquet","Rellenos"],keep:"En fr\xEDo 5-7 d\xEDas cubierto con una capa de aceite. Congela perfectamente en porciones; se puede usar directamente congelado en el guiso.",pro:"Lotes de 5-10 kg en marmita o en horno a 150-160 \xB0C, tapado al principio y destapado al final, removiendo cada 20 minutos. Porcionar en bolsas por receta (por ejemplo, la cantidad de una paella) y congelar. Etiquetar con el tipo: sofrito de arroz y sofrito de guiso no son intercambiables.",related:["picada","salsa-de-tomate","mirepoix","salsa-vizcaina","romesco","fumet"]},{id:"picada",name:"Picada",aka:["picada catalana","majado"],cat:"bases",group:"Bases y ali\xF1os",summary:"Majado catal\xE1n de frutos secos, ajo, perejil y pan frito que se a\xF1ade al final de los guisos para ligar y dar sabor.",what:"Majado que se incorpora en los \xFAltimos minutos de un guiso: almendra o avellana tostadas, ajo, perejil, pan frito y, seg\xFAn el plato, azafr\xE1n, chocolate, galleta o h\xEDgado de la propia pieza. Liga y espesa el caldo, como una [[ligazones|ligaz\xF3n]], y le da un sabor final. Con el [[sofrito]] al principio y la picada al final se define buena parte de la cocina catalana.",base:{for:"un guiso de 4-6 raciones (unos 80 g)",items:[["Almendra tostada","20 g"],["Avellana tostada y pelada","20 g"],["Pan frito en aceite","15 g"],["Ajo","2 dientes"],["Perejil","5 g"],["Azafr\xE1n (opcional)","unas hebras"],["Caldo del propio guiso","30-50 ml"],["Sal gruesa","una pizca"]],steps:["Tostar almendras y avellanas a 160-170 \xB0C, 10-12 minutos, y pelar las avellanas frot\xE1ndolas en un pa\xF1o.","Fre\xEDr el pan en aceite hasta dorar y escurrir.","Majar el ajo con la sal; a\xF1adir los frutos secos, el pan, el perejil y el azafr\xE1n tostado, y majar hasta pasta con algo de grano.","Aflojar con caldo del propio guiso.","A\xF1adir al guiso 5-10 minutos antes del final y dejar hervir suave para que espese y el ajo pierda el crudo."]},ratios:[{use:"Suquet y guisos de pescado",ratio:"almendra, pan, ajo, perejil y azafr\xE1n",note:"ligera, el pescado manda"},{use:"Caza y carnes guisadas",ratio:"a\xF1adir 10-15 g de chocolate negro por guiso y, si se quiere, galleta o el h\xEDgado de la pieza",note:"m\xE1s oscura y potente"},{use:"Arroces caldosos y fideos",ratio:"sin pan, solo frutos secos, ajo y perejil",note:"para no empastar el caldo"},{use:"Para espesar m\xE1s un guiso",ratio:"doblar el pan",note:"sin pasarse: el guiso se vuelve pastoso"}],variants:[{id:"romesco",name:"Romesco",note:"Salsa de la misma familia, con \xF1ora y tomate."},{id:null,name:"Picada de chocolate",note:"Para caza, conejo o langosta con pollo."},{id:null,name:"Picada de h\xEDgado",note:"Con el h\xEDgado salteado de la propia ave o conejo."},{id:"pesto",name:"Pesto",note:"Majado italiano de l\xF3gica parecida, pero en crudo y como salsa."}],keys:["Va al final: si cuece mucho, el perejil se apaga y los frutos secos pierden aroma.","Nunca en crudo en el plato: necesita unos minutos de hervor para perder el sabor del ajo.","Mortero mejor que robot: textura con grano y sin calentar.","Frutos secos bien tostados, sin quemar: son el sabor principal.","Ajustar la sal del guiso despu\xE9s de a\xF1adir la picada."],errors:[{p:"Guiso espeso y pastoso",fix:"Demasiado pan o picada; aflojar con caldo y usar menos la pr\xF3xima vez."},{p:"Sabor a ajo crudo",fix:"No ha hervido lo suficiente; 5 minutos m\xE1s a fuego suave."},{p:"Amarga",fix:"Frutos secos o pan quemados, o azafr\xE1n tostado de m\xE1s."}],history:"Majar frutos secos con pan para ligar guisos es una t\xE9cnica muy antigua del Mediterr\xE1neo y est\xE1 en la base de la cocina catalana desde hace siglos. Las variantes con chocolate o galleta son propias de guisos de caza y de los platos de mar y monta\xF1a.",uses:["Suquet","Guisos de caza y conejo","Mar y monta\xF1a","Arroces caldosos","Guisos de legumbre"],keep:"Mejor al momento: el perejil y el ajo se oxidan. La base de frutos secos y pan majados, sin ajo ni perejil, aguanta 3-4 d\xEDas en fr\xEDo o se congela en porciones.",pro:"Tener la base de frutos secos y pan majada en robot para el d\xEDa y a\xF1adir ajo y perejil al momento por guiso. Porcionar seg\xFAn la receta para que todas las raciones liguen igual.",related:["sofrito","romesco","ligazones","pesto","salsa-verde","fumet"]},{id:"chimichurri",name:"Chimichurri",aka:["chimichurri argentino","chimi"],cat:"salsas",group:"Salsas del mundo",summary:"Ali\xF1o rioplatense de perejil, or\xE9gano, ajo, guindilla, vinagre y aceite; la salsa de la carne a la brasa.",what:"Salsa-ali\xF1o de Argentina y Uruguay para el asado: perejil y or\xE9gano, ajo, aj\xED molido (guindilla en escamas), vinagre, aceite y sal; a veces piment\xF3n, cebolla o pimiento. Hay una versi\xF3n de hierbas secas, que se hidrata con [[salmuera]] caliente y dura m\xE1s, y otra fresca, m\xE1s verde y viva. Es una [[vinagreta]] cargada de hierbas, no una emulsi\xF3n: el aceite queda suelto por encima.",base:{for:"unos 400 ml (versi\xF3n fresca)",items:[["Perejil picado a cuchillo","40 g"],["Or\xE9gano seco (o fresco 10 g)","5 g"],["Ajo muy picado","4 dientes"],["Guindilla en escamas","3 g"],["Piment\xF3n dulce (opcional)","3 g"],["Vinagre de vino tinto","80 ml"],["Agua caliente","40 ml"],["Sal","6 g"],["Aceite de girasol u oliva suave","200 ml"]],steps:["Disolver la sal en el agua caliente y el vinagre e hidratar en ella el or\xE9gano, la guindilla y el piment\xF3n 10 minutos.","Picar el perejil a cuchillo, no con t\xFArmix, y el ajo muy fino.","Mezclar todo y cubrir con el aceite.","Reposar al menos una hora a temperatura ambiente antes del servicio; la versi\xF3n seca, mejor de v\xEDspera en fr\xEDo."]},ratios:[{use:"Para servir con carne a la brasa",ratio:"receta base",note:"sobre la carne reci\xE9n cortada"},{use:"Para adobar antes de la brasa",ratio:"la mitad de aceite y el doble de ajo y vinagre",note:"2-12 horas en fr\xEDo; ver [[adobo]] y [[marinada]]"},{use:"Para pincelar durante la brasa",ratio:"salmuera de agua, sal, ajo y hierbas, sin aceite",note:"no provoca llamaradas en las brasas"},{use:"Pescado o verduras a la brasa",ratio:"mitad vinagre, mitad lim\xF3n, el doble de perejil",note:"m\xE1s fresco"}],variants:[{id:null,name:"Chimichurri seco",note:"Con hierbas secas hidratadas en salmuera caliente; dura m\xE1s y se puede tener en lote."},{id:null,name:"Chimichurri rojo",note:"Con m\xE1s piment\xF3n y pimiento rojo."},{id:"mojo-verde",name:"Mojo verde",note:"Pariente canario con cilantro y comino."},{id:"vinagreta",name:"Vinagreta",note:"La base de su l\xF3gica."}],keys:["Picar a cuchillo: con t\xFArmix el perejil se oscurece y amarga y la salsa se vuelve un pur\xE9.","Aceite neutro o de oliva suave; un virgen extra intenso tapa las hierbas.","La salmuera caliente despierta las hierbas secas y la guindilla.","Reposo: reci\xE9n hecho sabe a ajo y vinagre por separado.","Se sirve sobre la carne ya cortada, no sobre la pieza entera, para que no arrastre la costra."],errors:[{p:"Oscuro y amargo",fix:"Hierbas trituradas a m\xE1quina o picadas de v\xEDspera; picar a cuchillo y el perejil fresco del d\xEDa."},{p:"Demasiado \xE1cido",fix:"M\xE1s aceite y perejil; o rebajar el vinagre con agua."},{p:"Ajo agresivo",fix:"Escaldar los ajos un momento o dejarlo reposar m\xE1s."}],history:"Es la salsa del asado en el R\xEDo de la Plata. Sobre el origen del nombre circulan varias historias y ninguna est\xE1 demostrada. Lo que existe es una salsa popular con casi tantas recetas como parrillas.",uses:["Carnes a la brasa","Achuras y embutidos a la parrilla","Pescado y verduras a la brasa","Adobo previo","Pan a la brasa"],keep:"Versi\xF3n seca, en fr\xEDo y tapada, 1-2 semanas. Versi\xF3n fresca, 3-4 d\xEDas; pierde color. Con ajo crudo en aceite, siempre en fr\xEDo; servir atemperado.",pro:"En un restaurante de brasa compensa tener la base seca en lote y a\xF1adir perejil fresco a diario. Sacar del fr\xEDo 30 minutos antes; durante el servicio, reponer en cantidades peque\xF1as en vez de dejar el bote fuera de fr\xEDo todo el turno.",related:["vinagreta","mojo-verde","adobo","salmuera","marinada","jugo-de-carne"]},{id:"pesto",name:"Pesto",aka:["pesto genov\xE9s","pesto alla genovese","salsa de albahaca"],cat:"salsas",group:"Salsas del mundo",summary:"Majado genov\xE9s de albahaca, ajo, pi\xF1ones, queso curado y aceite de oliva; para pasta, verduras y pescados.",what:"Salsa cruda de Liguria hecha al mortero con hojas de albahaca, ajo, sal gruesa, pi\xF1ones, queso parmesano y pecorino rallados y aceite de oliva suave. No se cocina: se ali\xF1a con ella, como mucho aflojada con agua de cocci\xF3n de la pasta. Comparte con la [[picada]] y el [[mojo-verde]] la t\xE9cnica del majado, y con todas las salsas verdes el mismo enemigo: el calor y la oxidaci\xF3n.",base:{for:"unos 300 g",items:[["Albahaca, solo hojas","60 g"],["Ajo","1-2 dientes"],["Pi\xF1ones","25 g"],["Parmesano curado rallado","50 g"],["Pecorino rallado","20 g"],["Aceite de oliva virgen extra suave","120-150 ml"],["Sal gruesa","2-3 g"]],steps:["Lavar la albahaca sin frotar y secarla muy bien.","Majar el ajo con la sal; a\xF1adir los pi\xF1ones (crudos o apenas tostados) y majar hasta crema.","A\xF1adir las hojas por tandas, trabajando en c\xEDrculos contra las paredes del mortero, sin golpear, hasta que se deshagan.","Incorporar los quesos y despu\xE9s el aceite en hilo.","Con robot: vaso y cuchilla fr\xEDos, aceite fr\xEDo y pulsos cortos. Para que no oscurezca en producci\xF3n, blanquear las hojas 5-10 segundos y enfriar en agua con hielo (no es la versi\xF3n tradicional)."]},ratios:[{use:"Pasta",ratio:"25-30 g por raci\xF3n",note:"aflojado con agua de cocci\xF3n, fuera del fuego"},{use:"Pescado o verduras a la brasa",ratio:"+50 % de aceite, la mitad de queso",note:"m\xE1s fluido, para pincelar al salir"},{use:"Sopas de verduras",ratio:"sin pi\xF1ones, una cucharada por plato",note:"se a\xF1ade al servir, no se cuece"},{use:"Untar o aperitivo",ratio:"m\xE1s pi\xF1ones y queso, menos aceite",note:"m\xE1s denso"}],variants:[{id:null,name:"Pistou",note:"Versi\xF3n provenzal, sin pi\xF1ones y a menudo sin queso; para la sopa del mismo nombre."},{id:null,name:"Pesto alla trapanese",note:"Siciliano, con almendra y tomate adem\xE1s de la albahaca."},{id:null,name:"Pestos de otras hierbas o frutos secos",note:"R\xFAcula, perejil, pistacho o nuez; misma l\xF3gica."},{id:"aceites-aromatizados",name:"Aceite de albahaca",note:"Para dar el aroma sin la textura."}],keys:["El calor es el enemigo: mortero o m\xE1quina fr\xEDa, y nunca cocerlo.","Hojas secas: el agua lo aclara y lo oscurece.","Aceite suave; uno intenso batido a m\xE1quina amarga.","Pi\xF1ones de calidad y frescos; rancios arruinan la salsa.","Con pasta, el queso no debe fundirse a fuego: se mezcla fuera del fuego con agua de cocci\xF3n."],errors:[{p:"Se oscurece",fix:"Calor u oxidaci\xF3n. Pel\xEDcula de aceite en contacto, m\xE1quina fr\xEDa o hojas blanqueadas."},{p:"Amargo",fix:"Aceite intenso batido, tallos o hojas machacadas a golpes. Usar solo hojas y trabajar en c\xEDrculo."},{p:"Aguado o separado",fix:"Hojas mojadas; secar bien y ligar con un poco m\xE1s de queso y pi\xF1\xF3n."}],history:"Es la salsa tradicional de G\xE9nova y Liguria. Las majadas de hierbas, ajo, queso y aceite son antiguas en el Mediterr\xE1neo; la versi\xF3n con albahaca y pi\xF1ones es la que se fij\xF3 en la cocina ligur y se extendi\xF3 con la popularidad de la pasta italiana.",uses:["Pasta","Verduras a la brasa","Pescado blanco","Sopas de verduras","Burrata y tomate"],keep:"En fr\xEDo 3-5 d\xEDas, cubierto con una capa de aceite. Congela bien sin queso: se a\xF1ade al descongelar.",pro:"Producir la base sin queso en robot fr\xEDo y congelar en porciones; a\xF1adir el queso al terminar. En el pase, en cubeta peque\xF1a con pel\xEDcula de aceite. Para pincelar pescado a la brasa, aclarar con aceite al momento.",related:["picada","mojo-verde","chimichurri","aceites-aromatizados","alioli"]},{id:"salsa-brava",name:"Salsa brava",aka:["salsa de bravas","salsa para patatas bravas"],cat:"salsas",group:"Salsas espa\xF1olas",summary:"Salsa picante de las patatas bravas: de piment\xF3n y caldo ligada con harina, o de tomate seg\xFAn la zona.",what:"Salsa picante de bar muy asociada a Madrid. No hay receta \xFAnica: la madrile\xF1a cl\xE1sica se hace con aceite, piment\xF3n dulce y picante, harina para ligar y caldo, sin tomate; en otras zonas lleva tomate y guindilla. En Catalu\xF1a y Valencia es habitual servir las bravas con [[alioli]] adem\xE1s de la salsa picante. T\xE9cnicamente, la versi\xF3n de piment\xF3n es un [[roux]] rojo mojado con caldo.",base:{for:"unos 500 ml",items:[["Aceite de oliva","60 ml"],["Cebolla (opcional)","100 g"],["Ajo","2 dientes"],["Harina","25 g"],["Piment\xF3n dulce","15 g"],["Piment\xF3n picante","5-10 g"],["Guindilla o cayena (opcional)","1-2"],["Caldo de pollo o fondo blanco, caliente","500 ml"],["Vinagre de Jerez","10 ml"],["Sal","al gusto"]],steps:["Pochar la cebolla y el ajo en el aceite a fuego suave 10 minutos.","A\xF1adir la harina y rehogar 2 minutos sin que tome color.","Fuera del fuego, a\xF1adir los pimentones y remover 20-30 segundos.","Mojar con el caldo caliente batiendo para evitar grumos y cocer a fuego suave 10-15 minutos.","Triturar y colar. Ajustar con vinagre y sal; textura de napar."]},ratios:[{use:"Patatas bravas de bar",ratio:"receta base",note:"que nape la patata sin empaparla"},{use:"Brava de tomate",ratio:"sustituir la mitad del caldo por [[salsa-de-tomate]]",note:"m\xE1s roja y algo \xE1cida"},{use:"Para biber\xF3n o puntos en el plato",ratio:"15 g de harina por 500 ml",note:"m\xE1s fluida"},{use:"M\xE1s picante sin m\xE1s harina",ratio:"terminar con [[aceites-aromatizados|aceite de guindilla]]",note:"el picor se ajusta al final"}],variants:[{id:null,name:"Brava de tomate",note:"Con tomate y guindilla; habitual fuera de Madrid."},{id:null,name:"Bravas mixtas",note:"Con brava y alioli; t\xEDpicas de Catalu\xF1a y Valencia."},{id:"alioli",name:"Alioli",note:"Su pareja en muchas barras."},{id:"salsa-de-tomate",name:"Salsa de tomate",note:"Base de la versi\xF3n de tomate."}],keys:["El piment\xF3n fuera del fuego: quemado amarga sin remedio.","La calidad del piment\xF3n es la salsa; un poco de piment\xF3n ahumado le da car\xE1cter.","Patata frita en dos tiempos: confitada a 130-140 \xB0C y terminada a 180 \xB0C justo antes de servir.","Salsa templada sobre patata reci\xE9n frita y en el \xFAltimo momento, para que no se ablande.","Ajustar el picante en dos niveles: suave para la sala y aceite picante aparte."],errors:[{p:"Amarga",fix:"Piment\xF3n quemado; no tiene arreglo, empezar de nuevo."},{p:"Grumos",fix:"Caldo fr\xEDo o vertido de golpe; triturar y colar."},{p:"Sabe a harina",fix:"Harina poco rehogada o salsa poco cocida; cocer 5 minutos m\xE1s."},{p:"Demasiado espesa al enfriar",fix:"Aclarar con caldo caliente al regenerar."}],history:"Se asocia a los bares de Madrid, donde las patatas bravas se convirtieron en tapa cl\xE1sica a lo largo del siglo XX. Varios locales reclaman su invenci\xF3n y no hay una versi\xF3n probada. Fuera de Madrid cada zona la ha adaptado a su manera.",uses:["Patatas bravas","Huevos","Calamares y fritos","Torreznos","Croquetas"],keep:"En fr\xEDo 5 d\xEDas; congela bien. Regenerar a fuego suave aclarando con caldo.",pro:"Hacer en lotes de 2-3 litros. En el pase, en ba\xF1o mar\xEDa a 65 \xB0C o m\xE1s y en biber\xF3n templado, removiendo de vez en cuando. Patata confitada en bandejas en fr\xEDo y terminada al pedido.",related:["roux","alioli","salsa-de-tomate","fondo-blanco","aceites-aromatizados","mayonesa"]},{id:"escabeche",name:"Escabeche",aka:["escabechado","en escabeche"],cat:"bases",group:"Bases y ali\xF1os",summary:"Preparaci\xF3n de aceite, vinagre, arom\xE1ticos y especias en la que se cocina o se cubre un producto para darle sabor y alargar su vida.",what:"T\xE9cnica y salsa a la vez: el producto (pescado azul, caza, aves, setas, verduras) se fr\xEDe o se marca y se cubre con un l\xEDquido caliente de aceite, vinagre, vino o agua, ajo, laurel, pimienta, piment\xF3n y otras especias. El \xE1cido y el reposo lo aromatizan y le dan textura firme. Hoy se hace sobre todo por sabor: la conservaci\xF3n depende siempre del fr\xEDo. Est\xE1 a medio camino entre la [[marinada]] y una [[vinagreta]] caliente.",base:{for:"1 litro de escabeche (para 1-1,5 kg de producto)",items:[["Aceite de oliva","400 ml"],["Vinagre de vino","200-250 ml"],["Vino blanco","150 ml"],["Agua o fondo","200 ml"],["Ajo","1 cabeza en dientes"],["Cebolla en juliana","1 (200 g)"],["Zanahoria en rodajas","1 (100 g)"],["Laurel","3 hojas"],["Pimienta negra en grano","10 granos"],["Tomillo","2 ramas"],["Piment\xF3n dulce (opcional)","5 g"],["Sal","10-12 g"]],steps:["Marcar o fre\xEDr el producto sin terminar de cocinarlo (el pescado, enharinado; la carne y las aves, doradas) y reservar.","En el aceite, confitar ajos, cebolla y zanahoria a fuego suave 10-15 minutos; a\xF1adir laurel, pimienta y tomillo.","Fuera del fuego, el piment\xF3n; mojar enseguida con el vinagre, el vino y el agua, salar y hervir 5 minutos.","Pescado azul: verter el escabeche caliente sobre el pescado o darle 2-3 minutos dentro. Caza y aves: terminar la cocci\xF3n dentro del escabeche a fuego suave hasta que est\xE9n tiernas.","Enfriar r\xE1pido y reposar en fr\xEDo al menos 24 horas antes de servir."]},ratios:[{use:"Pescado azul (caballa, sardina, bonito)",ratio:"aceite y vinagre 2:1",note:"verter caliente sobre el pescado marcado; si cuece dentro, se reseca"},{use:"Caza y aves (perdiz, codorniz, conejo)",ratio:"aceite y vinagre 1,5:1, con vino y [[fondo-blanco]]",note:"cocci\xF3n dentro del escabeche"},{use:"Verduras y setas",ratio:"3:1 con agua",note:"m\xE1s suave para no tapar el producto"},{use:"Escabeche ligero de servicio",ratio:"3:1 con [[fumet]], templado",note:"como salsa para pescado de la brasa; m\xE1s cerca de una vinagreta"}],variants:[{id:null,name:"Escabeche de caza",note:"Perdiz, codorniz o conejo, cocinados dentro."},{id:null,name:"Escabeche ligero o templado",note:"Para servir al momento con producto de la brasa."},{id:"marinada",name:"Marinada",note:"Aromatizar en crudo, sin cocci\xF3n."},{id:"adobo",name:"Adobo",note:"Pariente con m\xE1s piment\xF3n y especias."}],keys:["El escabeche de cocina no es una conserva est\xE9ril: siempre en fr\xEDo, nunca a temperatura ambiente ni en tarro cerrado sin tratamiento t\xE9rmico.","Si el pescado queda poco hecho o solo se cubre con el l\xEDquido caliente, congelarlo antes a -20 \xB0C al menos 24 horas por el anisakis.","Producto seco y bien marcado: la costra aguanta el \xE1cido.","Reposo de 24-48 horas: el primer d\xEDa sabe a vinagre, el segundo a escabeche."],errors:[{p:"Pescado seco o deshecho",fix:"Cocido de m\xE1s dentro del escabeche; para pescado azul, solo verter caliente."},{p:"Demasiado \xE1cido",fix:"M\xE1s aceite o fondo en el pr\xF3ximo; el ya hecho, servirlo con m\xE1s l\xEDquido de aceite templado."},{p:"Amargo",fix:"Piment\xF3n quemado o ajos tostados de m\xE1s."},{p:"El aceite cuaja en c\xE1mara",fix:"Es normal; atemperar 30 minutos antes de servir."}],history:"Conservar con vinagre es una t\xE9cnica muy antigua del Mediterr\xE1neo. La etimolog\xEDa m\xE1s aceptada relaciona la palabra con un guiso de vinagre de la cocina \xE1rabe medieval. Existe en Espa\xF1a, Portugal, Italia y Latinoam\xE9rica, con variantes en cada sitio.",uses:["Pescado azul","Perdiz, codorniz y conejo","Mejillones","Setas y verduras","Ensaladas templadas"],keep:"A 4 \xB0C o menos, con el producto cubierto por completo de l\xEDquido. Pescado, 4-5 d\xEDas; caza y aves, alrededor de una semana. Mejora a las 24-48 horas. Servir atemperado.",pro:"En un restaurante de brasa, el escabeche de producto marcado al carb\xF3n (caballa, bonito, codorniz) es un entrante de producci\xF3n adelantada. Gastronorm con el producto cubierto, film en contacto y fecha; fuera de fr\xEDo, como m\xE1ximo 2 horas.",related:["marinada","adobo","vinagreta","salmuera","fumet","aceites-aromatizados"]}];var Ps=[{id:"fondo-blanco",name:"Fondo blanco",aka:["fondo claro","caldo blanco","fond blanc","fondo blanco de ave","fondo blanco de ternera","caldo de pollo"],cat:"fondos",group:"Fondos claros",summary:"Caldo claro de huesos sin tostar, de ave o de ternera, base neutra de velut\xE9s, sopas, arroces y guisos claros.",what:"Fondo hecho con carcasas o huesos crudos, bien limpios o blanqueados, cocidos muy despacio desde agua fr\xEDa con [[mirepoix]] blanco y [[bouquet-garni]]. Busca sabor limpio, color p\xE1lido y mucha gelatina. De \xE9l salen la [[veloute]] y la [[suprema]], el [[consome]] y, reducido, la [[glace]] de ave.",base:{for:"5 l aprox. (fondo blanco de ave)",items:[["Carcasas, cuellos y alitas de pollo o gallina (para ternera: rodilla, ca\xF1a y morcillo)","5 kg"],["Patas de pollo limpias (gelatina)","500 g"],["Agua fr\xEDa","7 l"],["Cebolla","400 g"],["Puerro, parte blanca","250 g"],["Apio","200 g"],["Zanahoria (opcional, poca)","100 g"],["Bouquet garni","1"],["Pimienta blanca en grano","10 g"],["Sal","nada"]],steps:["Quitar grasa, restos de v\xEDsceras y co\xE1gulos. Lavar con agua fr\xEDa. La ternera se blanquea: cubrir con agua fr\xEDa, llevar a hervor, escurrir y refrescar.","Cubrir con el agua fr\xEDa y subir despacio hasta 85-90 \xB0C, sin llegar a hervir.","Desespumar a menudo durante los primeros 20-30 minutos.","A\xF1adir las verduras en trozos de 2-3 cm, el bouquet y la pimienta.","Mantener a 85-90 \xB0C, con un temblor apenas visible: ave 3-4 h, ternera 6-8 h. Rellenar con agua fr\xEDa si los huesos quedan al aire.","Colar con cazo, sin volcar ni apretar, por chino y estame\xF1a. Abatir, guardar en c\xE1mara y quitar la grasa ya cuajada."]},ratios:[{use:"Velout\xE9 y suprema",ratio:"1 kg de carcasa por 1,3-1,5 l de agua, 4 h",note:"Tiene que cuajar en fr\xEDo; si no, reducir un 20-30 %."},{use:"Consom\xE9",ratio:"Fondo de ave sin zanahoria, desgrasado al m\xE1ximo",note:"Cuanto m\xE1s limpio entre, mejor clarifica."},{use:"Arroces y fideos de carne",ratio:"Reducir 1/4 y a\xF1adir un hueso de jam\xF3n la \xFAltima hora",note:"El arroz pide caldo con m\xE1s sabor que una sopa."},{use:"Fondo blanco de ternera",ratio:"1 kg de hueso por 1,5-2 l de agua, 6-8 h",note:"Blanquear siempre para que no salga gris."}],variants:[{id:null,name:"Fondo blanco de ternera",note:"Huesos de ternera blanqueados; cocci\xF3n larga y sabor m\xE1s neutro."},{id:null,name:"Remojo o segundo caldo",note:"Los huesos del primer fondo se cuecen otra vez con agua; sirve para mojar el siguiente fondo o para guisos."},{id:"consome",name:"Consom\xE9",note:"Fondo blanco enriquecido y clarificado."}],keys:["Siempre desde agua fr\xEDa: las prote\xEDnas salen poco a poco y suben como espuma que se retira.","Nunca hervir: la ebullici\xF3n emulsiona la grasa y enturbia sin remedio.","Sin sal: el fondo se reduce y se usa en muchas cosas; se sala el plato final.","Patas, alitas y rodilla dan el col\xE1geno; sin gelatina no hay cuerpo.","Verduras grandes para cocciones largas; las peque\xF1as se deshacen y enturbian."],errors:[{p:"Turbio",fix:"Ha hervido o se ha removido. \xDAsalo en guisos o clarif\xEDcalo con claras como un consom\xE9."},{p:"Sin cuerpo, no cuaja",fix:"Poco hueso con col\xE1geno o demasiada agua. Reducir o hacer el siguiente con patas y alitas."},{p:"Gris y con sabor sucio",fix:"Ternera sin blanquear o huesos con sangre. Blanquear y lavar bien."}],history:"Los fondos son la base sobre la que la cocina cl\xE1sica francesa orden\xF3 sus salsas. En la cocina espa\xF1ola cumplen un papel parecido el caldo del cocido y el de gallina. Hoy se hacen m\xE1s concentrados y se ligan menos con harina.",uses:["Velout\xE9 y suprema","Sopas y cremas","Arroces de carne y de verduras","Guisos claros","Consom\xE9","Glace de ave"],keep:"Abatir de 60 \xB0C a menos de 10 \xB0C en menos de 2 horas. En c\xE1mara a 0-4 \xB0C, 3-4 d\xEDas con la capa de grasa encima; congelado, 3 meses. Antes de usar, llevar a hervor.",pro:"Ponerlo a fuego m\xEDnimo o en marmita con control de temperatura al acabar el servicio y colar por la ma\xF1ana. Porcionar en bolsas planas de 1 l o en cubiteras y etiquetar con tipo y fecha.",related:["veloute","suprema","consome","glace","mirepoix","bouquet-garni","fondo-oscuro","alemana"]},{id:"fondo-oscuro",name:"Fondo oscuro",aka:["fondo oscuro de ternera","fondo de vaca","fond brun","fondo tostado","caldo oscuro"],cat:"fondos",group:"Fondos oscuros",summary:"Fondo de huesos de ternera o vaca tostados con verduras y tomate, base de las salsas oscuras, los jugos y la glace.",what:"Huesos de ternera o vaca tostados en el horno, con [[mirepoix]] dorado y tomate tostado, mojados con agua fr\xEDa y cocidos muchas horas sin hervir. El tostado aporta color y sabor a asado; los cart\xEDlagos, la gelatina. Es la base de la [[espanola]], la [[demi-glace]], el [[jugo-de-carne]] y la [[glace]] de carne.",base:{for:"5 l aprox.",items:[["Huesos de ternera troceados (rodilla, ca\xF1a, cola)","5 kg"],["Recortes de carne o morcillo","500 g"],["Agua fr\xEDa","8 l"],["Cebolla","500 g"],["Zanahoria","300 g"],["Apio","200 g"],["Puerro","200 g"],["Ajo, cabeza partida","1"],["Tomate concentrado","100 g"],["Tomate maduro","300 g"],["Vino tinto (opcional)","300 ml"],["Bouquet garni y pimienta negra en grano","1 y 10 g"]],steps:["Tostar los huesos en una sola capa a 200-220 \xB0C, 45-60 minutos, d\xE1ndoles la vuelta, hasta marr\xF3n dorado. Negro es amargo.","A\xF1adir las verduras en trozos de 4-5 cm los \xFAltimos 20-30 minutos y dorarlas.","Untar el tomate concentrado por encima y tostarlo 5-10 minutos, hasta que pierda el rojo vivo.","Pasar todo a la marmita sin la grasa. Desglasar la bandeja con el vino o agua, raspando, y a\xF1adirlo.","Cubrir con el agua fr\xEDa, subir a 85-90 \xB0C, desespumar y poner el bouquet y el tomate fresco.","Cocer 6-8 horas sin hervir, desespumando y desgrasando. Colar sin apretar, abatir y desgrasar en fr\xEDo."]},ratios:[{use:"Demi-glace o media glasa",ratio:"Reducir a la mitad o a un tercio",note:"Con o sin [[espanola]], seg\xFAn la escuela."},{use:"Glace de carne",ratio:"Reducir a 1/10",note:"Ver [[glace]]."},{use:"Rabo, carrillera, guisos",ratio:"Fondo sin reducir como mojado",note:"El guiso ya concentra en la cocci\xF3n."},{use:"Jugo de cordero o pich\xF3n",ratio:"Fondo a medio reducir para mojar los recortes tostados",note:"Ver [[jugo-de-carne]]."},{use:"Fondo oscuro de ave (r\xE1pido)",ratio:"Alitas tostadas, 1 kg por 1,2 l, 3-4 h",note:"Para jugos de ave y salsas de carne blanca."}],variants:[{id:null,name:"Fondo oscuro de ave",note:"Carcasas y alitas tostadas; m\xE1s corto y ligero."},{id:null,name:"Fondo de cordero",note:"Huesos de cordero tostados, 4-5 h; ajo y romero."},{id:null,name:"Fondo de caza",note:"Huesos de caza, enebro y vino tinto; para salsas de venado o jabal\xED."},{id:"espanola",name:"Espa\xF1ola",note:"Fondo oscuro ligado con roux oscuro."},{id:"demi-glace",name:"Demi-glace",note:"Fondo oscuro reducido, con o sin espa\xF1ola."}],keys:["El sabor est\xE1 en el tostado, pero quemado amarga todo el fondo: mejor dorado oscuro que negro.","Retirar la grasa de la bandeja antes de pasar los huesos.","Tostar el tomate concentrado quita acidez y da color.","Pedir rodilla, cola y manos de ternera: el cart\xEDlago es el que da cuerpo.","Sin sal, porque casi siempre se reduce."],errors:[{p:"Amargo",fix:"Huesos, verduras o tomate quemados. No tiene arreglo; descartar la parte quemada antes de mojar."},{p:"Turbio y graso",fix:"Ha hervido. Desgrasar en fr\xEDo y usarlo para guisos; para salsa fina, colar por estame\xF1a tras reposar."},{p:"Sin cuerpo",fix:"Faltan cart\xEDlagos. A\xF1adir manos de ternera o cerdo en la siguiente tanda, o reducir."},{p:"\xC1cido",fix:"Exceso de tomate o vino sin reducir. Reducir el vino antes de mojar."}],history:"Es una pieza central de la cocina cl\xE1sica francesa, base de casi todas sus salsas oscuras. Hoy se liga menos con harina y se usa sobre todo reducido, para jugos y salsas concentradas.",uses:["Demi-glace y salsas oscuras","Jugos de asado","Glace de carne","Guisos de rabo y carrillera","Arroces de carne"],keep:"Abatir r\xE1pido y guardar en c\xE1mara a 0-4 \xB0C, 4-5 d\xEDas con la grasa encima. Congelado, 3 meses. Hervir antes de usar.",pro:"Tostar en varias bandejas para no amontonar: amontonado se cuece en vez de tostarse. Lo ideal es dejarlo toda la noche a fuego m\xEDnimo o en horno a 90-95 \xB0C con la marmita tapada a medias. Porcionar parte sin reducir en bolsas de 1 l y parte reducido en cubiteras.",related:["espanola","demi-glace","glace","jugo-de-carne","mirepoix","bouquet-garni","reducciones","fondo-blanco"]},{id:"fumet",name:"Fumet",aka:["fumet de pescado","caldo de pescado","fondo de pescado","fum\xE9"],cat:"fondos",group:"Fondos de mar",summary:"Fondo r\xE1pido de espinas y cabezas de pescado blanco, base de arroces, suquets, sopas y salsas de pescado.",what:"Fondo corto hecho con espinas y cabezas de pescado blanco, limpias de agallas y sangre, sudadas con verdura en l\xE1mina fina, con vino blanco y agua, y cocidas solo 20-30 minutos. Ligado da la [[veloute]] de pescado; es el mojado de arroces, fideu\xE1s y guisos marineros, y de salsas como la [[salsa-verde]].",base:{for:"4 l aprox.",items:[["Espinas y cabezas de pescado blanco (rape, merluza, rodaballo, gallo, lubina, dorada)","4 kg"],["Agua fr\xEDa","4,5 l"],["Cebolla en l\xE1mina fina","250 g"],["Puerro en l\xE1mina fina","200 g"],["Hinojo o apio en l\xE1mina","150 g"],["Vino blanco seco","300 ml"],["Tallos de perejil","1 manojo"],["Laurel","1 hoja"],["Pimienta blanca en grano","5 g"],["Aceite de oliva o mantequilla","40 g"]],steps:["Quitar agallas y la sangre del espinazo. Desangrar las espinas en agua con hielo 30-60 minutos, cambiando el agua.","Sudar la verdura en el aceite 5 minutos sin color. A\xF1adir las espinas escurridas y sudar 3-4 minutos m\xE1s.","Mojar con el vino y reducir a la mitad.","A\xF1adir el agua fr\xEDa, llevar a un hervor muy suave y desespumar. Poner perejil, laurel y pimienta.","Cocer 20-30 minutos a fuego m\xEDnimo, no m\xE1s.","Apartar, reposar 10 minutos y colar con cazo por estame\xF1a sin aplastar. Abatir enseguida."]},ratios:[{use:"Arroces y fideu\xE1",ratio:"Reducir 1/3 tras colar o mojar con fumet en vez de agua",note:"Se suele reforzar con sofrito y \xF1ora."},{use:"Suquet, bullit, guisos",ratio:"Fumet base, 1 kg de espina por litro",note:"Lo concentra la propia cocci\xF3n del guiso."},{use:"Velout\xE9 y salsa al vino blanco",ratio:"Reducir a la mitad y ligar con [[roux]] blanco",note:"Terminar con nata o mantequilla."},{use:"Escalfar pescado",ratio:"Fumet ligero, sin reducir",note:"Luego se reduce el l\xEDquido de cocci\xF3n para la salsa."},{use:"Caldo de roca o morralla",ratio:"Pescado de roca entero dorado con sofrito, 30-40 minutos",note:"M\xE1s intenso y coloreado; triturar y colar."}],variants:[{id:null,name:"Caldo de roca o de morralla",note:"Pescado peque\xF1o de roca tostado con tomate, ajo y \xF1ora; para arroces."},{id:null,name:"Fumet de vino tinto",note:"Con tinto en lugar de blanco; para pescados con salsa de carne."},{id:"fondo-de-marisco",name:"Fondo de marisco",note:"Cabezas y caparazones de crust\xE1ceos tostados."},{id:"dashi",name:"Dashi",note:"Caldo japon\xE9s de mar, de infusi\xF3n r\xE1pida."}],keys:["Solo pescado blanco y no graso: caballa, sardina o salm\xF3n dan un caldo fuerte y aceitoso.","Pasados 30 minutos el fumet se vuelve pegajoso y amargo.","Verdura en l\xE1mina fina, porque solo cuece media hora.","Sin agallas ni sangre: son las que amargan y oscurecen.","Colar sin presionar; el pescado aplastado enturbia."],errors:[{p:"Amargo o gris",fix:"Agallas, sangre o cocci\xF3n larga. Limpiar y desangrar, y respetar los 30 minutos."},{p:"Turbio",fix:"Hervor fuerte o espinas aplastadas al colar. Reposar y colar por estame\xF1a."},{p:"Olor fuerte",fix:"Espinas viejas o de pescado graso. Usar espinas del d\xEDa."},{p:"Sin sabor",fix:"Demasiada agua. Reducir o aumentar la espina en la siguiente tanda."}],history:"El fumet viene de la cocina cl\xE1sica francesa como fondo corto de pescado. En el litoral mediterr\xE1neo cumplen esa funci\xF3n los caldos de pescado de roca de los arroces y guisos marineros, que suelen ser m\xE1s intensos y llevan sofrito.",uses:["Arroces y fideu\xE1","Suquet y guisos de pescado","Salsa verde","Velout\xE9 de pescado","Sopas de pescado","Escalfados"],keep:"Abatir enseguida. En c\xE1mara a 0-4 \xB0C, 2 d\xEDas como m\xE1ximo. Congelado, 2-3 meses. Hervir antes de usar.",pro:"Hacerlo cada ma\xF1ana con las espinas del despiece del d\xEDa; las que no se usen se congelan limpias y desangradas. Porcionar en bolsas de 1-2 l para arroces y en cubiteras para salsas.",related:["fondo-de-marisco","veloute","salsa-verde","sofrito","picada","mirepoix","bouquet-garni","pil-pil"]},{id:"fondo-de-marisco",name:"Fondo de marisco",aka:["caldo de marisco","fumet de marisco","fondo de crust\xE1ceos","caldo de cabezas","caldo de gamba"],cat:"fondos",group:"Fondos de mar",summary:"Fondo de cabezas y caparazones de crust\xE1ceos tostados con sofrito y brandy, para arroces, bisques y salsa americana.",what:"Se tuestan en aceite cabezas y caparazones de gamba, carabinero, cigala o cangrejo, se a\xF1aden verduras, tomate y \xF1ora, se flambea y se moja con agua o [[fumet]]. Cuece poco, 30-40 minutos. Es la base de los arroces de marisco, de la [[salsa-americana]] y de las bisques, y con las mismas cabezas se hace aceite de marisco ([[aceites-aromatizados]]).",base:{for:"3 l aprox.",items:[["Cabezas y caparazones de gamba, cigala o cangrejo","2 kg"],["Aceite de oliva","100 ml"],["Cebolla","300 g"],["Zanahoria","150 g"],["Puerro","150 g"],["Hinojo","100 g"],["Ajo, cabeza partida","1"],["Tomate maduro rallado","400 g"],["Tomate concentrado","40 g"],["\xD1oras hidratadas, la pulpa","2"],["Brandy","100 ml"],["Vino blanco","200 ml"],["Agua fr\xEDa o fumet","4 l"],["Estrag\xF3n o tallos de perejil, laurel","al gusto"]],steps:["Saltear las cabezas en el aceite muy caliente 8-10 minutos, aplast\xE1ndolas para soltar el jugo, hasta rojo intenso con puntos tostados.","A\xF1adir la verdura en dados de 1 cm y rehogar 8-10 minutos.","A\xF1adir el concentrado, el tomate y la \xF1ora, y cocinar 5 minutos.","Flambear con el brandy, mojar con el vino y reducir casi a seco.","Cubrir con el agua o fumet fr\xEDo, hervor suave, desespumar y cocer 30-40 minutos.","Pasar por pasapur\xE9s o triturar a golpes cortos para sacar el jugo de las cabezas, y colar por chino y estame\xF1a."]},ratios:[{use:"Arroz de marisco y paella",ratio:"Caldo reducido a 2/3, salado ligeramente",note:"La cantidad por arroz depende del grano y la paella; probar siempre."},{use:"Fideu\xE1",ratio:"Caldo m\xE1s concentrado que para arroz",note:"El fideo absorbe menos y se cuece antes."},{use:"Salsa americana",ratio:"Reducir a la mitad y ligar",note:"Ver [[salsa-americana]]."},{use:"Bisque y cremas",ratio:"Triturar las cabezas en el caldo, colar y ligar con arroz o nata",note:"Pasar por estame\xF1a para que no quede arenoso."},{use:"Mojar un guiso de pescado",ratio:"Mitad fondo de marisco, mitad [[fumet]]",note:"Da color y sabor sin tapar el pescado."}],variants:[{id:"salsa-americana",name:"Salsa americana",note:"Salsa de crust\xE1ceos con tomate, brandy y estrag\xF3n."},{id:null,name:"Bisque",note:"Crema de crust\xE1ceo triturado y colado, ligada."},{id:null,name:"Caldo de galeras o cangrejo",note:"Crust\xE1ceo peque\xF1o triturado en crudo; muy sabroso y barato."},{id:"aceites-aromatizados",name:"Aceite de marisco",note:"Cabezas tostadas confitadas en aceite."}],keys:["El sabor est\xE1 en el tostado de las cabezas y en el jugo que sueltan al aplastarlas.","No cocer m\xE1s de 40-45 minutos: el caparaz\xF3n da amargor y sabor terroso.","Mojar con fumet en vez de agua da un caldo mucho m\xE1s redondo.","Congelar las cabezas crudas el mismo d\xEDa que se pela el marisco y juntarlas hasta tener una tanda.","Colar dos veces: chino y luego estame\xF1a."],errors:[{p:"Amargo",fix:"Cabezas o ajo quemados, o cocci\xF3n larga. Tostar sin negro y respetar el tiempo."},{p:"Sin color",fix:"Poco tostado o poco tomate. Tostar m\xE1s y pinchar bien el concentrado."},{p:"Arenoso",fix:"Restos de caparaz\xF3n. Colar por estame\xF1a fina."},{p:"Olor a amoniaco",fix:"Cabezas viejas. No tiene arreglo; descartar."}],history:"Los caldos de cabezas de marisco son tradicionales en los arroces del litoral mediterr\xE1neo, y la cocina francesa los convirti\xF3 en bisques y salsas como la americana. Hoy se usan mucho para dar sabor de marisco a arroces y salsas sin gastar el marisco entero.",uses:["Arroces de marisco","Fideu\xE1","Salsa americana","Bisques y cremas","Guisos de pescado","Aceite de marisco"],keep:"Las cabezas se estropean muy r\xE1pido: usarlas o congelarlas el mismo d\xEDa. El caldo, abatido, aguanta 2 d\xEDas a 0-4 \xB0C y 3 meses congelado. Hervir antes de usar.",pro:"Hacer tandas grandes con las cabezas congeladas de la semana y porcionar en bolsas por n\xFAmero de raciones de arroz. Usar sartenes anchas o la propia paella para tostar sin amontonar.",related:["fumet","salsa-americana","sofrito","picada","aceites-aromatizados","reducciones"]},{id:"caldo-de-verduras",name:"Caldo de verduras",aka:["fondo de verduras","caldo vegetal","fondo vegetal","court-bouillon"],cat:"fondos",group:"Fondos claros",summary:"Caldo corto de verduras arom\xE1ticas y hierbas, base de risottos, cremas, platos vegetales y cocciones de pescado.",what:"Infusi\xF3n de verduras arom\xE1ticas, [[mirepoix]] con puerro, hinojo y algo de tomate o setas, cocidas menos de una hora y reposadas con hierbas. Es el mojado neutro de la cocina vegetal y, con vino y vinagre, el court-bouillon para escalfar pescado y marisco. Con kombu o setas secas gana el umami que le suele faltar (ver [[dashi]]).",base:{for:"3 l aprox.",items:[["Agua fr\xEDa","4 l"],["Cebolla","400 g"],["Puerro","300 g"],["Zanahoria","300 g"],["Apio","200 g"],["Hinojo","150 g"],["Champi\xF1\xF3n o recortes de setas","200 g"],["Tomate maduro","200 g"],["Ajo","4 dientes"],["Tallos de perejil, tomillo, laurel, pimienta en grano","al gusto"]],steps:["Lavar y cortar en dados de 1-2 cm o en l\xE1mina gruesa.","Opcional: sudar en un poco de aceite 10 minutos sin color para m\xE1s sabor.","Cubrir con el agua fr\xEDa, llevar a hervor suave y cocer 40 minutos, sin pasar de una hora.","Apartar del fuego, a\xF1adir las hierbas tiernas y dejar infusionar 10-15 minutos.","Colar sin aplastar y abatir."]},ratios:[{use:"Risotto y arroces de verduras",ratio:"Caldo base + setas secas 10 g por litro",note:"Sin coles ni remolacha, que ti\xF1en y dominan."},{use:"Caldo oscuro de verduras",ratio:"Verduras tostadas a 200 \xB0C 30-40 minutos antes de mojar",note:"Para jugos vegetales y guisos de legumbre."},{use:"Court-bouillon para pescado y marisco",ratio:"Caldo + 10 % de vino blanco o 3-5 % de vinagre, sal 10-15 g por litro",note:"Cocer 20-30 minutos antes de meter el pescado."},{use:"Cremas de verdura",ratio:"Caldo ligero hecho con los recortes de la misma verdura",note:"Refuerza el sabor principal."}],variants:[{id:null,name:"Court-bouillon",note:"Caldo corto \xE1cido y salado para escalfar."},{id:null,name:"Caldo de verduras tostadas",note:"M\xE1s color y sabor; sustituye a un fondo oscuro en cocina vegetal."},{id:null,name:"Caldo de setas",note:"Setas frescas y secas; muy sabroso para arroces y risottos."},{id:"dashi",name:"Dashi de kombu",note:"Infusi\xF3n de alga, aporta umami sin pescado."}],keys:["M\xE1s de una hora no mejora: la verdura se pasa y amarga.","Fuera coles, br\xF3coli, alcachofa y remolacha salvo que se busque ese sabor.","La patata enturbia; reservarla para cremas.","Aprovechar recortes limpios de la partida, nunca restos viejos.","Sin sal, salvo el court-bouillon."],errors:[{p:"Amargo o con olor a azufre",fix:"Coles o cocci\xF3n larga. Sacar las cruc\xEDferas y cortar a los 40 minutos."},{p:"Plano",fix:"Falta umami. A\xF1adir setas secas, tomate o kombu, o tostar parte de la verdura."},{p:"Dulz\xF3n",fix:"Demasiada zanahoria o hinojo. Equilibrar con apio y puerro."},{p:"Turbio",fix:"Hervor fuerte o patata. Hervor suave y colar sin aplastar."}],history:"Los caldos de verdura existen en todas las cocinas, y el court-bouillon es la versi\xF3n cl\xE1sica francesa para cocer pescado. Han ganado peso con la cocina vegetal, que pide caldos con m\xE1s sabor que el simple hervido de verduras.",uses:["Risotto","Arroces de verduras","Cremas y sopas","Guisos de legumbre","Escalfar pescado y marisco","Platos veganos"],keep:"Abatir y guardar a 0-4 \xB0C, 3 d\xEDas. Congelado, 3 meses.",pro:"Juntar durante el d\xEDa los recortes limpios en un gastronorm en c\xE1mara y hacer el caldo por la tarde. Porcionar en bolsas de 1 l.",related:["mirepoix","bouquet-garni","dashi","fondo-blanco","fumet"]},{id:"dashi",name:"Dashi",aka:["caldo dashi","ichiban dashi","awase dashi","caldo de kombu y bonito"],cat:"fondos",group:"Fondos de mar",summary:"Caldo japon\xE9s de alga kombu y bonito seco ahumado, de infusi\xF3n corta y mucho umami.",what:"Es m\xE1s una infusi\xF3n que un fondo: el alga kombu se calienta despacio en agua y despu\xE9s se infusionan las virutas de bonito seco ahumado (katsuobushi). Kombu y bonito se refuerzan entre s\xED y dan un umami muy limpio. El primer caldo es para sopas y salsas finas; los restos dan un segundo caldo para cocciones. Combina bien con pescado y marisco, tambi\xE9n a la brasa.",base:{for:"1 l",items:[["Agua blanda o mineral de mineralizaci\xF3n d\xE9bil","1,1 l"],["Alga kombu","15-20 g"],["Katsuobushi (bonito seco en virutas)","20-30 g"]],steps:["Limpiar la kombu con un pa\xF1o h\xFAmedo sin lavarla: el polvo blanco es sabor.","Remojarla en el agua fr\xEDa, de 30 minutos a toda la noche en c\xE1mara.","Calentar despacio y retirar la kombu justo antes de que hierva, hacia 80 \xB0C. Otra opci\xF3n: mantenerla a 60 \xB0C durante 1 hora y retirarla.","Llevar el agua a unos 85 \xB0C, apartar, echar el bonito y dejarlo 2-3 minutos, hasta que se hunda.","Colar por estame\xF1a sin apretar."]},ratios:[{use:"Sopa de miso",ratio:"Primer dashi, 60-80 g de miso por litro",note:"Desle\xEDr el miso fuera del fuego; si hierve pierde aroma."},{use:"Guisos y cocciones",ratio:"Segundo dashi: restos + 500 ml de agua, 10-15 minutos de hervor suave",note:"M\xE1s fuerte y menos fino."},{use:"Cocina vegetal",ratio:"Solo kombu y 2-3 setas shiitake secas por litro, en fr\xEDo 8-12 h",note:"Sin pescado."},{use:"Salsas tipo tsuyu o ponzu",ratio:"Dashi con soja y mirin, o con c\xEDtrico",note:"Proporciones seg\xFAn uso; probar."},{use:"Arroces y pescado a la brasa",ratio:"Dashi como mojado o para ba\xF1ar el pescado al servir",note:"Da fondo marino sin tapar el humo."}],variants:[{id:null,name:"Segundo dashi (niban)",note:"Segunda extracci\xF3n de los mismos restos."},{id:null,name:"Kombu dashi",note:"Solo alga; vegano."},{id:null,name:"Dashi de shiitake",note:"Setas secas, a menudo junto a la kombu."},{id:null,name:"Dashi de sardinitas secas (niboshi)",note:"M\xE1s intenso, para miso y guisos."}],keys:["La kombu no debe hervir: se vuelve viscosa y amarga.","El bonito no se aprieta al colar: enturbia y amarga.","Agua blanda: la dura extrae peor.","Se hace en el d\xEDa; pierde aroma enseguida.","Salar poco o nada: suele acompa\xF1ar soja o miso."],errors:[{p:"Viscoso y con sabor fuerte a alga",fix:"La kombu ha hervido. Retirarla antes."},{p:"Turbio o ahumado agresivo",fix:"Bonito exprimido o cocido. Infusionar fuera del fuego y colar sin apretar."},{p:"Ins\xEDpido",fix:"Poca kombu, poco bonito o agua dura. Aumentar y cambiar de agua."}],history:"Es la base de la cocina japonesa desde hace siglos. A principios del siglo XX un qu\xEDmico japon\xE9s identific\xF3 en la kombu el glutamato y dio nombre al umami, el sabor que define este caldo.",uses:["Sopa de miso","Caldos y fideos japoneses","Cocci\xF3n de verduras y pescado","Salsas con soja y c\xEDtrico","Arroces de pescado"],keep:"En c\xE1mara a 0-4 \xB0C, 2-3 d\xEDas, pero lo mejor es el mismo d\xEDa. Se puede congelar, aunque pierde aroma.",pro:"Dejar la kombu en remojo en fr\xEDo la noche anterior en la cubeta del d\xEDa y terminar el bonito al empezar el servicio. Los restos se aprovechan para el segundo dashi del personal o de cocciones.",related:["fumet","caldo-de-verduras","consome","marinada","fondo-de-marisco"]},{id:"jugo-de-carne",name:"Jugo de carne",aka:["jus","jugo de asado","jugo de cordero","jugo de pich\xF3n","jugo corto","jugo de ave"],cat:"fondos",group:"Jugos y glasas",summary:"Salsa corta de los recortes tostados del mismo animal, mojados con fondo y reducidos, sin harina; el acompa\xF1amiento natural de la brasa.",what:"Se tuestan huesos y recortes de la pieza que se va a servir, se desglasa y se moja con [[fondo-oscuro]] o fondo de ave en varias veces, reduciendo cada vez, hasta tener una salsa brillante que napa ligeramente. Es m\xE1s directo y ligero que la [[demi-glace]]. La brasa no deja fondo de sart\xE9n: el jugo se hace aparte, y la parrilla sirve para tostar los recortes y dar el jugo del reposo.",base:{for:"500 ml (12-15 raciones de 30-40 ml)",items:[["Huesos y recortes del animal troceados a 3-4 cm (cordero, pich\xF3n, ave, ternera)","
