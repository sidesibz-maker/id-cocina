1,5 kg"],["Aceite de oliva","50 ml"],["Mantequilla","50 g"],["Chalota en l\xE1minas","150 g"],["Ajo con piel, aplastado","6 dientes"],["Tomillo y romero","unas ramas"],["Vino blanco o tinto","200 ml"],["Fondo oscuro o fondo de ave","2 l"],["Mantequilla fr\xEDa para terminar","30-50 g"],["Sal y unas gotas de vinagre de jerez","al gusto"]],steps:["Tostar los recortes con el aceite en una cocotte ancha a fuego fuerte 15-20 minutos, removiendo poco, hasta dorado intenso. Tambi\xE9n se pueden tostar en la parrilla o en el horno a 200 \xB0C.","Quitar el exceso de grasa, a\xF1adir la mantequilla, la chalota, el ajo y las hierbas y rehogar 5 minutos.","Desglasar con el vino, raspando, y reducir hasta que glasee.","Mojar con un vaso de fondo y reducir a glaseado; repetir dos o tres veces y a\xF1adir el resto. Cocer suave 45-60 minutos (pich\xF3n y ave, 30-40).","Colar por chino apretando poco, desgrasar y reducir a punto de napa ligera.","Al pase: a\xF1adir el jugo del reposo de la pieza, montar con mantequilla fr\xEDa y ajustar sal y acidez."]},ratios:[{use:"Cordero y cabrito a la brasa",ratio:"Recortes de cordero + fondo oscuro, romero y ajo",note:"Una anchoa en el tostado refuerza."},{use:"Pich\xF3n y caza",ratio:"Carcasas tostadas + fondo oscuro; ligar al final con el h\xEDgado triturado, fuera del fuego",note:"No dejar hervir despu\xE9s de ligar."},{use:"Vaca y chulet\xF3n",ratio:"Jugo de ternera reducido + grasa de la propia vaca derretida en la brasa",note:"Servir al lado, no encima de la costra."},{use:"Ligado r\xE1pido",ratio:"5-10 g de f\xE9cula por litro, desle\xEDda en fr\xEDo",note:"Solo si no hay tiempo de reducir; ver [[ligazones]]."}],variants:[{id:null,name:"Jugo de cordero",note:"Con romero, ajo y a veces anchoa."},{id:null,name:"Jugo de pich\xF3n",note:"Corto, ligado con h\xEDgado; muy intenso."},{id:null,name:"Jugo de ave asada",note:"Alitas y fondo de ave; claro y ligero."},{id:"demi-glace",name:"Demi-glace",note:"Salsa oscura m\xE1s concentrada y neutra."}],keys:["Mojar en varias veces y reducir a glaseado entre ellas da color y profundidad.","El jugo del reposo de la carne es oro: recogerlo de la tabla y a\xF1adirlo al cazo.","Tostar recortes en la brasa aporta humo al jugo y lo une con el plato.","Unas gotas de vinagre o c\xEDtrico levantan un jugo pesado."],errors:[{p:"Demasiado ligero",fix:"Reducir m\xE1s o a\xF1adir un poco de [[glace]]."},{p:"Pega en los labios",fix:"Sobrerreducido. Aflojar con fondo o un poco de agua."},{p:"Graso",fix:"Desgrasar con cazo y papel; montar la mantequilla solo al final."}],history:"El jugo es la salsa m\xE1s sencilla de un asado en la cocina francesa. Desde finales del siglo XX los restaurantes han ido cambiando las salsas ligadas con harina por jugos y reducciones m\xE1s ligeros.",uses:["Cordero y cabrito a la brasa","Pich\xF3n y caza","Pollo asado","Carnes rojas"],keep:"Abatir y guardar a 0-4 \xB0C, 4-5 d\xEDas; congelado, 3 meses. Regenerar a fuego suave y montar de nuevo.",pro:"Tener el jugo reducido en cazo peque\xF1o al ba\xF1o mar\xEDa a 70-80 \xB0C, tapado, y montar solo lo que se sirve. Guardar congelados los recortes de cada despiece, por especie, para el jugo de esa carne.",related:["fondo-oscuro","glace","demi-glace","reducciones","ligazones","mantequillas-compuestas","mantequilla-noisette"]},{id:"glace",name:"Glace",aka:["glasa","glace de viande","glasa de carne","glace de ave","media glasa"],cat:"fondos",group:"Jugos y glasas",summary:"Fondo reducido hasta jarabe espeso que cuaja duro en fr\xEDo; concentrado para reforzar salsas y jugos.",what:"Es un fondo bien desgrasado reducido a una d\xE9cima parte, hasta que tiene textura de jarabe y cuaja como goma en fr\xEDo. La de carne sale del [[fondo-oscuro]]; la de ave, del [[fondo-blanco]] o del oscuro de ave. En muchas cocinas se llama media glasa al fondo oscuro reducido a la mitad o a un tercio sin harina, que es lo que en la cocina cl\xE1sica corresponde a la [[demi-glace]].",base:{for:"500 ml de glace de carne",items:[["Fondo oscuro de ternera, fr\xEDo y desgrasado, sin sal","5 l"]],steps:["Quitar en fr\xEDo toda la grasa cuajada.","Reducir en un cazo ancho a fuego medio, desespumando a menudo.","Cuando ha bajado a la mitad, colar por chino a un cazo m\xE1s peque\xF1o para que no se queme en las paredes.","Repetir el cambio de cazo cada vez que reduzca bastante y bajar el fuego al final.","Punto: napa espesa, burbujas grandes y lentas, unos 500 ml.","Verter en bandeja o en moldes peque\xF1os y enfriar."]},ratios:[{use:"Glace de carne",ratio:"Fondo oscuro de ternera a 1/10",note:"Cuaja firme; se corta en dados."},{use:"Glace de ave",ratio:"Fondo de ave a 1/8-1/10",note:"M\xE1s clara y suave."},{use:"Glace de pescado",ratio:"Fumet muy limpio a 1/5-1/8",note:"Delicada; se amarga si se pasa."},{use:"Media glasa",ratio:"Fondo oscuro a 1/2-1/3",note:"Base lista para salsas al momento."},{use:"Reforzar un jugo o salsa",ratio:"10-20 g de glace por cada 100 ml",note:"Disolver en caliente y probar."},{use:"Glasear carnes de brasa",ratio:"Glace aflojada con un poco de agua o jugo, a pincel",note:"Al final de la cocci\xF3n, para brillo."}],variants:[{id:null,name:"Glace de viande",note:"De fondo oscuro de ternera."},{id:null,name:"Glace de ave",note:"De fondo de ave."},{id:null,name:"Glace de pescado",note:"De fumet; para salsas de pescado."},{id:"demi-glace",name:"Demi-glace o media glasa",note:"Reducci\xF3n intermedia para salsas."},{id:"jugo-de-carne",name:"Jugo de carne",note:"Salsa de la pieza, que la glace refuerza."}],keys:["Solo sale de un fondo con gelatina; un fondo flojo nunca cuaja.","El fondo no puede llevar sal: a 1/10 ser\xEDa incomible.","Cambiar a cazos m\xE1s peque\xF1os evita el sabor a quemado de las paredes.","Desgrasar del todo antes de reducir: la grasa concentrada enturbia y enrancia.","Fuego m\xE1s bajo al final, cuando hay m\xE1s riesgo."],errors:[{p:"Sabor a quemado",fix:"Paredes requemadas o fuego fuerte al final. Cambiar de cazo y bajar fuego."},{p:"No cuaja",fix:"Fondo sin gelatina o poco reducido. Reducir m\xE1s o hacer el fondo con m\xE1s cart\xEDlago."},{p:"Salada",fix:"Fondo con sal. No tiene arreglo; usarla en poca cantidad."},{p:"Turbia",fix:"Grasa o hervor sin espumar. Desgrasar y espumar mejor."}],history:"La glace viene de la cocina cl\xE1sica francesa, donde se usaba para reforzar salsas. Hoy se usa sobre todo como concentrado casero para terminar jugos y reducciones al momento.",uses:["Reforzar jugos y salsas","Salsas al momento","Glasear carnes","Dar cuerpo a vinagretas calientes","Mantequillas compuestas para carne"],keep:"En c\xE1mara a 0-4 \xB0C, bien tapada, 2-3 semanas. Congelada en porciones, 6 meses.",pro:"Congelar en cubiteras o moldes de silicona de 20-30 g y guardar en bolsa. En el pase basta un dado para corregir un jugo flojo. Reducir en la cocina cuando hay fuego libre, por la tarde.",related:["fondo-oscuro","fondo-blanco","demi-glace","jugo-de-carne","reducciones","espanola","mantequillas-compuestas"]},{id:"consome",name:"Consom\xE9",aka:["consomm\xE9","caldo clarificado","consom\xE9 doble","consom\xE9 al jerez","clarificaci\xF3n"],cat:"fondos",group:"Fondos claros",summary:"Fondo enriquecido y clarificado con carne picada, claras y verduras hasta quedar transparente.",what:"Se parte de un fondo fr\xEDo y desgrasado y se calienta con una mezcla de carne magra picada, claras, verdura y tomate (la clarificaci\xF3n). Al coagular, las claras suben y forman una capa, la balsa, que atrapa las impurezas mientras la carne enriquece el caldo. El consom\xE9 doble se hace con el doble de carne. Puede ser de ave, carne o pescado, caliente o fr\xEDo y gelatinoso.",base:{for:"4 l aprox.",items:[["Fondo blanco de ave o ternera, fr\xEDo y desgrasado","5 l"],["Carne magra picada (morcillo de ternera o muslo de pollo sin piel)","1 kg"],["Claras","250 g (6-8)"],["Mirepoix picado fino (cebolla, puerro, zanahoria, apio)","400 g"],["Tomate","150 g"],["Pimienta en grano, perejil, laurel","al gusto"],["Sal","al final"]],steps:["Mezclar carne, claras, verdura y tomate con un poco de fondo fr\xEDo. Reposar 30 minutos en c\xE1mara.","A\xF1adir el resto del fondo fr\xEDo y mezclar bien.","Calentar despacio removiendo con esp\xE1tula desde el fondo hasta 50-60 \xB0C, para que no se pegue.","Dejar de remover: las claras cuajan y suben formando la balsa.","Abrir un agujero en la balsa y mantener a 85-90 \xB0C, sin hervir, 60-90 minutos (pescado, 30-40), regando la balsa por el agujero.","Sacar el caldo con cazo por el agujero y colar por estame\xF1a h\xFAmeda, sin romper la balsa. Quitar la grasa con papel y salar."]},ratios:[{use:"Consom\xE9 doble",ratio:"2 kg de carne por 5 l, o clarificar con consom\xE9 en vez de fondo",note:"M\xE1s sabor y m\xE1s cuerpo."},{use:"Consom\xE9 de pescado",ratio:"Fumet + 600 g de pescado blanco picado + claras, 30-40 minutos",note:"Sin tomate en exceso; hinojo y perejil."},{use:"Consom\xE9 fr\xEDo gelatinoso",ratio:"Fondo rico en col\xE1geno o 8-10 g de gelatina por litro",note:"Cuajado tembloroso; servir muy fr\xEDo."},{use:"Clarificaci\xF3n sin carne",ratio:"Unos 2 g de agar por litro: cuajar, romper y escurrir en estame\xF1a en c\xE1mara",note:"Para caldos vegetales, de tomate o de marisco."},{use:"Consom\xE9 al jerez",ratio:"Un chorrito de fino u oloroso por raci\xF3n, al pase",note:"No hervir despu\xE9s."}],variants:[{id:null,name:"Consom\xE9 doble",note:"Con el doble de carne."},{id:null,name:"Consom\xE9 de ave",note:"Fondo y carne de ave."},{id:null,name:"Consom\xE9 de pescado",note:"Fumet clarificado con pescado blanco."},{id:null,name:"Consom\xE9 fr\xEDo",note:"Gelatinoso, como entrante de verano."},{id:null,name:"Agua de tomate clarificada",note:"Clarificada con agar o por goteo en fr\xEDo."}],keys:["Fondo fr\xEDo y sin grasa al empezar; si entra caliente, las claras cuajan de golpe sin atrapar nada.","Remover solo hasta que se forma la balsa; luego no tocar.","Nunca hervir: rompe la balsa y enturbia.","Carne magra: la grasa no se va con la clarificaci\xF3n.","La acidez del tomate ayuda a coagular y clarificar."],errors:[{p:"Turbio",fix:"Ha hervido o se ha removido con la balsa formada. Enfriar y volver a clarificar con claras y algo de carne."},{p:"Pegado en el fondo",fix:"No se removi\xF3 al calentar. Cambiar de olla sin raspar."},{p:"Graso",fix:"Pasar papel por la superficie o enfriar y retirar la grasa."},{p:"Ins\xEDpido",fix:"Poca carne o fondo flojo. Hacer consom\xE9 doble."}],history:"El consom\xE9 es un cl\xE1sico de la cocina francesa, de los tiempos en que un caldo transparente era muestra del oficio de la cocina. La t\xE9cnica de clarificar con claras sigue igual; ahora se usan tambi\xE9n agar y goteo en fr\xEDo.",uses:["Consom\xE9 caliente con guarnici\xF3n","Consom\xE9 fr\xEDo","Base para gelatinas","Caldos de arroz de lujo","Peque\xF1as tazas de bienvenida"],keep:"Abatir. En c\xE1mara a 0-4 \xB0C, 3-4 d\xEDas; congelado, 3 meses. Recalentar suave sin hervir fuerte.",pro:"Hacerlo la v\xEDspera. Al pase, servir a unos 80 \xB0C en taza o plato caliente, con la guarnici\xF3n cortada fina y escaldada aparte para no enturbiarlo.",related:["fondo-blanco","fumet","mirepoix","bouquet-garni","dashi","caldo-de-verduras"]},{id:"mirepoix",name:"Mirepoix",aka:["guarnici\xF3n arom\xE1tica","mirepoix blanco","matignon","sofrito base","soffritto","holy trinity"],cat:"bases",group:"Arom\xE1ticos",summary:"Mezcla de cebolla, zanahoria y apio que da fondo de sabor a fondos, salsas y guisos; el tama\xF1o se corta seg\xFAn el tiempo de cocci\xF3n.",what:"Base arom\xE1tica francesa: dos partes de cebolla, una de zanahoria y una de apio, en peso. Se suda sin color para fondos claros y se dora para oscuros. El mirepoix blanco cambia la zanahoria por puerro y a veces champi\xF1\xF3n. Otras cocinas tienen su versi\xF3n: el soffritto italiano (las mismas verduras en aceite), la trinidad de Luisiana (cebolla, apio y pimiento verde) y, en Espa\xF1a, el [[sofrito]] de cebolla, ajo, pimiento y tomate.",base:{for:"1 kg",items:[["Cebolla","500 g"],["Zanahoria","250 g"],["Apio","250 g"],["Opcional: puerro, ajo, tomate, recortes de champi\xF1\xF3n","seg\xFAn uso"]],steps:["Lavar y pelar. Quitar las hojas del apio si la cocci\xF3n es larga.","Cortar todas las verduras al mismo tama\xF1o seg\xFAn el tiempo de cocci\xF3n (ver cambios).","Fondos claros: sudar en poca grasa sin color o poner en crudo. Fondos oscuros: dorar en la bandeja o en la marmita.","A\xF1adir tras desespumar, salvo en fondos oscuros, donde se tuesta con los huesos."]},ratios:[{use:"Fumet y caldos de 20-45 minutos",ratio:"L\xE1mina fina o dados de 3-5 mm",note:"Tiene que soltar sabor r\xE1pido."},{use:"Jugos y salsas al momento (30-60 minutos)",ratio:"Dados de 1 cm",note:"Se cuela al final."},{use:"Fondo blanco de ave (3-4 h) y braseados",ratio:"Dados de 2-3 cm",note:"Aguanta sin deshacerse."},{use:"Fondo oscuro (6-8 h)",ratio:"Trozos de 4-5 cm o mitades",note:"Cortado fino se deshace y enturbia."},{use:"Fondos claros",ratio:"Mirepoix blanco: cebolla, puerro y apio, poca o ninguna zanahoria",note:"Mantiene el color p\xE1lido."},{use:"Guarnici\xF3n que se come (matignon)",ratio:"Brunoise de 2-3 mm con jam\xF3n o panceta, rehogada",note:"Para braseados y salsas que no se cuelan."}],variants:[{id:null,name:"Mirepoix blanco",note:"Sin zanahoria, con puerro; para fondos claros."},{id:null,name:"Matignon",note:"Cortado fino, con curado, y se come en el plato."},{id:null,name:"Soffritto",note:"Cebolla, zanahoria y apio picados y pochados en aceite."},{id:null,name:"Trinidad de Luisiana",note:"Cebolla, apio y pimiento verde."},{id:"sofrito",name:"Sofrito",note:"Base espa\xF1ola de cebolla, ajo, pimiento y tomate."}],keys:["Proporci\xF3n en peso, no a ojo: 2:1:1.","Todo al mismo tama\xF1o para que se cueza igual.","El tama\xF1o depende del tiempo: corto, fino; largo, grande.","Para fondos oscuros, tostar; para claros, nunca dar color.","Aprovechar recortes limpios, nunca verdura pasada."],errors:[{p:"Fondo turbio",fix:"Corte demasiado fino para una cocci\xF3n larga. Cortar m\xE1s grande."},{p:"Fondo dulz\xF3n",fix:"Exceso de zanahoria. Respetar la proporci\xF3n."},{p:"Amargo",fix:"Hojas de apio en cocci\xF3n larga o verdura quemada. Quitar hojas y vigilar el tostado."},{p:"Fondo claro con color",fix:"Zanahoria o verdura dorada. Usar mirepoix blanco y sudar sin color."}],history:"El nombre se suele atribuir a un noble franc\xE9s del siglo XVIII. Cada tradici\xF3n ha resuelto lo mismo con sus verduras: la cocina espa\xF1ola con el sofrito, la italiana con el soffritto y la criolla de Luisiana con su trinidad.",uses:["Fondos claros y oscuros","Fumet","Jugos y salsas","Braseados y guisos","Consom\xE9"],keep:"Cortado en crudo, 2-3 d\xEDas a 0-4 \xB0C en gastronorm con papel h\xFAmedo y tapado. Se puede congelar para fondos, no para guarnici\xF3n.",pro:"Cortar mirepoix en lote al principio de la semana, separado por tama\xF1os y etiquetado. Para fondos grandes, el robot cortador ahorra tiempo en los cortes de 1 cm.",related:["sofrito","bouquet-garni","fondo-blanco","fondo-oscuro","fumet","caldo-de-verduras","consome"]},{id:"bouquet-garni",name:"Bouquet garni",aka:["ramillete de hierbas","atadillo de hierbas","manojo arom\xE1tico","mu\xF1equilla de especias"],cat:"bases",group:"Arom\xE1ticos",summary:"Hierbas atadas que perfuman fondos y guisos y se retiran enteras al final.",what:"Ramillete de laurel, tomillo y tallos de perejil envuelto en hojas verdes de puerro y atado con bramante, para retirarlo de una vez. Las especias que no se quieren encontrar en el plato (pimienta, clavo, enebro, ajo) van en una mu\xF1equilla de estame\xF1a. Acompa\xF1a al [[mirepoix]] en fondos, guisos y el [[consome]].",base:{for:"1 bouquet para 5 l",items:[["Hojas verdes de puerro","2"],["Tallos de perejil","8-10"],["Tomillo fresco","3-4 ramas"],["Laurel","1-2 hojas"],["Apio, una rama (opcional)","1"],["Bramante de cocina","50 cm"]],steps:["Lavar las hierbas y escurrirlas.","Poner perejil, tomillo, laurel y apio en el centro de una hoja de puerro y cerrar con la otra.","Atar fuerte con bramante en varias vueltas y dejar un cabo largo.","Atar el cabo al asa de la marmita y meter el bouquet tras desespumar.","Retirarlo al final o antes si el sabor ya est\xE1; en cocciones de 6-8 h las hierbas tiernas se cambian a mitad."]},ratios:[{use:"Fondo blanco y de ave",ratio:"Bouquet cl\xE1sico, 1 por 5 l",note:"Laurel discreto."},{use:"Fumet",ratio:"Perejil, hinojo y poco laurel, sin tomillo fuerte",note:"Solo 20-30 minutos de cocci\xF3n."},{use:"Fondo oscuro y caza",ratio:"Bouquet cl\xE1sico + mu\xF1equilla con 4-6 bayas de enebro y 1 clavo",note:"Retirar el clavo a las 2 h."},{use:"Cordero y carnes de brasa",ratio:"Romero y tomillo, poco romero",note:"El romero domina enseguida."},{use:"Pescado mediterr\xE1neo",ratio:"Hinojo, tallos de perejil, piel de lim\xF3n sin blanco",note:"Para fumet y suquets."}],variants:[{id:null,name:"Mu\xF1equilla de especias",note:"Estame\xF1a atada con pimienta, clavo, enebro, ajo; se retira igual."},{id:null,name:"Bouquet mediterr\xE1neo",note:"Tomillo, romero, hinojo, ajedrea, piel de naranja o lim\xF3n."}],keys:["Atado al asa: no se pierde ni hay que buscarlo.","Hierbas le\xF1osas (tomillo, romero, laurel) aguantan horas; las tiernas se ponen al final o se cambian.","Tallos de perejil, no hojas: dan sabor sin te\xF1ir.","Poco laurel: una hoja de m\xE1s amarga 5 litros.","En la mu\xF1equilla, especias enteras, nunca molidas."],errors:[{p:"Hierbas sueltas en el fondo",fix:"Mal atado. Atar con varias vueltas y apretar."},{p:"Sabor medicinal",fix:"Exceso de laurel, romero o clavo. Reducir cantidades y retirar antes."},{p:"Fondo verdoso o amargo",fix:"Hojas tiernas cocidas horas. Usar tallos y retirar a tiempo."}],history:"Es un recurso de la cocina cl\xE1sica francesa para perfumar sin dejar restos. Cada regi\xF3n lo adapta a sus hierbas; en la cocina mediterr\xE1nea tienen m\xE1s peso el romero, el hinojo y las pieles de c\xEDtrico.",uses:["Fondos y fumets","Consom\xE9","Guisos y braseados","Legumbres","Escabeches","Court-bouillon"],keep:"Prepararlo el d\xEDa de uso. Las hierbas, a 0-4 \xB0C en caja con papel h\xFAmedo, 4-5 d\xEDas.",pro:"Hacer bouquets en lote en la mise en place, uno por marmita o por cada 5-10 l, y guardarlos tapados en c\xE1mara. Para marmitas grandes, varios bouquets mejor que uno enorme.",related:["mirepoix","fondo-blanco","fondo-oscuro","fumet","consome","caldo-de-verduras","escabeche"]},{id:"salmuera",name:"Salmuera",aka:["salmuera h\xFAmeda","salmuera en seco","salado en seco","brine","cura en seco"],cat:"bases",group:"Curas y marinados",summary:"Agua con sal, o sal sola, aplicada antes de cocinar para sazonar por dentro, retener jugo y, en dosis altas, curar.",what:"En h\xFAmedo, la pieza se sumerge en agua con un porcentaje de sal (a veces az\xFAcar y arom\xE1ticos); la sal entra, cambia las prote\xEDnas y la carne retiene m\xE1s jugo al cocinarse. En seco, se reparte un porcentaje de sal sobre la pieza en c\xE1mara: sazona igual y seca la piel para la brasa. No es lo mismo que el [[adobo]] o la [[marinada]].",base:{for:"5 l al 5 %",items:[["Agua (contando el hielo)","5 l"],["Sal fina sin yodo","250 g"],["Az\xFAcar (opcional)","100 g"],["Laurel, pimienta, ajo, piel de c\xEDtrico, hierbas","al gusto"]],steps:["Calentar 1 l de agua con la sal, el az\xFAcar y los arom\xE1ticos hasta disolver; infusionar 10 minutos.","Completar con 4 l de agua fr\xEDa y hielo. Usar solo por debajo de 4 \xB0C.","Sumergir la pieza del todo, con peso encima, en c\xE1mara a 0-4 \xB0C.","Respetar el tiempo seg\xFAn pieza (ver cambios).","Sacar, enjuagar si hace falta y secar muy bien; mejor en rejilla destapada en c\xE1mara unas horas para que la piel dore.","Desechar la salmuera usada: nunca se reutiliza."]},ratios:[{use:"Lomos y filetes de pescado",ratio:"5 % 15-30 minutos o 10 % 5-10 minutos",note:"Reafirma la carne y ayuda a que no se pegue en la parrilla."},{use:"Pollo en piezas o pechugas",ratio:"5-6 %, 1-2 h",note:"Secar bien antes de la brasa."},{use:"Cerdo (chuleta, presa, costilla)",ratio:"5-6 %, 4-12 h seg\xFAn grosor",note:"Muy \xFAtil en cortes magros."},{use:"Salmuera de equilibrio",ratio:"Sal = 1-1,5 % del peso de agua m\xE1s pieza",note:"No se pasa de sal aunque se alargue; 24-72 h."},{use:"En seco: carne y ave",ratio:"1-1,5 % del peso de la pieza",note:"Salar justo antes de la brasa o con 1-24 h de antelaci\xF3n; entre medias, el jugo queda en la superficie y cuesta dorar."}],variants:[{id:null,name:"Salmuera en seco",note:"Sal en porcentaje sobre la pieza, en c\xE1mara y destapada."},{id:null,name:"Salmuera de equilibrio",note:"Sal calculada sobre el peso total; no puede pasarse."},{id:null,name:"Cura de sal y az\xFAcar",note:"Para pescado: lomos finos 1-3 h, un lomo de salm\xF3n entero 24-48 h; luego lavar y secar."},{id:"adobo",name:"Adobo",note:"Condimento con vinagre y piment\xF3n; otra t\xE9cnica."}],keys:["El porcentaje es en peso de sal sobre agua: 50 g por litro es un 5 %.","Siempre fr\xEDa y en c\xE1mara; nunca a temperatura ambiente.","El az\xFAcar ayuda a dorar, pero en la brasa se quema: poco o nada para parrilla.","Secar a fondo antes de la brasa; con la piel h\xFAmeda no hay costra.","Salar o curar no elimina el anisakis: el pescado que se va a servir crudo o poco hecho se congela antes seg\xFAn la norma (en el centro de la pieza, -20 \xB0C al menos 24 h o -35 \xB0C al menos 15 h)."],errors:[{p:"Demasiado salado",fix:"Tiempo largo o porcentaje alto. Remojar en agua fr\xEDa 20-30 minutos y apuntar el tiempo correcto."},{p:"Textura de jam\xF3n",fix:"Se ha curado. Bajar porcentaje o tiempo."},{p:"Piel blanda en la brasa",fix:"No se sec\xF3. Rejilla destapada en c\xE1mara antes de cocinar."}],history:"Salar para conservar es de las t\xE9cnicas m\xE1s antiguas, y en el Mediterr\xE1neo la sal ha ido unida a la conservaci\xF3n del pescado desde la Antig\xFCedad. Las salmueras suaves, pensadas solo para jugosidad y sabor, se han extendido en la cocina de parrilla en las \xFAltimas d\xE9cadas.",uses:["Pollo y ave a la brasa","Cerdo","Pescado a la parrilla","Piezas grandes asadas","Curado de pescado"],keep:"La salmuera preparada y sin usar, 1 semana a 0-4 \xB0C. La pieza ya salmuerada, cocinarla en 24-48 h.",pro:"Gastronorms con tapa, etiquetados con pieza, porcentaje y horas de entrada y salida. Enfriar el concentrado caliente con hielo pesado como parte del agua. En bolsa de vac\xEDo se gasta mucha menos salmuera.",related:["adobo","marinada","escabeche","jugo-de-carne","aceites-aromatizados"]},{id:"adobo",name:"Adobo",aka:["adobado","adobar","adobo de piment\xF3n","adobo para caz\xF3n","adobo para pinchos morunos"],cat:"bases",group:"Curas y marinados",summary:"Mezcla espa\xF1ola de vinagre, piment\xF3n, ajo, or\xE9gano, comino, sal y aceite para sazonar y aromatizar carne y pescado antes de cocinarlos.",what:"Condimento concentrado, con vinagre y piment\xF3n como base, ajo, or\xE9gano, comino, sal y aceite. Sazona, perfuma y, con el vinagre, cambia algo la textura de la superficie. Tradicionalmente ayudaba a conservar; hoy se usa por sabor. Se diferencia de la [[marinada]] en que es m\xE1s espeso y especiado, y de la [[salmuera]] en que el sabor manda sobre la jugosidad.",base:{for:"2 kg de carne o pescado",items:[["Piment\xF3n dulce","30 g"],["Piment\xF3n picante","5 g"],["Ajo","6-8 dientes"],["Or\xE9gano seco","5 g"],["Comino molido","5 g"],["Pimienta negra molida","2 g"],["Sal fina","30 g (1,5 % del peso)"],["Vinagre de vino o de jerez","150 ml"],["Agua","150 ml"],["Aceite de oliva","80 ml"],["Laurel","2 hojas"]],steps:["Majar el ajo con la sal en el mortero hasta hacer pasta.","A\xF1adir los pimentones, el or\xE9gano, el comino y la pimienta.","Desle\xEDr con el vinagre y el agua, y a\xF1adir el aceite y el laurel.","Cubrir bien la pieza, en recipiente de acero, vidrio o pl\xE1stico alimentario (nunca aluminio), o en bolsa de vac\xEDo.","Dejar en c\xE1mara a 0-4 \xB0C el tiempo que pida la pieza.","Escurrir y secar antes de cocinar. En la brasa, fuego medio: el piment\xF3n se quema y amarga."]},ratios:[{use:"Caz\xF3n y pescado blanco para fre\xEDr",ratio:"M\xE1s vinagre y agua, 8-12 h",note:"Escurrir y enharinar justo antes de fre\xEDr."},{use:"Lomo, presa o costilla de cerdo",ratio:"Adobo base, 12-24 h",note:"En brasa, terminar lejos del fuego vivo."},{use:"Pinchos morunos",ratio:"Adobo base con m\xE1s comino, cilantro molido y un toque de c\xFArcuma, 4-12 h",note:"Dados de 3 cm para que se haga por igual."},{use:"Pollo",ratio:"Adobo base, 6-12 h",note:"Con piel, secar bien antes de asar."},{use:"Para la brasa en general",ratio:"Menos vinagre y m\xE1s aceite",note:"Escurrir 30 minutos en rejilla para que no llamee."}],variants:[{id:null,name:"Adobo de caz\xF3n",note:"Para fre\xEDr; vinagre y comino marcados."},{id:null,name:"Adobo de pinchos morunos",note:"Especias tostadas y molidas, m\xE1s comino."},{id:null,name:"Lomo en adobo",note:"Lomo de cerdo adobado y luego frito o asado; tradicionalmente se conservaba en aceite."},{id:null,name:"Adobos americanos y filipinos",note:"Comparten nombre: llevan chiles, vinagre, a veces soja, y en Filipinas es un guiso."},{id:"escabeche",name:"Escabeche",note:"La pieza se cocina y se conserva en el l\xEDquido \xE1cido."}],keys:["El vinagre trabaja la superficie: en pescado, no pasarse de tiempo.","El piment\xF3n quema muy pronto; en brasa, calor medio y vuelta frecuente.","Sal medida en porcentaje sobre la pieza para repetir el resultado.","Recipientes no reactivos: el \xE1cido ataca el aluminio.","Secar antes de cocinar: el adobo l\xEDquido hierve la carne en vez de dorarla."],errors:[{p:"Pescado blando o pastoso",fix:"Exceso de vinagre o de tiempo. Bajar el \xE1cido o acortar."},{p:"Amargo en la brasa",fix:"Piment\xF3n quemado. Fuego m\xE1s suave y escurrir m\xE1s."},{p:"Sabe solo por fuera",fix:"Piezas gruesas. Cortar m\xE1s peque\xF1o o alargar el tiempo con menos vinagre."},{p:"Llamas en la parrilla",fix:"Exceso de aceite. Escurrir en rejilla antes."}],history:"Adobar con vinagre, sal y especias se usaba en la Pen\xEDnsula para conservar la carne antes de que hubiera fr\xEDo. El piment\xF3n, de pimientos americanos, se incorpor\xF3 despu\xE9s del contacto con Am\xE9rica y acab\xF3 siendo su sabor m\xE1s reconocible.",uses:["Caz\xF3n en adobo","Lomo y presa adobados","Pinchos morunos","Pollo a la brasa","Costilla"],keep:"El adobo preparado, 1 semana a 0-4 \xB0C. La pieza adobada, 2-3 d\xEDas como m\xE1ximo en c\xE1mara: el vinagre no basta para conservar.",pro:"Adobar en bolsas de vac\xEDo: se usa la mitad de adobo y penetra parejo. Etiquetar con hora de inicio. Sacar las piezas a rejilla 30 minutos antes del servicio.",related:["marinada","salmuera","escabeche","mojo-picon","chimichurri","aceites-aromatizados"]},{id:"marinada",name:"Marinada",aka:["marinado","maceraci\xF3n","marinade","macerado"],cat:"bases",group:"Curas y marinados",summary:"L\xEDquido arom\xE1tico con \xE1cido, grasa y arom\xE1ticos para perfumar carnes y pescados y, en superficie, ablandarlos.",what:"Mezcla de un \xE1cido (vino, vinagre, c\xEDtrico, yogur), una grasa y arom\xE1ticos. Perfuma la superficie; dentro de la pieza solo entra unos mil\xEDmetros, salvo la sal. Puede ser cruda o cocida; las de vino para caza se cuecen. Las c\xEDtricas cortas, tipo ceviche, coagulan la prote\xEDna del pescado. Se distingue del [[adobo]], m\xE1s espeso y con piment\xF3n, y de la [[salmuera]], cuyo fin es la jugosidad.",base:{for:"1 l (para 3-4 kg de carne)",items:[["Vino tinto o blanco","600 ml"],["Aceite de oliva","150 ml"],["Vinagre de vino","50 ml"],["Cebolla en l\xE1minas","150 g"],["Zanahoria en rodajas","100 g"],["Ajo aplastado","4 dientes"],["Tomillo, romero, laurel","unas ramas"],["Pimienta negra en grano y enebro","5 g y 10 bayas"]],steps:["Cruda: mezclar todo y cubrir la pieza.","Cocida: rehogar las verduras, mojar con el vino y el vinagre, hervir 10 minutos, a\xF1adir el aceite y enfriar del todo antes de usar.","Marinar en c\xE1mara a 0-4 \xB0C, en recipiente no reactivo o bolsa de vac\xEDo, dando la vuelta a la pieza.","Escurrir y secar muy bien antes de dorar o de la brasa.","La marinada que ha estado con carne cruda solo se aprovecha si se hierve, por ejemplo para la salsa del guiso."]},ratios:[{use:"Caza y carnes para guisar (venado, jabal\xED)",ratio:"Marinada de vino cocida, 12-48 h",note:"Luego se reduce para la salsa."},{use:"Cordero y cabrito a la brasa",ratio:"Aceite, ajo, romero y ralladura de lim\xF3n, 4-12 h",note:"El zumo, al final: \xE1cido largo endurece la superficie."},{use:"Pollo",ratio:"Yogur o suero con especias, 4-12 h",note:"El l\xE1cteo ablanda suave y dora bien."},{use:"Pescado para la brasa",ratio:"Aceite, hierbas y ralladura, 15-30 minutos",note:"El c\xEDtrico en zumo, justo al servir."},{use:"Ceviche y marinadas c\xEDtricas",ratio:"Lima o lim\xF3n y sal, 5-15 minutos",note:"Pescado previamente congelado seg\xFAn norma, por el anisakis."},{use:"Marinadas con pi\xF1a, papaya o kiwi",ratio:"30 minutos a 2 h como m\xE1ximo",note:"Sus enzimas dejan la carne harinosa si se pasan."}],variants:[{id:null,name:"Marinada cocida de vino",note:"Para caza y guisos largos."},{id:null,name:"Marinada c\xEDtrica",note:"Para ceviches y pescado crudo."},{id:null,name:"Marinada de yogur",note:"Para ave y cordero; ablanda sin deshacer."},{id:"adobo",name:"Adobo",note:"Versi\xF3n espa\xF1ola con piment\xF3n y vinagre."},{id:"escabeche",name:"Escabeche",note:"\xC1cido y aceite sobre una pieza ya cocinada."}],keys:["La marinada perfuma; para sazonar por dentro, sal o [[salmuera]].","Mucho \xE1cido o mucho tiempo deja la superficie harinosa.","El aceite lleva los aromas que se disuelven en grasa (ajo, hierbas, especias).","Miel y az\xFAcar se queman en la brasa: pincelar al final.","Siempre en c\xE1mara; el vac\xEDo reduce cantidad y tiempo."],errors:[{p:"Textura harinosa o pastosa",fix:"Exceso de tiempo, de \xE1cido o de enzimas. Acortar y poner el \xE1cido al final."},{ o y el tiempo corto.","En el pase, poca cantidad y sobre hielo; lo que sobra no vuelve al biber\xF3n grande.","El aceite de oliva virgen extra amarga si se tritura mucho; para aceite verde, neutro o suave.","Luz, calor y aire enrancian: biber\xF3n opaco y lleno."],errors:[{p:"El verde se vuelve marr\xF3n",fix:"Calor por encima de 70 \xB0C o luz. Triturar menos tiempo y enfriar enseguida."},{p:"Turbio",fix:"Agua en las hierbas o colado apretando. Secar mejor y filtrar sin presi\xF3n."},{p:"Amargo",fix:"Virgen extra triturado o especias quemadas. Cambiar de aceite y bajar temperatura."},{p:"Rancio",fix:"Demasiado tiempo o mal guardado. Producir para pocos d\xEDas."}],history:"Aromatizar aceite con hierbas y especias es antiguo en el Mediterr\xE1neo. Los aceites verdes y de marisco filtrados se han hecho habituales en la cocina de restaurante para terminar platos con color y aroma.",uses:["Terminar pescados y carnes de brasa","Crudos y tartares","Arroces","Vinagretas","Emulsiones y mayonesas","Cremas fr\xEDas"],keep:"Con producto fresco (ajo, hierbas, marisco): 0-4 \xB0C, m\xE1ximo 4 d\xEDas; congelados en porciones, 2-3 meses. Con especias secas: en fr\xEDo, 2-3 semanas. Desechar si hay burbujas, turbidez o envase hinchado.",pro:"Producir para 2-3 d\xEDas. Congelar el aceite verde en cubiteras o bolsitas y descongelar en c\xE1mara. En el pase, biberones peque\xF1os sobre hielo, rotulados con fecha.",related:["emulsiones","vinagreta","pesto","fondo-de-marisco","chimichurri","mayonesa","alioli"]},{id:"reducciones",name:"Reducciones",aka:["reducci\xF3n","reducir","reducci\xF3n de vino","reducci\xF3n de vinagre","reducci\xF3n de Pedro Xim\xE9nez","gastrique"],cat:"bases",group:"Bases",summary:"Evaporar agua de vino, vinagre, fondo o nata para concentrar sabor, cuerpo y color; base de muchas salsas.",what:"Reducir es hervir un l\xEDquido para que pierda agua y concentre lo dem\xE1s. Es base de salsas emulsionadas como la [[bearnesa]] y el [[beurre-blanc]], de las salsas de
